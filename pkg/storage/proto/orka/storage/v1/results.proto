syntax = "proto3";

package orka.storage.v1;

import "google/protobuf/timestamp.proto";
import "orka/storage/v1/options.proto";

option go_package = "github.com/orka-agents/orka/pkg/storage/v1/wire/storagepb;storagepb";

// Results serves autonomous plan state. Task results and prompt result
// receipts join this service with blob framing.
service Results {
  option (go_interface) = "PlanStore";

  rpc SavePlan(SavePlanRequest) returns (SavePlanResponse) {
    option (kind) = METHOD_KIND_WRITE;
    option (rpc_since) = 1;
  }
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse) {
    option (kind) = METHOD_KIND_READ;
    option (rpc_since) = 1;
  }
  rpc DeletePlan(DeletePlanRequest) returns (DeletePlanResponse) {
    option (kind) = METHOD_KIND_WRITE;
    option (rpc_since) = 1;
  }
}

message PlanState {
  string task_name = 1;
  string namespace = 2;
  int64 iteration = 3;
  string summary = 4;
  int64 progress_pct = 5;
  bool goal_complete = 6;
  string plan_document = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message SavePlanRequest {
  string namespace = 1;
  string task_name = 2;
  PlanState plan = 3;
}

message SavePlanResponse {}

message GetPlanRequest {
  string namespace = 1;
  string task_name = 2;
}

message GetPlanResponse {
  PlanState plan = 1;
}

message DeletePlanRequest {
  string namespace = 1;
  string task_name = 2;
}

message DeletePlanResponse {}
