syntax = "proto3";

package orka.storage.v1;

import "google/protobuf/timestamp.proto";
import "orka/storage/v1/options.proto";

option go_package = "github.com/orka-agents/orka/pkg/storage/v1/wire/storagepb;storagepb";

// Results serves Task results, prompt result receipts and autonomous plan
// state. Result and receipt bytes travel with blob framing.
service Results {
  option (go_interface) = "ResultStore";
  option (go_interface) = "PromptResultReceiptStore";
  option (go_interface) = "PlanStore";

  rpc SaveResult(stream SaveResultRequest) returns (SaveResultResponse) {
    option (kind) = METHOD_KIND_WRITE;
    option (rpc_since) = 1;
  }
  rpc GetResult(GetResultRequest) returns (stream GetResultResponse) {
    option (kind) = METHOD_KIND_READ;
    option (rpc_since) = 1;
  }
  rpc DeleteResult(DeleteResultRequest) returns (DeleteResultResponse) {
    option (kind) = METHOD_KIND_WRITE;
    option (rpc_since) = 1;
  }
  rpc SavePromptResultReceipt(stream SavePromptResultReceiptRequest) returns (SavePromptResultReceiptResponse) {
    option (kind) = METHOD_KIND_WRITE;
    option (rpc_since) = 1;
  }
  rpc GetPromptResultReceipt(GetPromptResultReceiptRequest) returns (stream GetPromptResultReceiptResponse) {
    option (kind) = METHOD_KIND_READ;
    option (rpc_since) = 1;
  }
  rpc SavePlan(SavePlanRequest) returns (SavePlanResponse) {
    option (kind) = METHOD_KIND_WRITE;
    option (rpc_since) = 1;
  }
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse) {
    option (kind) = METHOD_KIND_READ;
    option (rpc_since) = 1;
  }
  rpc DeletePlan(DeletePlanRequest) returns (DeletePlanResponse) {
    option (kind) = METHOD_KIND_WRITE;
    option (rpc_since) = 1;
  }
}

message SaveResultRequest {
  string namespace = 1;
  string task_name = 2;
  bytes data = 3 [(blob) = true];
}

message SaveResultResponse {}

message GetResultRequest {
  string namespace = 1;
  string task_name = 2;
}

message GetResultResponse {
  bytes data = 1 [(blob) = true];
}

message DeleteResultRequest {
  string namespace = 1;
  string task_name = 2;
}

message DeleteResultResponse {}

message PromptResultReceipt {
  string attempt_id = 1;
  string namespace = 2;
  string task_name = 3;
  string operation_id = 4;
  string operation_digest = 5;
  bytes data = 6 [(blob) = true];
}

message SavePromptResultReceiptRequest {
  PromptResultReceipt receipt = 1;
}

message SavePromptResultReceiptResponse {}

message GetPromptResultReceiptRequest {
  string attempt_id = 1;
}

message GetPromptResultReceiptResponse {
  PromptResultReceipt receipt = 1;
}

message PlanState {
  string task_name = 1;
  string namespace = 2;
  int64 iteration = 3;
  string summary = 4;
  int64 progress_pct = 5;
  bool goal_complete = 6;
  string plan_document = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message SavePlanRequest {
  string namespace = 1;
  string task_name = 2;
  PlanState plan = 3;
}

message SavePlanResponse {}

message GetPlanRequest {
  string namespace = 1;
  string task_name = 2;
}

message GetPlanResponse {
  PlanState plan = 1;
}

message DeletePlanRequest {
  string namespace = 1;
  string task_name = 2;
}

message DeletePlanResponse {}
