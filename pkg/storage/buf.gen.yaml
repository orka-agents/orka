# Generates pkg/storage/v1/wire/storagepb. scripts/generate-storage-proto.sh
# puts the pinned protoc-gen-go and protoc-gen-go-grpc first on PATH.
version: v2
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/orka-agents/orka/pkg/storage
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=github.com/orka-agents/orka/pkg/storage
