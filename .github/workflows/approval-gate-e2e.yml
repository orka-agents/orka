name: Approval Gate E2E

on:
  push:
    paths:
      - ".github/workflows/approval-gate-e2e.yml"
      - "Makefile"
      - "api/**"
      - "internal/approvals/**"
      - "internal/api/**"
      - "internal/controller/**"
      - "internal/events/**"
      - "internal/labels/**"
      - "internal/store/**"
      - "internal/tools/**"
      - "internal/workerenv/**"
      - "internal/worker/**"
      - "workers/ai/**"
      - "workers/common/**"
      - "scripts/lib/e2e-admission-tls.sh"
      - "scripts/lib/ensure-static-mode-namespace.sh"
      - "test/e2e/**"
      - "test/utils/**"
      - "config/**"
  pull_request:
    paths:
      - ".github/workflows/approval-gate-e2e.yml"
      - "Makefile"
      - "api/**"
      - "internal/approvals/**"
      - "internal/api/**"
      - "internal/controller/**"
      - "internal/events/**"
      - "internal/labels/**"
      - "internal/store/**"
      - "internal/tools/**"
      - "internal/workerenv/**"
      - "internal/worker/**"
      - "workers/ai/**"
      - "workers/common/**"
      - "scripts/lib/e2e-admission-tls.sh"
      - "scripts/lib/ensure-static-mode-namespace.sh"
      - "test/e2e/**"
      - "test/utils/**"
      - "config/**"

permissions:
  contents: read

concurrency:
  group: approval-gate-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approval-gate-e2e:
    name: Approval Gate E2E
    runs-on: ubuntu-latest
    env:
      KIND_CLUSTER: orka-approval-gate-e2e
      E2E_EPHEMERAL_CLUSTER: "true"
      E2E_GO_TEST_TIMEOUT: 30m
      E2E_GINKGO_FOCUS: Human Approval Gate
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for Docker-heavy E2E
        uses: ./.github/actions/free-disk-space

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install kind
        uses: ./.github/actions/setup-kind

      - name: Verify kind installation
        run: kind version

      - name: Run approval gate e2e
        run: |
          go mod tidy
          make test-e2e
