name: Prepare Release
run-name: Prepare ${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to prepare and qualify (vX.Y.Z, vX.Y.Z-beta.N, or vX.Y.Z-rc.N)
        required: true
        type: string

permissions:
  contents: read

# Serialize preparation even when two versions target the same release line.
concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare candidate and start qualification
    if: github.repository == 'orka-agents/orka' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout trusted preparation workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Generate, validate, commit, and dispatch the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 scripts/release_workflow.py prepare "${RELEASE_VERSION}"
