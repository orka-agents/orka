name: Live ACP Runtime E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".github/workflows/live-acp-runtime-e2e.yml"
      - "Dockerfile"
      - "Makefile"
      - ".agents/skills/kindctl/**"
      - ".agents/skills/vekil-reverse-proxy-deploy/**"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "pkg/**"
      - "scripts/apply-acp-production.sh"
      - "scripts/check-acp-crd-cutover.sh"
      - "scripts/lib/kind-local-registry.sh"
      - "scripts/lib/live-acp-runtime-kind-bootstrap.sh"
      - "scripts/live-acp-runtime-e2e.sh"
      - "scripts/live-acp-runtime-kind-e2e.sh"
      - "scripts/render-acp-runtime-images.sh"
      - "scripts/render-worker-images.sh"
      - "workers/**"

permissions:
  contents: read

concurrency:
  group: live-acp-runtime-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-acp-runtime-e2e:
    name: ACP provider smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: live-acp-runtime-smoke
    env:
      ACP_E2E_OPENCODE_CONTEXT_WINDOW: "32768"
      ACP_E2E_OPENCODE_MAX_TOKENS: "4096"
      ACP_E2E_OPENCODE_MODEL: "openai/gpt-5.4"
      ACP_E2E_REQUIRE_PARALLEL: "1"
      ACP_E2E_KIND_TAG: live-acp-${{ github.run_id }}-${{ github.run_attempt }}
      KIND_VERSION: v0.31.0
      KIND_SHA256_AMD64: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
      KIND_SHA256_ARM64: 8e1014e87c34901cc422a1445866835d1e666f2a61301c27e722bdeab5a1f7e4
    steps:
      - name: Validate trusted workflow ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Run this secret-backed workflow from the default branch (${DEFAULT_BRANCH}) only." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for Docker-heavy live E2E
        run: |
          set -Eeuo pipefail
          echo "Disk usage before cleanup"
          df -h
          docker system df || true

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift

          docker system prune -af || true
          docker builder prune -af || true

          echo "Disk usage after cleanup"
          df -h
          docker system df || true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          set -Eeuo pipefail
          arch="$(go env GOARCH)"
          case "${arch}" in
            amd64) expected_sha="${KIND_SHA256_AMD64}" ;;
            arm64) expected_sha="${KIND_SHA256_ARM64}" ;;
            *) echo "unsupported runner architecture: ${arch}" >&2; exit 1 ;;
          esac
          curl -fsSL --retry 3 --retry-delay 2 -o ./kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${arch}"
          printf '%s  %s\n' "${expected_sha}" ./kind | sha256sum --check --strict -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify toolchain
        run: |
          set -Eeuo pipefail
          docker version
          git --version
          gh --version
          jq --version
          kind version
          kubectl version --client=true

      - name: Run canonical ACP smoke in Kind
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${COPILOT_GITHUB_TOKEN}" ]]; then
            echo "COPILOT_GITHUB_TOKEN must be configured in the live-acp-runtime-smoke environment." >&2
            exit 1
          fi
          bash scripts/live-acp-runtime-kind-e2e.sh
