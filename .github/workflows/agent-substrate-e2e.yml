name: Agent Substrate E2E

on:
  workflow_dispatch:
    inputs:
      substrate_suspend_resume:
        description: Run the provider-pin suspend/cold-resume lane
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/agent-substrate-e2e.yml"
      - "Dockerfile"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "hack/**"
      - "internal/**"
      - "pkg/**"
      - "scripts/agent-substrate-e2e.sh"
      - "scripts/fixtures/openai-responses/**"
      - "scripts/lib/e2e-admission-tls.sh"
      - "scripts/lib/ensure-static-mode-namespace.sh"
      - "workers/**"
  push:
    paths:
      - ".dockerignore"
      - ".github/workflows/agent-substrate-e2e.yml"
      - "Dockerfile"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "hack/**"
      - "internal/**"
      - "pkg/**"
      - "scripts/agent-substrate-e2e.sh"
      - "scripts/fixtures/openai-responses/**"
      - "scripts/lib/e2e-admission-tls.sh"
      - "scripts/lib/ensure-static-mode-namespace.sh"
      - "workers/**"

permissions:
  contents: read

concurrency:
  group: agent-substrate-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-substrate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      KIND_CLUSTER: orka-agent-substrate-e2e
      KO_VERSION: v0.18.1
      SUBSTRATE_REF: b80031d260959b1fc5c6f61e3099fe2a6d368af1
      SUBSTRATE_E2E_EXTENDED: "1"
      SUBSTRATE_E2E_SUSPEND_RESUME: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for Docker-heavy E2E
        uses: ./.github/actions/free-disk-space

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The upstream Substrate clone's go.mod requires a newer toolchain
          # than this repository's go directive, and the E2E script runs with
          # GOTOOLCHAIN=local, so this floor must track Substrate, not go.mod.
          go-version: "1.26.3"
          cache: true

      - name: Install kind
        uses: ./.github/actions/setup-kind

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          go install "github.com/google/ko@${KO_VERSION}"

      - name: Verify toolchain
        run: |
          kind version
          kubectl version --client=true
          ko version

      - name: Run Agent Substrate E2E
        run: bash scripts/agent-substrate-e2e.sh

  agent-substrate-suspend-resume:
    name: Agent Substrate suspend/cold-resume conformance
    # The pinned Substrate release cannot express the required DataOnly
    # snapshot policy. PR and push runs keep this provider row visibly
    # skipped; enable the dispatch input only while validating an updated pin.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.substrate_suspend_resume }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      KIND_CLUSTER: orka-agent-substrate-suspend-resume-e2e
      KO_VERSION: v0.18.1
      SUBSTRATE_REF: b80031d260959b1fc5c6f61e3099fe2a6d368af1
      SUBSTRATE_E2E_EXTENDED: "1"
      SUBSTRATE_E2E_SUSPEND_RESUME: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for Docker-heavy E2E
        uses: ./.github/actions/free-disk-space

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"
          cache: true

      - name: Install kind
        uses: ./.github/actions/setup-kind

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          go install "github.com/google/ko@${KO_VERSION}"

      - name: Verify toolchain
        run: |
          kind version
          kubectl version --client=true
          ko version

      - name: Run Agent Substrate suspend/cold-resume E2E
        run: bash scripts/agent-substrate-e2e.sh
