name: Agent Substrate MCP E2E

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/agent-substrate-e2e.yml"
      - "Dockerfile"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "hack/**"
      - "internal/**"
      - "pkg/**"
      - "scripts/agent-substrate-e2e.sh"
      - "scripts/lib/substrate-*.sh"
      - "scripts/generate-substrate-proto.sh"
      - "scripts/lib/e2e-admission-tls.sh"
      - "scripts/lib/ensure-static-mode-namespace.sh"
      - "workers/**"
  push:
    paths:
      - ".dockerignore"
      - ".github/workflows/agent-substrate-e2e.yml"
      - "Dockerfile"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "hack/**"
      - "internal/**"
      - "pkg/**"
      - "scripts/agent-substrate-e2e.sh"
      - "scripts/lib/substrate-*.sh"
      - "scripts/generate-substrate-proto.sh"
      - "scripts/lib/e2e-admission-tls.sh"
      - "scripts/lib/ensure-static-mode-namespace.sh"
      - "workers/**"

permissions:
  contents: read

concurrency:
  group: agent-substrate-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-substrate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      KIND_CLUSTER: orka-agent-substrate-e2e
      KO_VERSION: v0.18.1
      # Native MCP tool routing and cleanup run on every change.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for Docker-heavy E2E
        uses: ./.github/actions/free-disk-space

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Install kind
        uses: ./.github/actions/setup-kind

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          go install "github.com/google/ko@${KO_VERSION}"

      - name: Verify toolchain
        run: |
          kind version
          kubectl version --client=true
          ko version

      - name: Run Agent Substrate MCP E2E
        run: bash scripts/agent-substrate-e2e.sh
