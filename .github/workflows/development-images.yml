name: Development Images

on:
  push:
    branches: [main]

permissions:
  contents: read

# Keep the in-flight build running and coalesce pending builds to latest main.
# Publication is serialized; the publisher also checks main's current SHA so
# an older queued run cannot overwrite newer development aliases.
concurrency:
  group: development-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'orka-agents/orka'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate development publication and chart inputs
        run: |
          set -euo pipefail
          make ensure-ui-embed
          go test ./cmd/build/release ./cmd/build/helmify -count=1
          go test ./internal/controller -run '^TestJobBuilder_Build_(NativeWorkerImagePullPolicies|PlatformHelperImagePullPolicies|UserTaskImagePullPolicyUnchanged)$' -count=1
          make manifests
          git diff --exit-code
      - name: Select the complete release image inventory
        id: matrix
        run: echo "matrix=$(go run ./cmd/build/release development-matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Free disk space for multi-platform builds
        uses: ./.github/actions/free-disk-space
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push only by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ matrix.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.0.0-dev
          cache-from: type=gha,scope=development-${{ matrix.name }}
          cache-to: type=gha,scope=development-${{ matrix.name }},mode=max
      - name: Save the immutable image index digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/development-digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/development-digests/digest-${IMAGE_NAME}.txt"
      - name: Upload this build's digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-digest-${{ matrix.name }}-${{ github.sha }}
          # Preserve successful matrix artifacts when only failed jobs rerun.
          overwrite: true
          path: ${{ runner.temp }}/development-digests
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download only this run's image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: development-digest-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/development-digests
      - name: Verify the complete set and promote commit and development tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: go run ./cmd/build/release development-publish "$RUNNER_TEMP/development-digests" "$SOURCE_SHA"
      - name: Upload digest-pinned references and Helm values
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-images-${{ github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/development-digests/images.json
            ${{ runner.temp }}/development-digests/values.json
          if-no-files-found: error
          retention-days: 90
