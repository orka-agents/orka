name: E2E Tests

on:
  push:
    # Run only when something this lane builds or exercises changes. Later
    # patterns override earlier ones, so the self and shared-action paths are
    # re-included after .github is excluded. UI, docs, website, and example
    # changes are covered by UI Lint/Tests, Website, Docs Check, and Go Tests.
    paths:
      - "**"
      - "!.agents/**"
      - "!.claude/**"
      - "!.github/**"
      - ".github/workflows/test-e2e.yml"
      - ".github/actions/**"
      - "!website/**"
      - "!docs/**"
      - "!ui/**"
      - "!examples/**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"
  pull_request:
    paths:
      - "**"
      - "!.agents/**"
      - "!.claude/**"
      - "!.github/**"
      - ".github/workflows/test-e2e.yml"
      - ".github/actions/**"
      - "!website/**"
      - "!docs/**"
      - "!ui/**"
      - "!examples/**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"

permissions:
  contents: read

concurrency:
  # Supersede earlier runs of the same pull request. Pushes get a unique
  # group and never cancel.
  group: ${{ github.event_name == 'pull_request' && format('test-e2e-pr-{0}', github.event.pull_request.number) || format('test-e2e-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-e2e:
    name: ${{ matrix.name }} (${{ matrix.part }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix:
        lane: [general, agent-runtime]
        # Each lane runs as two jobs with their own clusters: part 1 runs the
        # spec files that match split, and part 2 runs the rest.
        part: [1, 2]
        include:
          - lane: general
            name: Run on Ubuntu
            cluster: orka-test-e2e
            labels: "!agent-runtime"
            # About half of the lane's spec time.
            split: '/(scheduled_task|coordination_advanced|fake_forge)_test\.go'
            idle_ttl: 5s
            # The go test timeout also covers BeforeSuite's image build;
            # passing runs take about 30m in total.
            job_timeout: 60
            test_timeout: 45m
            ginkgo_timeout: 40m
          # The built-in runtime lifecycle specs restart the controller and
          # park, replace, and scale RuntimePools, so they get their own
          # cluster.
          - lane: agent-runtime
            name: Agent runtime lifecycle
            cluster: orka-test-e2e-agent-runtime
            labels: agent-runtime
            # One Ordered container with about 60% of the lane's spec time.
            split: '/agent_runtime_lifecycle_test\.go'
            idle_ttl: 15m
            job_timeout: 75
            test_timeout: 60m
            ginkgo_timeout: 55m
    env:
      KIND_CLUSTER: ${{ matrix.cluster }}
      E2E_CLEANUP_REPORT_DIR: ${{ github.workspace }}/bin/e2e-cleanup/${{ matrix.lane }}-${{ matrix.part }}
      E2E_GINKGO_LABEL_FILTER: ${{ matrix.labels }}
      E2E_GINKGO_FOCUS_FILE: ${{ matrix.part == 1 && matrix.split || '' }}
      E2E_GINKGO_SKIP_FILE: ${{ matrix.part == 2 && matrix.split || '' }}
      E2E_ACP_IDLE_POOL_TTL: ${{ matrix.idle_ttl }}
      E2E_GO_TEST_TIMEOUT: ${{ matrix.test_timeout }}
      E2E_GINKGO_TIMEOUT: ${{ matrix.ginkgo_timeout }}
      E2E_GINKGO_GRACE_PERIOD: 2m
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for Docker-heavy E2E
        uses: ./.github/actions/free-disk-space
        with:
          # The runner starts with ~86G free; the space is needed only later.
          background: "true"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install kind
        uses: ./.github/actions/setup-kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          set -Eeuo pipefail
          go mod tidy
          . scripts/lib/e2e-cleanup.sh
          status=0
          # make test-e2e would also run fmt and vet, which lint covers.
          if make setup-test-e2e manifests generate test-e2e-run; then
            :
          else
            status=$?
          fi
          if ! e2e_cleanup_kind "${KIND_CLUSTER}" "${E2E_CLEANUP_REPORT_DIR}"; then
            echo "::error::Kind teardown was not proved"
            status=1
          fi
          if ! e2e_cleanup_evidence_passed "${E2E_CLEANUP_REPORT_DIR}"; then
            echo "::error::normal resource cleanup was not proved"
            status=1
          fi
          exit "${status}"

      - name: Upload exact cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-cleanup-evidence-${{ matrix.lane }}-${{ matrix.part }}
          path: ${{ env.E2E_CLEANUP_REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 7
