name: E2E Tests

on:
  push:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "website/**"
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "website/**"
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  test-e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Run on Ubuntu
            suite: general
            cluster: orka-test-e2e
            labels: "!agent-runtime"
            idle_ttl: 5s
            job_timeout: 60
            test_timeout: 50m
          # The built-in runtime lifecycle specs restart the controller and
          # park, replace, and scale RuntimePools, so they get their own
          # cluster.
          - name: Agent runtime lifecycle
            suite: agent-runtime
            cluster: orka-test-e2e-agent-runtime
            labels: agent-runtime
            idle_ttl: 15m
            job_timeout: 90
            test_timeout: 75m
    env:
      KIND_CLUSTER: ${{ matrix.cluster }}
      E2E_CLEANUP_REPORT_DIR: ${{ github.workspace }}/bin/e2e-cleanup/${{ matrix.suite }}
      E2E_GINKGO_LABEL_FILTER: ${{ matrix.labels }}
      E2E_ACP_IDLE_POOL_TTL: ${{ matrix.idle_ttl }}
      E2E_GO_TEST_TIMEOUT: ${{ matrix.test_timeout }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for Docker-heavy E2E
        uses: ./.github/actions/free-disk-space

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install kind
        uses: ./.github/actions/setup-kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          set -Eeuo pipefail
          go mod tidy
          . scripts/lib/e2e-cleanup.sh
          status=0
          if make test-e2e; then
            :
          else
            status=$?
          fi
          if ! e2e_cleanup_kind "${KIND_CLUSTER}" "${E2E_CLEANUP_REPORT_DIR}"; then
            echo "::error::Kind teardown was not proved"
            status=1
          fi
          if ! e2e_cleanup_evidence_passed "${E2E_CLEANUP_REPORT_DIR}"; then
            echo "::error::normal resource cleanup was not proved"
            status=1
          fi
          exit "${status}"

      - name: Upload exact cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-cleanup-evidence-${{ matrix.suite }}
          path: ${{ env.E2E_CLEANUP_REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 7
