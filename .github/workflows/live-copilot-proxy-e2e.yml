name: AIKit Qwen E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: aikit-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  aikit-e2e:
    name: AIKit Qwen E2E
    runs-on: ubuntu-latest
    # Setup, bounded model qualification and the 45-minute suite need
    # separate time for teardown and cleanup-evidence upload.
    timeout-minutes: 120
    env:
      KIND_CLUSTER: orka-aikit-e2e
      E2E_CLEANUP_REPORT_DIR: ${{ github.workspace }}/bin/e2e-cleanup/aikit
      AIKIT_IMAGE: docker.io/sozercan/orka-aikit:qwen35-4b-recurrent-20261010@sha256:c6fa99fdd740c930c18e407c553dd28d06bf32bb2d3db59b71bc6137f17d5516
      AIKIT_MODEL: qwen-3.5-4b
    steps:
      - name: Clone Orka
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record CPU capabilities
        run: |
          lscpu --json | jq '{cpu: [.lscpu[] | select(
            .field == "Architecture:" or .field == "CPU(s):" or
            .field == "Vendor ID:" or .field == "Model name:" or
            .field == "Thread(s) per core:" or .field == "Core(s) per socket:" or
            .field == "CPU max MHz:" or .field == "Flags:")]}'

      - name: Free disk space for Docker-heavy E2E
        uses: ./.github/actions/free-disk-space

      - name: Configure Docker Hub cache
        uses: ./.github/actions/docker-hub-mirror

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install kind
        uses: ./.github/actions/setup-kind

      - name: Run AIKit Qwen E2E
        run: bash scripts/aikit-e2e.sh

      - name: Upload exact cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aikit-cleanup-evidence
          path: ${{ env.E2E_CLEANUP_REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 7
