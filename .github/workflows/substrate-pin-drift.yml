name: Substrate Pin Drift Report

# Compare the tested official provider pin and protocol with upstream.

on:
  schedule:
    - cron: "17 7 * * 1" # weekly, Monday 07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  report:
    name: Compare pin against upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare Substrate pin with upstream HEAD
        run: |
          set -Eeuo pipefail
          source hack/agent-substrate/upstream.env
          pin="${SUBSTRATE_UPSTREAM_COMMIT}"
          repo_url="${SUBSTRATE_UPSTREAM_REPOSITORY}"
          workdir="$(mktemp -d)"
          git clone --quiet "${repo_url}" "${workdir}/substrate"
          cd "${workdir}/substrate"
          if ! git cat-file -e "${pin}^{commit}"; then
            echo "::error::pinned Substrate commit ${pin} is not reachable upstream; the pin may need urgent attention"
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          behind="$(git rev-list --count "${pin}..HEAD")"
          pin_date="$(git show -s --format=%cs "${pin}")"
          head_date="$(git show -s --format=%cs HEAD)"
          protocol_changes="$(git rev-list --count "${pin}..HEAD" -- pkg/proto/ateapipb/ateapi.proto)"
          {
            echo "## Substrate pin drift"
            echo ""
            echo "| | commit | date |"
            echo "|---|---|---|"
            echo "| pinned | \`${pin}\` | ${pin_date} |"
            echo "| upstream HEAD | \`${head_sha}\` | ${head_date} |"
            echo ""
            echo "Pin is **${behind}** commits behind upstream HEAD."
            echo ""
            echo "Protocol commits since the tested pin: ${protocol_changes}."
            echo "An upgrade requires protocol regeneration and native conformance."
          } >> "${GITHUB_STEP_SUMMARY}"
