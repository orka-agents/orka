name: Helm Chart

on:
  push:
    branches:
      - main
      - "release-*"
    paths:
      - "api/**"
      - "cmd/build/helmify/**"
      - "config/**"
      - "internal/controller/**"
      - "manifest_staging/**"
      - "charts/orka/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/apply-helm-crds.sh"
      - ".github/workflows/helm-chart.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/build/helmify/**"
      - "config/**"
      - "internal/controller/**"
      - "manifest_staging/**"
      - "charts/orka/**"
      - "deploy/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/apply-helm-crds.sh"
      - ".github/workflows/helm-chart.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('helm-chart-pr-{0}', github.event.pull_request.number) || format('helm-chart-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    name: Validate Helm chart and CRD lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIND_CLUSTER: orka-helm-crd-lifecycle
      KIND_IMAGE: kindest/node:v1.33.7@sha256:d26ef333bdb2cbe9862a0f7c3803ecc7b4303d8cea8e814b481b09949d353040
      KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
      KIND_VERSION: v0.31.0
      NAMESPACE: orka-helm-crd-lifecycle
      PAUSE_IMAGE_REPOSITORY: registry.k8s.io/pause
      PAUSE_IMAGE_TAG: 3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify generated chart and package
        run: |
          set -euo pipefail

          make manifests
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Generated staging manifests are stale." >&2
            git status --short --untracked-files=all >&2
            exit 1
          fi

          grep -Fq 'get secret harness-wrapper-auth' config/harness-wrapper/README.md
          grep -Fq 'create secret generic harness-wrapper-auth' config/harness-wrapper/README.md
          test "$(grep -c 'secretName: harness-wrapper-auth' manifest_staging/deploy/orka.yaml)" -eq 2
          if awk '
            /^---$/ { kind = ""; name = "" }
            /^kind: / { kind = $2 }
            /^  name: / { name = $2 }
            kind == "Secret" && name == "harness-wrapper-auth" { found = 1 }
            END { exit(found ? 0 : 1) }
          ' manifest_staging/deploy/orka.yaml; then
            echo "The raw installer must require a pre-created harness-wrapper-auth Secret, not embed one." >&2
            exit 1
          fi

          go test ./cmd/build/helmify
          helm lint cmd/build/helmify/static
          helm lint manifest_staging/charts/orka

          default_render=$(mktemp)
          secondary_render=$(mktemp)
          secondary_rbac=$(mktemp)
          secondary_serviceaccounts=$(mktemp)
          secondary_gateway_policy=$(mktemp)
          long_render=$(mktemp)
          long_wrapper_service=$(mktemp)
          long_wrapper_secret=$(mktemp)
          trap 'rm -f "${default_render}" "${secondary_render}" "${secondary_rbac}" "${secondary_serviceaccounts}" "${secondary_gateway_policy}" "${long_render}" "${long_wrapper_service}" "${long_wrapper_secret}"' EXIT
          helm template orka manifest_staging/charts/orka \
            --namespace "${NAMESPACE}" \
            --set-string workers.harnessWrapper.auth.token=mock-token \
            > "${default_render}"
          helm template secondary manifest_staging/charts/orka \
            --namespace "${NAMESPACE}" \
            --set-string workers.harnessWrapper.auth.token=mock-token \
            > "${secondary_render}"
          helm template secondary manifest_staging/charts/orka \
            --namespace "${NAMESPACE}" \
            --set-string workers.harnessWrapper.auth.token=mock-token \
            --show-only templates/rbac.yaml \
            > "${secondary_rbac}"
          helm template secondary manifest_staging/charts/orka \
            --namespace "${NAMESPACE}" \
            --set-string workers.harnessWrapper.auth.token=mock-token \
            --show-only templates/serviceaccount.yaml \
            > "${secondary_serviceaccounts}"
          helm template secondary manifest_staging/charts/orka \
            --namespace "${NAMESPACE}" \
            --set-string workers.harnessWrapper.auth.token=mock-token \
            --show-only templates/gateway-task-admission-policy.yaml \
            > "${secondary_gateway_policy}"

          long_release=$(printf 'r%.0s' {1..53})
          helm template "${long_release}" manifest_staging/charts/orka \
            --namespace "${NAMESPACE}" \
            --set-string workers.harnessWrapper.auth.token=mock-token \
            > "${long_render}"
          helm template "${long_release}" manifest_staging/charts/orka \
            --namespace "${NAMESPACE}" \
            --set-string workers.harnessWrapper.auth.token=mock-token \
            --show-only templates/harness-wrapper-service.yaml \
            > "${long_wrapper_service}"
          helm template "${long_release}" manifest_staging/charts/orka \
            --namespace "${NAMESPACE}" \
            --set-string workers.harnessWrapper.auth.token=mock-token \
            --show-only templates/harness-wrapper-secret.yaml \
            > "${long_wrapper_secret}"

          grep -Fq -- "--controller-url=http://orka.${NAMESPACE}.svc:8080" "${default_render}"
          grep -Fq -- "--controller-url=http://secondary-orka.${NAMESPACE}.svc:8080" "${secondary_render}"
          grep -Fq -- "--ai-worker-service-account-name=orka-ai-worker" "${default_render}"
          for tier in ai vendor container; do
            account="secondary-orka-${tier}-worker"
            grep -Fq -- "--${tier}-worker-service-account-name=${account}" "${secondary_render}"
            grep -Fq -- "name: ${account}" "${secondary_serviceaccounts}"
            grep -Fq -- "name: ${account}" "${secondary_rbac}"
            grep -Fq -- ":${account}'" "${secondary_gateway_policy}"
          done
          wrapper_name=$(awk '$1 == "name:" { print $2; exit }' "${long_wrapper_service}")
          wrapper_secret_name=$(awk '$1 == "name:" { print $2; exit }' "${long_wrapper_secret}")
          [[ -n "${wrapper_name}" && ${#wrapper_name} -le 63 ]]
          [[ -n "${wrapper_secret_name}" && ${#wrapper_secret_name} -le 63 ]]
          grep -Fq -- "http://${wrapper_name}:8080" "${long_render}"
          grep -Fq -- "serviceAccountName: ${wrapper_name}" "${long_render}"
          grep -Fq -- "secretName: ${wrapper_secret_name}" "${long_render}"

          chart_version=$(awk '$1 == "version:" { print $2; exit }' manifest_staging/charts/orka/Chart.yaml)
          grep -Fq -- "--general-worker-image=ghcr.io/orka-agents/orka/general-worker:${chart_version}" "${secondary_render}"
          for resource in agentruntimes substrateactorpools; do
            grep -Eq "resources: \\[.*\"${resource}\"" "${secondary_rbac}"
            grep -Eq "resources: \\[.*\"${resource}/status\"" "${secondary_rbac}"
            grep -Eq "resources: \\[.*\"${resource}/finalizers\"" "${secondary_rbac}"
          done
          test "$(grep -Fc 'resources: ["serviceaccounts/token"]' manifest_staging/charts/orka/templates/rbac.yaml)" -eq 1
          if grep -Fq 'ai-worker-tokenrequest' manifest_staging/charts/orka/templates/rbac.yaml; then
            echo "AI workers must not receive an unrestricted TokenRequest ClusterRole." >&2
            exit 1
          fi

          mkdir -p cr-release-packages
          helm package manifest_staging/charts/orka --destination cr-release-packages
          shopt -s nullglob
          chart_packages=(cr-release-packages/orka-*.tgz)
          if [[ ${#chart_packages[@]} -ne 1 ]]; then
            echo "Expected exactly one packaged Orka chart, found ${#chart_packages[@]}." >&2
            exit 1
          fi
          test "$(helm show crds "${chart_packages[0]}" | grep -c '^kind: CustomResourceDefinition$')" -eq 19

      - name: Install kind
        run: |
          set -euo pipefail

          curl -fsSL --retry 3 --retry-delay 2 -o ./kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ./kind" | sha256sum --check --strict
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify install, apply, and uninstall CRD behavior
        run: |
          set -euo pipefail

          cleanup() {
            kind delete cluster --name "${KIND_CLUSTER}" || true
          }
          trap cleanup EXIT

          kind create cluster \
            --name "${KIND_CLUSTER}" \
            --image "${KIND_IMAGE}" \
            --wait 90s

          shopt -s nullglob
          chart_packages=(cr-release-packages/orka-*.tgz)
          [[ ${#chart_packages[@]} -eq 1 ]]
          chart_package=${chart_packages[0]}

          expected_crds=$(cat <<'CRDS'
          agentruntimes.core.orka.ai
          agents.core.orka.ai
          executionworkspaceclasses.workspace.orka.ai
          executionworkspacepools.workspace.orka.ai
          executionworkspaceproviders.workspace.orka.ai
          executionworkspaces.workspace.orka.ai
          fakepoolparameters.fake.workspace.orka.ai
          fakeproviderconfigs.fake.workspace.orka.ai
          gatewaybindings.gateway.orka.ai
          gatewayclasses.gateway.orka.ai
          gateways.gateway.orka.ai
          outboundaccesspolicies.core.orka.ai
          providers.core.orka.ai
          repositorymonitors.core.orka.ai
          repositoryscans.core.orka.ai
          skills.core.orka.ai
          substrateactorpools.core.orka.ai
          tasks.core.orka.ai
          tools.core.orka.ai
          CRDS
          )

          list_orka_crds() {
            kubectl get customresourcedefinitions.apiextensions.k8s.io -o json | \
              jq -r '.items[] | select(.spec.group == "core.orka.ai" or .spec.group == "gateway.orka.ai" or .spec.group == "workspace.orka.ai" or .spec.group == "fake.workspace.orka.ai") | .metadata.name' | \
              sort
          }

          assert_all_orka_crds() {
            local stage=$1
            local actual
            local crd
            actual=$(list_orka_crds)
            if [[ "${actual}" != "${expected_crds}" ]]; then
              echo "Orka CRD set mismatch ${stage}." >&2
              diff -u <(printf '%s\n' "${expected_crds}") <(printf '%s\n' "${actual}") >&2 || true
              exit 1
            fi
            while IFS= read -r crd; do
              kubectl wait --for=condition=Established --timeout=60s "crd/${crd}"
            done <<< "${expected_crds}"
          }

          helm install orka "${chart_package}" \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            --set controller.replicas=0 \
            --set-string controller.image.repository="${PAUSE_IMAGE_REPOSITORY}" \
            --set-string controller.image.tag="${PAUSE_IMAGE_TAG}" \
            --set controller.image.pullPolicy=IfNotPresent \
            --set-string workers.ai.image.repository="${PAUSE_IMAGE_REPOSITORY}" \
            --set-string workers.ai.image.tag="${PAUSE_IMAGE_TAG}" \
            --set-string workers.harnessWrapper.image.repository="${PAUSE_IMAGE_REPOSITORY}" \
            --set-string workers.harnessWrapper.image.tag="${PAUSE_IMAGE_TAG}" \
            --set workers.harnessWrapper.image.pullPolicy=IfNotPresent \
            --set-string workers.harnessWrapper.auth.token=mock-token

          assert_all_orka_crds "after helm install"

          kubectl patch crd tasks.core.orka.ai --type=json -p='[
            {"op":"add","path":"/spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/staleReviewField","value":{"type":"string"}}
          ]'
          kubectl get crd tasks.core.orka.ai -o json | \
            jq -e '.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties | has("staleReviewField")' >/dev/null

          scripts/apply-helm-crds.sh "${chart_package}"
          assert_all_orka_crds "after guarded exact-spec CRD apply"
          if kubectl get crd tasks.core.orka.ai -o json | \
            jq -e '.spec.versions[0].schema.openAPIV3Schema.properties.spec.properties | has("staleReviewField")' >/dev/null; then
            echo "Guarded CRD apply retained a schema field omitted by the target chart." >&2
            exit 1
          fi

          helm uninstall orka --namespace "${NAMESPACE}"
          assert_all_orka_crds "after helm uninstall"
