name: Harness v2 Smoke

on:
  push:
    paths:
      - ".github/workflows/harness-v2-smoke.yml"
      - "Makefile"
      - "api/**"
      - "cmd/main.go"
      - "cmd/build/helmify/**"
      - "cmd/orka-admission/**"
      - "config/acp-production/**"
      - "config/acp-workload/**"
      - "config/orka-admission/**"
      - "config/orka-admission-webhooks/**"
      - "go.mod"
      - "go.sum"
      - "internal/admission/**"
      - "internal/controller/agent_execution*"
      - "internal/controller/acp*"
      - "internal/controller/runtime_pool*"
      - "internal/executionmode/**"
      - "internal/harness/v2/**"
      - "workers/acp/**"
      - "internal/store/**"
      # The script jobs syntax-check every script and execute every
      # scripts/tests/*-test.sh suite, so any script change is relevant.
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/harness-v2-smoke.yml"
      - "Makefile"
      - "api/**"
      - "cmd/main.go"
      - "cmd/build/helmify/**"
      - "cmd/orka-admission/**"
      - "config/acp-production/**"
      - "config/acp-workload/**"
      - "config/orka-admission/**"
      - "config/orka-admission-webhooks/**"
      - "go.mod"
      - "go.sum"
      - "internal/admission/**"
      - "internal/controller/agent_execution*"
      - "internal/controller/acp*"
      - "internal/controller/runtime_pool*"
      - "internal/executionmode/**"
      - "internal/harness/v2/**"
      - "workers/acp/**"
      - "internal/store/**"
      # The script jobs syntax-check every script and execute every
      # scripts/tests/*-test.sh suite, so any script change is relevant.
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-v2-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-go:
    name: Focused Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Create UI embed stub
        run: make ensure-ui-embed

      - name: Set up envtest
        run: |
          make setup-envtest
          envtest_assets="$(./bin/setup-envtest use -i --bin-dir "$PWD/bin" -p path)"
          echo "KUBEBUILDER_ASSETS=$envtest_assets" >> "$GITHUB_ENV"

      - name: Run v2 recovery and cleanup tests
        run: |
          go test \
            ./api/v1alpha1 \
            ./internal/admission \
            ./internal/controller \
            ./internal/executionmode \
            ./internal/store/... \
            ./cmd/orka-admission \
            -run '(ExecutionMode|ControllerMode|AgentContract|AgentRuntimeContract|TaskExecutionAuthority|ACPUpgradeDrain|AgentExecutionSnapshotRetention|ACPDispatcher|ACPRecovery|ACPRuntime|ACPExternal|ACPSession|SessionRuntimeCleanup|ArchivedSessionRecovery|SessionLineage|ReceiptPersistence|AdmissionClose|HarnessV2|Cancel|Timeout|Publication|Cleanup)' \
            -count=1

      - name: Run v2 client and supervisor tests
        run: go test ./internal/harness/v2/... ./workers/acp/... -count=1

  shell-syntax:
    name: Deployment scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate scripts
        run: |
          set -Eeuo pipefail
          for script in scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh; do
            bash -n "${script}"
          done

      - name: Install kustomize
        run: make kustomize

      - name: Run script test suites
        run: |
          set -Eeuo pipefail
          for suite in scripts/tests/*-test.sh; do
            echo "==> ${suite}"
            KUSTOMIZE="$PWD/bin/kustomize" bash "${suite}"
          done
