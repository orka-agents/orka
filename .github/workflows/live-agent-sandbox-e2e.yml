name: Live Agent Sandbox E2E

on:
  workflow_dispatch:
  push:
    # Run only when something this lane builds or exercises changes. Later
    # patterns override earlier ones, so the self and shared-action paths are
    # re-included after .github is excluded. UI, docs, website, and example
    # changes are covered by UI Lint/Tests, Website, Docs Check, and Go Tests.
    paths:
      - "**"
      - "!.agents/**"
      - "!.claude/**"
      - "!.github/**"
      - ".github/workflows/live-agent-sandbox-e2e.yml"
      - ".github/actions/**"
      - "!website/**"
      - "!docs/**"
      - "!ui/**"
      - "!examples/**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"
  pull_request:
    paths:
      - "**"
      - "!.agents/**"
      - "!.claude/**"
      - "!.github/**"
      - ".github/workflows/live-agent-sandbox-e2e.yml"
      - ".github/actions/**"
      - "!website/**"
      - "!docs/**"
      - "!ui/**"
      - "!examples/**"
      - "!**.md"
      - "!LICENSE"
      - "!.gitignore"

permissions:
  contents: read

concurrency:
  group: live-agent-sandbox-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-agent-sandbox-e2e:
    name: Live Agent Sandbox E2E
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      KIND_CLUSTER: orka-live-agent-sandbox-e2e
    steps:
      - name: Clone Orka
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for Docker-heavy live E2E
        uses: ./.github/actions/free-disk-space

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install kind
        uses: ./.github/actions/setup-kind

      - name: Verify kind installation
        run: kind version

      - name: Run live agent sandbox e2e
        run: bash scripts/live-agent-sandbox-e2e.sh
