name: Gateway Live E2E

on:
  workflow_dispatch:
  push:
    paths:
      - ".dockerignore"
      - ".github/workflows/gateway-e2e.yml"
      - "Dockerfile"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "scripts/lib/e2e-admission-tls.sh"
      - "scripts/lib/e2e-cleanup.sh"
      - "scripts/lib/ensure-static-mode-namespace.sh"
      - "test/e2e/**"
      - "test/utils/**"
      - "ui/**"
      - "workers/**"
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/gateway-e2e.yml"
      - "Dockerfile"
      - "Makefile"
      - "api/**"
      - "cmd/**"
      - "config/**"
      - "go.mod"
      - "go.sum"
      - "internal/**"
      - "scripts/lib/e2e-admission-tls.sh"
      - "scripts/lib/e2e-cleanup.sh"
      - "scripts/lib/ensure-static-mode-namespace.sh"
      - "test/e2e/**"
      - "test/utils/**"
      - "ui/**"
      - "workers/**"

permissions:
  contents: read

concurrency:
  group: gateway-live-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gateway-live-e2e:
    name: Gateway live E2E
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      E2E_EPHEMERAL_CLUSTER: "true"
      E2E_GATEWAY: "true"
      E2E_GO_TEST_TIMEOUT: 55m
      E2E_CLEANUP_REPORT_DIR: ${{ github.workspace }}/bin/e2e-cleanup/gateway
      KIND_CLUSTER: orka-gateway-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space for Docker-heavy E2E
        uses: ./.github/actions/free-disk-space

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Install kind
        uses: ./.github/actions/setup-kind

      - name: Verify kind installation
        run: kind version

      - name: Run Gateway external-v2 and native interim live E2E
        run: |
          set -Eeuo pipefail
          . scripts/lib/e2e-cleanup.sh
          finish() {
            status=$?
            trap - EXIT
            if ! e2e_cleanup_kind "${KIND_CLUSTER}" "${E2E_CLEANUP_REPORT_DIR}"; then
              echo "::error::Kind teardown was not proved"
              status=1
            fi
            if ! e2e_cleanup_evidence_passed "${E2E_CLEANUP_REPORT_DIR}"; then
              echo "::error::normal Gateway resource cleanup was not proved"
              status=1
            fi
            exit "${status}"
          }
          trap finish EXIT
          make setup-test-e2e KIND_CLUSTER="${KIND_CLUSTER}"
          go test -tags=e2e ./test/e2e/ \
            -timeout "${E2E_GO_TEST_TIMEOUT}" \
            -v \
            -ginkgo.v \
            -ginkgo.fail-on-empty \
            -ginkgo.focus "Gateway live E2E" \
            | tee gateway-e2e.log
          # -ginkgo.fail-on-empty only catches an empty focus match. When the
          # gateway spec matches but skips itself (for example E2E_GATEWAY is
          # unset), Ginkgo reports "Ran 0 of N Specs" and exits 0, so the lane
          # would go green without validating anything. Fail that shape.
          if grep -Eq 'Ran 0 of [0-9]+ Specs' gateway-e2e.log; then
            echo "::error::Gateway live E2E ran zero specs; the suite skipped itself instead of running (check E2E_GATEWAY and the ginkgo focus)."
            exit 1
          fi
          # Require all three paths, not just the existing external-v2 spec.
          # Ordered containers skip later specs after an earlier failure.
          if ! grep -Eq 'Ran 3 of [0-9]+ Specs' gateway-e2e.log; then
            echo "::error::Gateway live E2E must run external-v2, native interim, and no-capability specs."
            exit 1
          fi

      - name: Upload exact Gateway cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-cleanup-evidence
          path: ${{ env.E2E_CLEANUP_REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 7
