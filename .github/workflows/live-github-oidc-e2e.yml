name: Live GitHub OIDC E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  push:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-github-oidc-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-github-oidc-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIND_CLUSTER: orka-live-github-oidc-e2e
      ORKA_GITHUB_OIDC_AUDIENCE: orka-live-github-oidc-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true
      - name: Install kind
        uses: ./.github/actions/setup-kind
      - name: Verify kind installation
        run: kind version
      - run: bash scripts/live-github-oidc-e2e.sh
