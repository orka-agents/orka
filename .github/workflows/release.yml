name: Release
run-name: Release ${{ inputs.release_version }} (${{ inputs.dispatch_id }})

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version prepared on release-X.Y
        required: true
        type: string
      candidate_sha:
        description: Exact generated commit to build, qualify, and approve
        required: true
        type: string
      dispatch_id:
        description: Correlation ID supplied by Prepare Release
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read

# Hold the publication lock from validation through the final gh-pages update so
# concurrent runs cannot both validate an absent/older package and then overwrite it.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate release metadata and Helm chart
    outputs:
      artifact_attempt: ${{ steps.candidate.outputs.artifact_attempt }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate candidate and approval configuration
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 scripts/release_workflow.py candidate "${RELEASE_VERSION}" "${CANDIDATE_SHA}"

      - name: Validate promoted chart
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: scripts/validate-release-manifest.sh "${RELEASE_VERSION}"

      - name: Package promoted chart
        run: |
          set -euo pipefail

          mkdir -p cr-release-packages
          helm package charts/orka --destination cr-release-packages

          shopt -s nullglob
          chart_packages=(cr-release-packages/orka-*.tgz)
          if [[ ${#chart_packages[@]} -ne 1 ]]; then
            echo "Expected exactly one packaged Orka chart, found ${#chart_packages[@]}." >&2
            exit 1
          fi
          expected_crds=$(find manifest_staging/charts/orka/crds -maxdepth 1 -type f -name '*.yaml' | wc -l | tr -d ' ')
          if [[ $(helm show crds "${chart_packages[0]}" | grep -c '^kind: CustomResourceDefinition$') -ne ${expected_crds} ]]; then
            echo "Packaged Orka chart CRD count does not match staging (${expected_crds})." >&2
            exit 1
          fi
          if helm show crds "${chart_packages[0]}" | grep -F 'fake.workspace.orka.ai' >/dev/null; then
            echo "Packaged Orka chart must not contain development-only fake workspace CRDs." >&2
            exit 1
          fi

      - name: Verify immutable chart version
        run: |
          set -euo pipefail

          shopt -s nullglob
          chart_packages=(cr-release-packages/orka-*.tgz)
          if [[ ${#chart_packages[@]} -ne 1 ]]; then
            echo "Expected exactly one packaged Orka chart, found ${#chart_packages[@]}." >&2
            exit 1
          fi
          candidate=${chart_packages[0]}
          package_name=$(basename "${candidate}")
          comparison_dir=$(mktemp -d)
          trap 'rm -rf "${comparison_dir}"' EXIT

          set +e
          git ls-remote --exit-code --heads origin refs/heads/gh-pages >/dev/null
          probe_status=$?
          set -e
          case "${probe_status}" in
            0)
              git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
              ;;
            2)
              echo "No published Helm repository exists yet."
              exit 0
              ;;
            *)
              echo "Could not determine whether the gh-pages branch exists." >&2
              exit "${probe_status}"
              ;;
          esac

          for published_path in "charts/${package_name}" "${package_name}"; do
            published_match=$(git ls-tree --name-only origin/gh-pages -- "${published_path}")
            if [[ -z "${published_match}" ]]; then
              continue
            fi
            if [[ "${published_match}" != "${published_path}" ]]; then
              echo "Unexpected gh-pages path while checking ${published_path}: ${published_match}" >&2
              exit 1
            fi

            published_archive="${comparison_dir}/$(basename "${published_path}")"
            git show "origin/gh-pages:${published_path}" > "${published_archive}"
            if cmp -s "${candidate}" "${published_archive}"; then
              echo "Published ${published_path} has identical bytes."
              continue
            fi

            echo "Chart ${package_name} already exists with different bytes." >&2
            echo "Retry publication with the original artifact or prepare a new version." >&2
            exit 1
          done

      - name: Preserve the exact candidate chart
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chart-${{ github.run_id }}-${{ steps.candidate.outputs.artifact_attempt }}
          path: cr-release-packages/orka-*.tgz
          if-no-files-found: error
          retention-days: 90

  lint:
    needs: validate-release
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/lint.yml
    with:
      full_check: true

  tests:
    needs: validate-release
    uses: ./.github/workflows/test.yml

  helm:
    needs: validate-release
    uses: ./.github/workflows/helm-chart.yml

  govulncheck:
    needs: validate-release
    uses: ./.github/workflows/govulncheck.yml

  build-and-push:
    name: Build and Push Images
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Application releases publish the default harness-v2 stack and
      # the digest-pinned harness-v1 compatibility wrapper.
      fail-fast: false
      matrix:
        include:
          - image: controller
            image_suffix: ""
            dockerfile: Dockerfile
            context: .
          - image: ai-worker
            image_suffix: "/ai-worker"
            dockerfile: workers/ai/Dockerfile
            context: .
          - image: general-worker
            image_suffix: "/general-worker"
            dockerfile: workers/general/Dockerfile
            context: .
          - image: agent-harness-wrapper
            image_suffix: "/agent-harness-wrapper"
            dockerfile: workers/harness/Dockerfile
            context: .
          - image: acp-codex-runtime
            image_suffix: "/acp-codex-runtime"
            dockerfile: workers/acp/images/codex/Dockerfile
            context: .
          - image: acp-claude-runtime
            image_suffix: "/acp-claude-runtime"
            dockerfile: workers/acp/images/claude/Dockerfile
            context: .
          - image: acp-copilot-runtime
            image_suffix: "/acp-copilot-runtime"
            dockerfile: workers/acp/images/copilot/Dockerfile
            context: .
          - image: acp-opencode-runtime
            image_suffix: "/acp-opencode-runtime"
            dockerfile: workers/acp/images/opencode/Dockerfile
            context: .
          - image: workspace-publisher
            image_suffix: "/workspace-publisher"
            dockerfile: workers/publisher/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image_suffix }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image_suffix }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Save image digest
        run: printf '%s' '${{ steps.build.outputs.digest }}' > digest-${{ matrix.image }}.txt

      - name: Set up Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate platform SBOMs
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image_suffix }}
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          "${SYFT_CMD}" scan --platform linux/amd64 "${IMAGE_REF}@${IMAGE_DIGEST}" -o spdx-json="sbom-${{ matrix.image }}-linux-amd64.spdx.json"
          "${SYFT_CMD}" scan --platform linux/arm64 "${IMAGE_REF}@${IMAGE_DIGEST}" -o spdx-json="sbom-${{ matrix.image }}-linux-arm64.spdx.json"

      - name: Preserve image digest and platform SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.image }}-${{ needs.validate-release.outputs.artifact_attempt }}
          path: |
            digest-${{ matrix.image }}.txt
            sbom-${{ matrix.image }}-*.spdx.json
          if-no-files-found: error
          retention-days: 90

  scan:
    name: Security Scan
    needs: [validate-release, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: controller
            image_suffix: ""
            platform: linux/amd64
            platform_slug: linux-amd64
          - image: controller
            image_suffix: ""
            platform: linux/arm64
            platform_slug: linux-arm64
          - image: ai-worker
            image_suffix: "/ai-worker"
            platform: linux/amd64
            platform_slug: linux-amd64
          - image: ai-worker
            image_suffix: "/ai-worker"
            platform: linux/arm64
            platform_slug: linux-arm64
          - image: general-worker
            image_suffix: "/general-worker"
            platform: linux/amd64
            platform_slug: linux-amd64
          - image: general-worker
            image_suffix: "/general-worker"
            platform: linux/arm64
            platform_slug: linux-arm64
          - image: agent-harness-wrapper
            image_suffix: "/agent-harness-wrapper"
            platform: linux/amd64
            platform_slug: linux-amd64
          - image: agent-harness-wrapper
            image_suffix: "/agent-harness-wrapper"
            platform: linux/arm64
            platform_slug: linux-arm64
          - image: acp-codex-runtime
            image_suffix: "/acp-codex-runtime"
            platform: linux/amd64
            platform_slug: linux-amd64
          - image: acp-codex-runtime
            image_suffix: "/acp-codex-runtime"
            platform: linux/arm64
            platform_slug: linux-arm64
          - image: acp-claude-runtime
            image_suffix: "/acp-claude-runtime"
            platform: linux/amd64
            platform_slug: linux-amd64
          - image: acp-claude-runtime
            image_suffix: "/acp-claude-runtime"
            platform: linux/arm64
            platform_slug: linux-arm64
          - image: acp-copilot-runtime
            image_suffix: "/acp-copilot-runtime"
            platform: linux/amd64
            platform_slug: linux-amd64
          - image: acp-copilot-runtime
            image_suffix: "/acp-copilot-runtime"
            platform: linux/arm64
            platform_slug: linux-arm64
          - image: acp-opencode-runtime
            image_suffix: "/acp-opencode-runtime"
            platform: linux/amd64
            platform_slug: linux-amd64
          - image: acp-opencode-runtime
            image_suffix: "/acp-opencode-runtime"
            platform: linux/arm64
            platform_slug: linux-arm64
          - image: workspace-publisher
            image_suffix: "/workspace-publisher"
            platform: linux/amd64
            platform_slug: linux-amd64
          - image: workspace-publisher
            image_suffix: "/workspace-publisher"
            platform: linux/arm64
            platform_slug: linux-arm64
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.image }}-${{ needs.validate-release.outputs.artifact_attempt }}
          path: digests

      - name: Read image digest
        id: digest
        run: echo "value=$(cat digests/digest-${{ matrix.image }}.txt)" >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image_suffix }}@${{ steps.digest.outputs.value }}
          format: sarif
          output: trivy-${{ matrix.image }}-${{ matrix.platform_slug }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.image }}-${{ matrix.platform_slug }}.sarif
          category: trivy-${{ matrix.image }}-${{ matrix.platform_slug }}
        if: always()

  sign-and-attest:
    name: Sign Images and Attest SBOMs
    needs:
      - validate-release
      - build-and-push
      - scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        include:
          - image: controller
            image_suffix: ""
          - image: ai-worker
            image_suffix: "/ai-worker"
          - image: general-worker
            image_suffix: "/general-worker"
          - image: agent-harness-wrapper
            image_suffix: "/agent-harness-wrapper"
          - image: acp-codex-runtime
            image_suffix: "/acp-codex-runtime"
          - image: acp-claude-runtime
            image_suffix: "/acp-claude-runtime"
          - image: acp-copilot-runtime
            image_suffix: "/acp-copilot-runtime"
          - image: acp-opencode-runtime
            image_suffix: "/acp-opencode-runtime"
          - image: workspace-publisher
            image_suffix: "/workspace-publisher"
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download image digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.image }}-${{ needs.validate-release.outputs.artifact_attempt }}
          path: digests

      - name: Read image digest
        id: digest
        run: echo "value=$(cat digests/digest-${{ matrix.image }}.txt)" >> "$GITHUB_OUTPUT"

      - name: Resolve platform digests
        id: platform-digests
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image_suffix }}
        run: |
          set -euo pipefail
          manifest_json=$(docker buildx imagetools inspect --raw "${IMAGE_REF}@${IMAGE_DIGEST}")
          amd64_digest=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"${manifest_json}")
          arm64_digest=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"${manifest_json}")
          test -n "${amd64_digest}" && test "${amd64_digest}" != "null"
          test -n "${arm64_digest}" && test "${arm64_digest}" != "null"
          echo "linux_amd64=${amd64_digest}" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=${arm64_digest}" >> "$GITHUB_OUTPUT"

      - name: Sign image index
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image_suffix }}
        run: cosign sign --yes "${IMAGE_REF}@${IMAGE_DIGEST}"

      - name: Attest platform SBOMs
        env:
          AMD64_DIGEST: ${{ steps.platform-digests.outputs.linux_amd64 }}
          ARM64_DIGEST: ${{ steps.platform-digests.outputs.linux_arm64 }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}${{ matrix.image_suffix }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson --predicate "digests/sbom-${{ matrix.image }}-linux-amd64.spdx.json" "${IMAGE_REF}@${AMD64_DIGEST}"
          cosign attest --yes --type spdxjson --predicate "digests/sbom-${{ matrix.image }}-linux-arm64.spdx.json" "${IMAGE_REF}@${ARM64_DIGEST}"

  candidate-bundle:
    name: Assemble immutable release candidate
    needs: [validate-release, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packaged chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-${{ github.run_id }}-${{ needs.validate-release.outputs.artifact_attempt }}
          path: ${{ runner.temp }}/release-candidate

      - name: Download image digests and SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*-${{ needs.validate-release.outputs.artifact_attempt }}
          path: ${{ runner.temp }}/release-candidate/digests
          merge-multiple: true

      - name: Bind chart bytes, image digests, and build identity
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ARTIFACT_ATTEMPT: ${{ needs.validate-release.outputs.artifact_attempt }}
        run: python3 scripts/release_workflow.py bundle "${RUNNER_TEMP}/release-candidate" "${RELEASE_VERSION}" "${CANDIDATE_SHA}" "${ARTIFACT_ATTEMPT}"

      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.run_id }}-${{ needs.validate-release.outputs.artifact_attempt }}
          # SBOMs remain in the image artifacts and signed attestations. The
          # live gate only needs image digests, the manifest, and the chart.
          path: |
            ${{ runner.temp }}/release-candidate/candidate.json
            ${{ runner.temp }}/release-candidate/orka-*.tgz
            ${{ runner.temp }}/release-candidate/digests/digest-*.txt
          if-no-files-found: error
          retention-days: 90

  qualification:
    name: Qualify the published digests and packaged chart
    needs: [validate-release, candidate-bundle, lint, tests, helm, govulncheck, sign-and-attest]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: write
      contents: read
    outputs:
      artifact_name: ${{ steps.evidence.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ needs.validate-release.outputs.artifact_attempt }}
          path: ${{ runner.temp }}/release-candidate

      - name: Dispatch and verify live ACP and chart acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_workflow.py qualify "${RUNNER_TEMP}/release-candidate"

      - name: Name qualified evidence for this attempt
        id: evidence
        run: echo "name=release-qualified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"

      - name: Preserve candidate and qualification evidence for approval
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Approve and publish the qualified candidate
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/commit/${{ inputs.candidate_sha }}
    permissions:
      actions: read
      contents: write
      packages: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download approved candidate and evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.qualification.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-candidate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # GITHUB_TOKEN tag pushes do not trigger another push workflow. Complete
      # publication here, under the same environment approval and artifact set.
      - name: Recheck evidence, tag, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_workflow.py publish "${RUNNER_TEMP}/release-candidate"
