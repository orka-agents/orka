name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "website/**"
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "website/**"
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  release-automation:
    name: Release automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test candidate provenance, approval evidence, and publication retries
        run: |
          set -Eeuo pipefail
          for suite in release-workflow release-manifest live-acp-release-report live-acp-release-publication live-acp-release-chart live-acp-runtime-kind-e2e; do
            bash "scripts/tests/${suite}-test.sh"
          done

  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Running Tests
        run: |
          go mod tidy
          make test

  ui-test:
    name: UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run UI tests
        run: bun run test
