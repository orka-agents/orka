name: Tests

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "website/**"
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "website/**"
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  release-automation:
    name: Release automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Test candidate provenance, approval evidence, and publication retries
        run: |
          set -Eeuo pipefail
          for suite in release-workflow release-manifest release-qualification-report release-publication-tests release-publication-acceptance release-chart-acceptance agent-runtime-kind-e2e; do
            bash "scripts/tests/${suite}-test.sh"
          done

  test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Check Go coverage reporting
        run: bash scripts/tests/go-coverage-summary-test.sh

      - name: Running Tests
        id: go_tests
        run: |
          go mod tidy
          make test

      - name: Summarize Go coverage
        if: ${{ always() }}
        env:
          TEST_OUTCOME: ${{ steps.go_tests.outcome }}
        run: bash scripts/go-coverage-summary.sh

      - name: Upload Go coverage evidence
        if: ${{ always() && hashFiles('cover.out') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage-evidence
          path: |
            cover.out
            coverage-functions.txt

  native-codex:
    name: Native Codex handoff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compile the native supervisor test
        run: |
          make ensure-ui-embed
          mkdir -p bin/native-codex
          CGO_ENABLED=0 go test -c -o bin/native-codex/supervisor.test ./workers/acp/supervisor

      - name: Build the pinned production Codex runtime
        run: docker build --platform linux/amd64 -f workers/acp/images/codex/Dockerfile -t orka-native-codex-test .

      - name: Verify native restore, continuation, publication, capture, and return
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --user 0:0 \
            --cap-drop ALL --cap-add CHOWN --cap-add KILL --cap-add SETGID --cap-add SETUID \
            --security-opt no-new-privileges \
            --env ORKA_NATIVE_CODEX_TEST=1 \
            --mount "type=bind,source=${PWD},target=/src,readonly" \
            --workdir /src/workers/acp/supervisor \
            --entrypoint /src/bin/native-codex/supervisor.test \
            orka-native-codex-test \
            -test.run '^TestPinnedNativeCodexACPRoundTrip$' -test.count=1 -test.timeout=5m -test.v \
            | tee bin/native-codex/results.log
          grep -q '^--- PASS: TestPinnedNativeCodexACPRoundTrip ' bin/native-codex/results.log

  ui-test:
    name: UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run UI tests
        run: bun run test
