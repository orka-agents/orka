# Opt-in. Apply together with --container-task-secret-use-authorization-enabled
# on the controller; see README.md. Replace ORKA_NAMESPACE and CONTROLLER_SA
# with the controller's namespace and ServiceAccount.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: container-task-secret-use.orka.ai
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["core.orka.ai"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["tasks"]
  matchConditions:
  - name: container-task
    expression: object.spec.type == 'container'
  variables:
  - name: secretNames
    expression: >-
      [?object.spec.?secretRef.name].filter(n, n != '') +
      object.spec.?env.orValue([]).filter(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)).map(e, e.valueFrom.secretKeyRef.name)
  # An update that leaves alone the spec and the provenance the controller
  # judges a Task by (owners and the labels and annotations below), such as the controller's own label and finalizer writes,
  # changes neither the Secrets, the code that receives them, nor whether the
  # Task may receive them. Any other write is checked in full.
  - name: specUnchanged
    expression: >-
      oldObject != null && object.spec == oldObject.spec &&
      object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
      ['orka.ai/scheduled-run', 'orka.ai/parent-task', 'orka.ai/chat-session', 'orka.ai/coordinator'].all(k,
        object.metadata.?labels[?k] == oldObject.metadata.?labels[?k]) &&
      ['orka.ai/parent-task-name', 'orka.ai/parent-task-uid', 'orka.ai/parent-task-namespace',
        'orka.ai/requested-by-source'].all(k,
        object.metadata.?annotations[?k] == oldObject.metadata.?annotations[?k])
  # The controller creates each run of a scheduled Task as a copy of its spec.
  # It holds no `use` on Secrets, and checks each run against its scheduled
  # Task before it delivers anything.
  - name: controllerScheduledRun
    expression: >-
      request.operation == 'CREATE' &&
      request.userInfo.username == 'system:serviceaccount:ORKA_NAMESPACE:CONTROLLER_SA' &&
      object.metadata.?labels[?'orka.ai/scheduled-run'].orValue('') == 'true'
  validations:
  - expression: >-
      object.spec.?secretRef.?namespace.orValue('') in ['', request.namespace]
    message: a container Task may name only Secrets in its own namespace
    reason: Forbidden
  - expression: >-
      variables.controllerScheduledRun || variables.specUnchanged ||
      variables.secretNames.all(n,
        authorizer.group('').resource('secrets').namespace(request.namespace).name(n).check('use').allowed())
    message: caller is not authorized to use a Secret the container Task names
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: container-task-secret-use.orka.ai
spec:
  policyName: container-task-secret-use.orka.ai
  validationActions: [Deny]
