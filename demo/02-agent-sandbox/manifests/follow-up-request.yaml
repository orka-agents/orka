# The follow-up request. It names the same Session and nothing else, so it
# wakes the same Sandbox with the first request's work still on its disk.
# A Session keeps one runtime profile, so the workspace settings are repeated
# verbatim; the prompt only reads, and an unchanged tree publishes nothing.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: healthz-follow-up
  namespace: orka-system
  labels:
    demo.orka.ai/name: 02-agent-sandbox
spec:
  type: agent
  agentRef:
    name: codex-coder
  sessionRef:
    name: SESSION_NAME
  execution:
    workspace:
      classRef:
        name: sandbox-session
      reusePolicy: session
  workspace:
    intent: write
    gitRepo: https://github.com/sozercan/orka-demo-inventory
    branch: main
    readCredentialRef:
      name: github-credentials
    publicationGitRepo: https://github.com/sozercan/orka-demo-inventory
    publicationReadCredentialRef:
      name: github-credentials
    publicationCredentialRef:
      name: github-credentials
    forgeCredentialRef:
      name: github-credentials
    pushBranch: orka/healthz-from-sandbox
    prBaseBranch: main
    createPR: true
  timeout: 20m
  prompt: |
    Do not change any file. Run: ls; grep -n healthz main.go README.md
    Reply with the exact combined output and nothing else.
