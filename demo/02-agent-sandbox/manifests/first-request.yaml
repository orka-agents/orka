# The first request. It opens a Session (create: true), asks for the
# sandbox-session workspace class by name, and points at the repository.
# Write intent means Orka's Publisher verifies the tree, publishes the branch,
# and opens the pull request; the agent itself never holds a Git token.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: healthz-implement
  namespace: orka-system
  labels:
    demo.orka.ai/name: 02-agent-sandbox
spec:
  type: agent
  agentRef:
    name: codex-coder
  sessionRef:
    name: SESSION_NAME
    create: true
  execution:
    workspace:
      classRef:
        name: sandbox-session
      reusePolicy: session
  workspace:
    intent: write
    gitRepo: https://github.com/sozercan/orka-demo-inventory
    branch: main
    readCredentialRef:
      name: github-credentials
    publicationGitRepo: https://github.com/sozercan/orka-demo-inventory
    publicationReadCredentialRef:
      name: github-credentials
    publicationCredentialRef:
      name: github-credentials
    forgeCredentialRef:
      name: github-credentials
    pushBranch: orka/healthz-from-sandbox
    prBaseBranch: main
    createPR: true
  timeout: 30m
  prompt: |
    Add a GET /healthz endpoint that returns HTTP 200 with the JSON body
    {"status":"ok"}. Add a unit test for it in the existing style and add the
    endpoint to the API table in README.md. Do not build or run tests; CI runs
    them on the pull request. Reply in at most five lines: a one-line summary
    and the list of files you changed.
