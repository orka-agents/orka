# A brand-new Task, outside the original Session, restored from the
# checkpoint. The original workspace and its Actors are gone; the bytes come
# back. The restore names the checkpoint's UID and digest, so a swapped
# checkpoint is refused, and it carries the same workspace settings as the
# source so the runtime profile matches what was saved.
apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: audit-restore
  namespace: orka-system
  labels:
    demo.orka.ai/name: 03-agent-substrate
spec:
  type: agent
  agentRef:
    name: codex-coder
  execution:
    workspace:
      classRef:
        name: substrate-session
      onDetach: Delete
      restoreFrom:
        name: audit-checkpoint
        uid: CHECKPOINT_UID
        digest: CHECKPOINT_DIGEST
  workspace:
    intent: write
    gitRepo: https://github.com/sozercan/orka-demo-inventory
    branch: main
    readCredentialRef:
      name: github-credentials
    publicationGitRepo: https://github.com/sozercan/orka-demo-inventory
    publicationReadCredentialRef:
      name: github-credentials
    publicationCredentialRef:
      name: github-credentials
    pushBranch: orka/security-audit-restored
  timeout: 20m
  prompt: |
    Do not change any file. Run: cat AUDIT.md
    Reply with the exact output and nothing else.
