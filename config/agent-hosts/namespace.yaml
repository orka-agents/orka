apiVersion: v1
kind: Namespace
metadata:
  name: orka-agent-hosts
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
    # Agent-host Pods run non-root with no capabilities and the RuntimeDefault
    # seccomp profile, so the restricted Pod Security profile applies.
    pod-security.kubernetes.io/enforce: restricted
