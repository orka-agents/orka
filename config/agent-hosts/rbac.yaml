apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orka-agent-host-controller
  namespace: orka-agent-hosts
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - persistentvolumeclaims
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orka-agent-host-controller
  namespace: orka-agent-hosts
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orka-agent-host-controller
subjects:
- kind: ServiceAccount
  name: orka-controller-manager
  namespace: orka-system
