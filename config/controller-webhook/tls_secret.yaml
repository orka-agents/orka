# Rendered empty and never carries certificate or key material. The
# controller's certificate rotator populates tls.crt, tls.key, ca.crt, and
# ca.key; kubectl apply leaves data it never rendered untouched on later
# deploys.
apiVersion: v1
kind: Secret
metadata:
  name: orka-webhook-tls
  namespace: orka-system
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: kustomize
type: Opaque
