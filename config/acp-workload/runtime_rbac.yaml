apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
  name: runtime-controller-role
  namespace: orka-runtimes
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# The realized durable workspace PVC is attested (owner, spec, identity)
# before credential seeding, pinned before suspension, and proven deleted
# before finalization; the controller only ever reads it.
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Workspace-provider-backed RuntimePools (Agent Sandbox backend) materialize
# their workload through provider objects in the runtime namespace.
- apiGroups:
  - extensions.agents.x-k8s.io
  resources:
  - sandboxclaims
  - sandboxtemplates
  - sandboxwarmpools
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.x-k8s.io
  resources:
  - sandboxes
  verbs:
  - get
  - list
  # PVC-backed cold suspension patches the exact adopted Sandbox's
  # operatingMode and refreshes its blueprint for resume.
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
  name: runtime-controller-rolebinding
  namespace: orka-runtimes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runtime-controller-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
