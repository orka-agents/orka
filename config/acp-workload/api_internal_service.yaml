apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
  name: api-internal
  namespace: system
spec:
  # Workers, ACP runtimes, and the Workspace/Publisher report results, events,
  # broker calls, and artifact authorizations here. A planned-upgrade drain
  # holds controller readiness false for up to its timeout, which removes the
  # controller from the external api Service; publishing unready addresses
  # keeps these in-cluster callers connected to the controller that is still
  # draining.
  publishNotReadyAddresses: true
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: orka
