apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-publisher
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orka
      app.kubernetes.io/component: workspace-publisher
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orka
              control-plane: controller-manager
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orka
              control-plane: controller-manager
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orka
              app.kubernetes.io/component: scm-egress-proxy
      ports:
        - protocol: TCP
          port: 8080
