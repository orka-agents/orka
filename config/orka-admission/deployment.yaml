apiVersion: apps/v1
kind: Deployment
metadata:
  name: orka-admission
  namespace: orka-system
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orka
      app.kubernetes.io/component: admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orka
        app.kubernetes.io/component: admission
        orka.ai/network-role: admission
    spec:
      serviceAccountName: orka-admission
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: orka
                    app.kubernetes.io/component: admission
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admission
          # Production overlays must replace this with the digest-pinned
          # controller image containing /orka-admission.
          image: controller:latest
          imagePullPolicy: IfNotPresent
          command: [/orka-admission]
          args:
            - --health-probe-bind-address=:8081
            - --webhook-cert-path=/var/run/orka/admission/tls
            - --webhook-cert-name=tls.crt
            - --webhook-cert-key=tls.key
            - --webhook-service-dns-name=orka-admission.orka-system.svc
            - --controller-username=system:serviceaccount:orka-system:orka-controller-manager
            - --adjudication-controller-username=system:serviceaccount:orka-system:orka-controller-manager
            - --classification-usernames=system:serviceaccount:orka-system:orka-controller-manager
            - --admin-groups=system:masters
            - --task-provenance-trusted-users=system:serviceaccount:orka-system:orka-controller-manager
            - --task-provenance-trusted-service-accounts=orka-ai-worker,orka-vendor-worker
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /var/run/orka/admission/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: orka-admission-tls
            optional: false
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
