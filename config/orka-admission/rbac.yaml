apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orka-admission
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [core.orka.ai]
    resources:
      - agentexecutioncontrols
      - tasks
      - agentexecutionadjudications
    verbs: [get]
  - apiGroups: [core.orka.ai]
    resources: [runtimesessioncontrols]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orka-admission
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orka-admission
subjects:
  - kind: ServiceAccount
    name: orka-admission
    namespace: orka-system
