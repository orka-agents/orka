apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orka-admission
  namespace: orka-system
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orka
      app.kubernetes.io/component: admission
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: 9443
        - protocol: TCP
          port: 8081
  egress:
    - ports:
        - protocol: TCP
          port: 443
