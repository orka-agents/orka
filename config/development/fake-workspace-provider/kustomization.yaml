apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The in-memory fake workspace provider is a development aid, not a supported
# production provider. Keep its API and convenience RBAC out of config/default
# and the release chart while retaining an explicit package for local testing.
resources:
- ../../crd/bases/fake.workspace.orka.ai_fakeproviderconfigs.yaml
- ../../crd/bases/fake.workspace.orka.ai_fakepoolparameters.yaml
- ../../rbac/fake.workspace_fakepoolparameters_admin_role.yaml
- ../../rbac/fake.workspace_fakepoolparameters_editor_role.yaml
- ../../rbac/fake.workspace_fakepoolparameters_viewer_role.yaml
- ../../rbac/fake.workspace_fakeproviderconfig_admin_role.yaml
- ../../rbac/fake.workspace_fakeproviderconfig_editor_role.yaml
- ../../rbac/fake.workspace_fakeproviderconfig_viewer_role.yaml
- ../../rbac/fake_workspace_parameter_reader_role.yaml
