# Opt-in. Apply together with --agent-use-authorization-enabled on the
# controller; see README.md.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: task-agent-use.orka.ai
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["core.orka.ai"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["tasks"]
  validations:
  - expression: >-
      !has(object.spec.agentRef) ||
      (oldObject != null && has(oldObject.spec.agentRef) && oldObject.spec.agentRef == object.spec.agentRef) ||
      authorizer.group('core.orka.ai').resource('agents').namespace(object.spec.agentRef.?namespace.orValue(request.namespace)).name(object.spec.agentRef.name).check('use').allowed()
    message: caller is not authorized to use the Task's Agent
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: task-agent-use.orka.ai
spec:
  policyName: task-agent-use.orka.ai
  validationActions: [Deny]
---
