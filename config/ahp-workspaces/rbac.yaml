apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orka-ahp-workspace-controller
  namespace: orka-ahp-workspaces
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orka-ahp-workspace-controller
  namespace: orka-ahp-workspaces
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orka-ahp-workspace-controller
subjects:
- kind: ServiceAccount
  name: orka-controller-manager
  namespace: orka-system
