# Workspaces accept no inbound traffic and reach only DNS and HTTPS, which git
# uses to fetch the users' repositories. Enforcement needs a CNI that
# implements NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orka-ahp-workspaces
  namespace: orka-ahp-workspaces
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ahp-workspace
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 443
