---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: connections.core.orka.ai
spec:
  group: core.orka.ai
  names:
    kind: Connection
    listKind: ConnectionList
    plural: connections
    singular: connection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .spec.subject.subject
      name: Subject
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Connection is one person's linked account with one ConnectorProvider.
          Deleting it is the disconnect.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConnectionSpec links one person to one ConnectorProvider.
            properties:
              mode:
                default: readOnly
                description: |-
                  Mode is readOnly or readWrite. readOnly hides the provider's write tools
                  from agents and requests only read scopes.
                enum:
                - readOnly
                - readWrite
                type: string
              providerRef:
                description: ProviderRef names a ConnectorProvider in the same namespace.
                properties:
                  name:
                    description: Name is the referenced object name.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              subject:
                description: Subject is the owning verified identity.
                properties:
                  issuer:
                    description: Issuer is the identity issuer that verified the subject.
                    maxLength: 512
                    minLength: 1
                    type: string
                  subject:
                    description: Subject is the issuer-scoped stable subject identifier.
                    maxLength: 512
                    minLength: 1
                    type: string
                required:
                - issuer
                - subject
                type: object
            required:
            - providerRef
            - subject
            type: object
            x-kubernetes-validations:
            - message: subject is immutable
              rule: self.subject == oldSelf.subject
            - message: providerRef is immutable
              rule: self.providerRef == oldSelf.providerRef
          status:
            description: ConnectionStatus reports link state. It never carries token
              material.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consent:
                description: |-
                  Consent identifies the ConnectorProvider OAuth client the last consent
                  was granted against. The controller requires a new consent when the
                  provider is replaced or its OAuth authority changes.
                properties:
                  authorityDigest:
                    description: |-
                      AuthorityDigest is a hex SHA-256 digest of the provider's OAuth client
                      identity (client ID, client secret reference, authentication method,
                      and endpoints) at consent time. It carries no secret material.
                    maxLength: 64
                    type: string
                  providerUID:
                    description: ProviderUID is the UID of the ConnectorProvider at
                      consent time.
                    maxLength: 253
                    type: string
                type: object
              expiresAt:
                description: ExpiresAt is the held access token's expiry, if the provider
                  reported one.
                format: date-time
                type: string
              grantSequence:
                description: |-
                  GrantSequence counts completed consents on this Connection. It rises
                  on every commit, so authority bound to one grant (a frozen execution
                  snapshot or a standing approval) does not carry over to a later
                  re-link of the same Connection object.
                format: int64
                type: integer
              grantedScopes:
                description: |-
                  GrantedScopes are the scopes the provider reported at consent time, or
                  the requested scopes when the provider reported none.
                items:
                  type: string
                type: array
              lastRefreshTime:
                description: LastRefreshTime is when the held material was last refreshed.
                format: date-time
                type: string
              linkedAt:
                description: LinkedAt is when consent last completed.
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              state:
                description: State is Pending, Ready, Expired, Revoked, or Error.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
