apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orka-provider-auth-proxy-only
  namespace: vekil-system
  labels:
    app.kubernetes.io/managed-by: orka
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vekil
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orka-system
          podSelector:
            matchLabels:
              orka.ai/network-role: provider-auth-proxy
      ports:
        - protocol: TCP
          port: 1337
