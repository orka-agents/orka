apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provider-auth-proxy
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/component: provider-auth-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orka
      app.kubernetes.io/component: provider-auth-proxy
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orka-runtimes
          podSelector:
            matchLabels:
              orka.ai/network-role: provider-client
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vekil-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vekil
      ports:
        - {protocol: TCP, port: 1337}
