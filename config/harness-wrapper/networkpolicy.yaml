apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-harness-wrapper
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/component: agent-harness-wrapper
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orka
      app.kubernetes.io/component: agent-harness-wrapper
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orka
              control-plane: controller-manager
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orka
              app.kubernetes.io/component: agent-harness-wrapper-drain
      ports:
        - protocol: TCP
          port: 8080
  # Permit only the dedicated controller, DNS, and public HTTPS for provider
  # APIs and credential-free, read-only SCM access. Private and local
  # destination ranges remain denied.
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orka
              control-plane: controller-manager
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: ::/0
            except:
              - ::/128
              - ::1/128
              - 64:ff9b::/96
              - 64:ff9b:1::/48
              - 100::/64
              - 2001::/32
              - 2001:db8::/32
              - 2002::/16
              - fc00::/7
              - fe80::/10
              - ff00::/8
      ports:
        - protocol: TCP
          port: 443
