apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This compatibility data plane is intentionally not referenced by
# config/default or config/acp-production. Apply it only after explicitly
# enabling harness v1 in the durable AgentExecutionControl.
namespace: orka-system

# harness-wrapper-auth must be pre-created; see README.md.
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - networkpolicy.yaml
