apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This compatibility data plane is intentionally not referenced by
# config/default or config/acp-production. Apply it only after explicitly
# selecting a dedicated harness-v1 controller installation.
namespace: orka-system

# The distinct harness-wrapper-auth and harness-wrapper-tls Secrets must be
# pre-created; see README.md.
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - networkpolicy.yaml
