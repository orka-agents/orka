# Defense-in-depth admission for the one-time absent-to-explicit Agent and
# AgentRuntime contract classification. The live Open inventory is the only
# migration window; missing or stale control parameters deny the write.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: orka-agent-execution-classification
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: core.orka.ai/v1alpha1
    kind: AgentExecutionControl
  matchConstraints:
    resourceRules:
      - apiGroups: ["core.orka.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE"]
        resources: ["agents", "agentruntimes"]
  matchConditions:
    - name: contract-classification-introduced
      expression: >-
        (request.resource.resource == 'agents' &&
        object.?spec.?runtime.?contractVersion.hasValue() &&
        !oldObject.?spec.?runtime.?contractVersion.hasValue()) ||
        (request.resource.resource == 'agentruntimes' &&
        object.?spec.?contractVersion.hasValue() &&
        !oldObject.?spec.?contractVersion.hasValue())
  validations:
    - expression: >-
        params != null &&
        params.metadata.name == 'cluster' &&
        params.metadata.namespace == 'orka-system' &&
        string(params.metadata.uid) != '' &&
        params.metadata.generation > 0 &&
        params.?status.?classification.hasValue() &&
        params.status.classification.state == 'Open' &&
        string(params.status.classification.controlUID) == string(params.metadata.uid) &&
        params.status.classification.controlGeneration == params.metadata.generation &&
        params.status.classification.inventoryID != '' &&
        params.status.classification.inventoryDigest.matches('^sha256:[a-f0-9]{64}$')
      message: contract classification requires the exact live Open migration inventory
    - expression: >-
        request.userInfo.username ==
        'system:serviceaccount:orka-system:orka-controller-manager'
      message: contract classification is restricted to the bridge classifier identity
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: orka-agent-execution-classification
spec:
  policyName: orka-agent-execution-classification
  validationActions: ["Deny"]
  paramRef:
    name: cluster
    namespace: orka-system
    parameterNotFoundAction: Deny
