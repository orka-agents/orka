# The Entra agent identity blueprint trusts tokens issued to the controller
# ServiceAccount (ADR 0039), so no other workload may run as it. The AI worker
# creates code_exec Jobs in the controller's namespace; this policy keeps any
# Job, CronJob, or Pod there from naming the controller ServiceAccount, except
# the Pods of the controller's own Deployment. Only the Helm chart projects
# the blueprint's token, so only the chart renders this policy, when an Entra
# agent identity issuer is configured; it is not part of this kustomization.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: controller-serviceaccount-protection
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  matchConditions:
  - name: controller-namespace
    expression: "request.namespace == 'ORKA_NAMESPACE'"
  variables:
  - name: podSpec
    expression: >-
      request.kind.kind == 'Pod' ? object.spec :
      (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec.jobTemplate.spec.template.spec)
  # A Pod spec without a ServiceAccount runs as "default".
  - name: serviceAccount
    expression: >-
      has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName != '' ? variables.podSpec.serviceAccountName :
      (has(variables.podSpec.serviceAccount) && variables.podSpec.serviceAccount != '' ? variables.podSpec.serviceAccount : 'default')
  validations:
  - expression: >-
      variables.serviceAccount != 'CONTROLLER_SA' ||
      (request.kind.kind == 'Pod' && has(object.metadata.ownerReferences) &&
      object.metadata.ownerReferences.exists(r, r.apiVersion == 'apps/v1' && r.kind == 'ReplicaSet' &&
      has(r.controller) && r.controller))
    message: only the controller Deployment may run as the controller ServiceAccount, whose tokens the agent identity blueprint trusts
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: controller-serviceaccount-protection
spec:
  policyName: controller-serviceaccount-protection
  validationActions: [Deny]
