# This rule is not used by the project orka itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants management of ExecutionWorkspaceClasses, and their use by Tasks.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.
#
# The verbs are listed rather than '*' on purpose. A wildcard would also grant
# the "operator-access" verb, which the operator-access admission policy
# requires before a class can be opted into orka task exec and orka task cp.
# That verb must come from a separate, deliberate grant.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
  name: workspace-executionworkspaceclass-admin-role
rules:
- apiGroups:
  - workspace.orka.ai
  resources:
  - executionworkspaceclasses
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - use
  - watch
- apiGroups:
  - workspace.orka.ai
  resources:
  - executionworkspaceclasses/status
  verbs:
  - get
