    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
  name: task-pod-provenance-admitter
rules:
- apiGroups:
  - ""
  resources:
  - pods/task-provenance
  verbs:
  - admit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
  name: task-pod-provenance-admitter
roleRef:
