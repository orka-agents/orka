# Aggregates EvalRun management into the built-in "admin" ClusterRole.
# Creating an EvalRun is equivalent to creating Tasks that run the referenced
# monitor's reviewer Agent in that namespace. The verbs are listed rather than
# "*" so admin never gains decide, which only orka-eval-promoter grants.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
  name: evalrun-admin-role
rules:
- apiGroups:
  - core.orka.ai
  resources:
  - evalruns
  verbs:
  - create
  - delete
  - deletecollection
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.orka.ai
  resources:
  - evalruns/status
  verbs:
  - get
