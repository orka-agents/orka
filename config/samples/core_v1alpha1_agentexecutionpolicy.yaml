apiVersion: core.orka.ai/v1alpha1
kind: AgentExecutionPolicy
metadata:
  name: compatibility
  namespace: default
spec:
  # New v1 bindings are admitted only under an explicit admin-owned policy.
  # The evaluated policy UID, generation, and digest freeze into each binding.
  allowNewV1Bindings: false
  allowedBuiltInRuntimeTypes: []
  allowPublicReadOnlyWorkspaces: false
  allowTrustedObservedModeRuntimes: false
  allowedBrokeredToolClasses:
    - read
  retryEligibility: none
  # The first four entries are mandatory fail-closed floors and cannot be
  # removed from any policy.
  prohibitedFields:
    - workspace-credentials
    - forge-credentials
    - direct-publication
    - transaction-tokens
  networkIsolationProfile: default-deny
