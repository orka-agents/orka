apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: agent-task-workspace-example
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
spec:
  # type: agent uses the ACP v2 RuntimePool selected from the referenced Agent.
  type: agent
  agentRef:
    name: claude-agent
  prompt: "Fix the failing CI tests in the api/ directory"
  # Repository input and delivery policy live at top-level spec.workspace.
  workspace:
    intent: write
    # The clean-room workspace boundary clones this credential-free source URL.
    gitRepo: "https://github.com/example/my-project.git"
    branch: "main"
    # Use ref instead of branch to pin a commit or tag.
    # ref: "0123456789abcdef0123456789abcdef01234567"
    readCredentialRef:
      name: my-project-source-read
    # Publication is a separate repository/credential role. The credential is
    # resolved only by the Workspace/Publisher and never enters the ACP runtime.
    publicationGitRepo: "https://github.com/example/my-project.git"
    publicationReadCredentialRef:
      name: my-project-publication-read
      key: token
    publicationCredentialRef:
      name: my-project-publication-write
      key: token
    forgeCredentialRef:
      name: my-project-forge
      key: token
    pushBranch: "orka/fix-api-tests"
    prBaseBranch: "main"
    createPR: true
    # subPath restricts the workspace root to a repository subdirectory.
    # subPath: "services/api"
  # agentRuntime contains only per-Task runtime overrides.
  agentRuntime:
    maxTurns: 100
    allowBash: true
    allowedTools:
      - Read
      - Write
      - Edit
      - Bash
      - Glob
      - Grep
  timeout: "30m"
  priority: 600
