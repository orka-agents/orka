# This Agent shows the future namespace-local external v2 selector shape from
# core_v1alpha1_agentruntime.yaml. Registration and conformance are available,
# but runtimeRef Task dispatch remains fail-closed until the external v2
# dispatcher support boundary is enabled. Built-in Codex, Claude, Copilot, and
# OpenCode Agents use runtime.type instead.
apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
  name: external-v2-agent
spec:
  model:
    name: operator-reviewed-model
  systemPrompt:
    inline: "You are an operator-reviewed external coding assistant."
  runtime:
    runtimeRef:
      name: sample-external-v2-runtime
