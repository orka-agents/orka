apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
  name: claude-agent
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
spec:
  # model configures the LLM (passed as --model flag to Claude CLI)
  model:
    name: "claude-sonnet-4-20250514"
  # systemPrompt is injected via --system-prompt; can also use configMapRef
  systemPrompt:
    inline: "You are a helpful coding assistant."
  # Provider credentials are injected only by the central authenticated proxy;
  # no provider Secret is referenced by an ACP Agent or delivered to its runtime.
  # runtime.type selects the built-in Claude ACP profile backed exclusively by
  # a controller-owned, digest-pinned orka.harness.v2 RuntimePool. There is no
  # per-Task Job/image or legacy harness fallback. It is mutually exclusive
  # with providerRef, which is for native type: ai tasks.
  runtime:
    contractVersion: orka.harness.v2
    # type selects a supported ACP runtime profile.
    type: claude
    # defaultMaxTurns is the default max agent loop iterations per task
    defaultMaxTurns: 50
    # defaultAllowBash enables bash commands by default for tasks using this Agent
    defaultAllowBash: true
    # defaultAllowedTools lists the Claude CLI tools available by default
    defaultAllowedTools:
      - Read
      - Write
      - Edit
      - Bash
      - Glob
      - Grep
