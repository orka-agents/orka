# Example self-improvement protected set for the Orka repository.
#
# Apply it in the controller namespace and start the controller with
# --protected-set-configmap=orka-protected-set and Task provenance admission
# enabled (the controller refuses to start otherwise). Without a valid protected set,
# Tasks marked orka.ai/improvement-role: proposer fail with
# ProposerConstraintViolation instead of running. Change it only through the
# reviewed deployment configuration.
#
# Every file that implements a proposer enforcement point is listed for this
# repository; a test fails if a file named in the enforcement table of
# docs/adr/0040-self-improvement-trust-boundaries.md is not covered here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: orka-protected-set
  namespace: orka-system
data:
  protectedSet.yaml: |
    schemaVersion: orka.protectedSet.v1
    paths:                         # always denied to proposers, in every repository
      - .github/**
      - config/rbac/**
      - charts/**
    repositories:
      - repository: github.com/orka-agents/orka
        paths:                     # added for this repository
          - internal/evals/**      # graders and the gate
          - test/evals/**
          - internal/api/*authoriz*
          - internal/api/auth*.go                          # authentication
          - internal/api/context_token*.go                 # transaction and context tokens
          - Makefile                                       # the test and lint targets CI runs
          - .golangci.yml
          - internal/api/server.go                         # route registration
          - internal/api/eval*.go                          # proposal and decision handlers
          - internal/api/agent_rollout*.go                 # rollout handler
          - internal/admission/**
          - internal/outboundaccess/**
          - internal/tools/**                              # brokered tool registry and implementations
          - internal/controller/acp_mcp_broker*.go         # proposer tool allowlist
          - internal/controller/acp_mcp_policy*.go         # compiles the tool policy
          - internal/controller/acp_runtime_profile*.go    # pins the policy into the profile
          - internal/controller/acp_dispatcher*.go         # dispatch-time checks
          - internal/controller/acp_task_queue.go          # calls the dispatch-time check
          - internal/controller/task_controller.go         # fails marked Tasks outside the ACP path
          - internal/controller/acp_publication*.go        # sends deniedPaths to the publisher
          - internal/controller/acp_credentials.go         # credential binding and version checks
          - internal/controller/acp_workspace.go           # repository identities used to select protected paths
          - internal/controller/agent_execution_binding*.go # canary routing
          - internal/controller/evalrun*.go                # evaluator
          - internal/controller/runtime_pool_*.go          # RuntimePool tokens, credentials, network isolation and startup attestation
          - internal/controller/repositorymonitor_issue_actions.go # implementation limits
          - internal/controller/repositorymonitor_repair.go # repair limits
          - internal/protectedset/**                       # protected-set schema and checks
          - internal/workspacedelta/**                     # shared deniedPaths matcher
          - internal/harness/v2/**                         # operation capabilities, credential bootstrap, request digests, deniedPaths to the runtime
          - internal/acp/**                                # child UID/GID isolation, private session environment, supervisor hardening, adapter pins
          - internal/labels/labels.go                      # the improvement-role annotation key
          - internal/publisher/**                          # credential and publication boundary
          - internal/security/policy.go                    # secret detection in published and returned text
          - internal/security/secretscan.go
          - internal/store/**                              # trial, decision and promotion records
          - workers/acp/supervisor/**                      # deniedPaths check
          - Dockerfile                                     # controller and admission images
          - workers/acp/images/**                          # ACP runtime images (supervisor)
          - workers/publisher/Dockerfile                   # publisher image
          - api/v1alpha1/**                                # the fields that carry these rules
          - cmd/**                                         # flag wiring and Helm chart sources (cmd/build/helmify/static)
          - config/**                                      # deployment inputs: admission webhooks and policies, manager, network policies
          - manifest_staging/**                            # generated install manifests and chart
          - deploy/**                                      # released install manifests
          - scripts/**                                     # CI and release validation helpers
          - config/samples/orka_protected_set.yaml         # this declaration
          - docs/adr/**                                    # the recorded trust boundaries
          - AGENTS.md
    caseSets:                      # case ConfigMaps by split
      - {namespace: orka-evals, name: pr-review-train,   split: train}
      - {namespace: orka-evals, name: pr-review-heldout, split: heldOut}
    gate:                          # improvement thresholds, see #994
      maxInfraErrorPercent: 10
      maxCandidatesPerBaseline: 3
      maxExperimentsPerHeldOutSet: 10   # then the held-out case set must be rotated
      minTargetImprovementPoints: 5     # target pass@1 must rise by at least this many points
      significance: 0.05                # one-sided paired test, divided by maxExperimentsPerHeldOutSet
