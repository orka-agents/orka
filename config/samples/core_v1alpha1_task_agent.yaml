apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  name: agent-task-example
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
spec:
  # type: agent uses a fenced ACP v2 RuntimeSession in a controller-owned pool.
  # Provider authentication comes only through the central provider proxy;
  # neither this Task nor the Agent references a provider credential Secret.
  type: agent
  agentRef:
    name: claude-agent
  prompt: "Review main.go for structured logging opportunities. Do not modify files."
  workspace:
    intent: read
    gitRepo: "https://github.com/example/my-project.git"
    branch: "main"
    # Optional for private repositories; used only by the clean-room clone path.
    # readCredentialRef:
    #   name: my-project-read
  # agentRuntime contains only task-level overrides of Agent runtime defaults.
  agentRuntime:
    maxTurns: 100
    allowBash: true
  timeout: "30m"
  priority: 500
