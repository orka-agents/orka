apiVersion: core.orka.ai/v1alpha1
kind: AgentExecutionControl
metadata:
  name: cluster
  namespace: orka-system
spec:
  backends:
    # The source protocol starts enabled and the other protocol disabled.
    # Mode transitions are linearized by the controller's closing barrier;
    # this object is the durable, revisioned admission authority.
    v1:
      desiredMode: disabled
    v2:
      desiredMode: enabled
