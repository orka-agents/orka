apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
  name: opencode-agent
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/managed-by: kustomize
spec:
  # OpenCode model IDs use provider/model form.
  model:
    name: "openai/gpt-5.4"
    # Reviewed operational ceilings; set these from the selected model's contract.
    contextWindow: 32768
    maxTokens: 4096
  # Provider credentials are injected only by the central authenticated proxy;
  # no provider Secret is referenced by an ACP Agent or delivered to its runtime.
  # runtime.type selects the built-in OpenCode ACP profile backed exclusively by
  # a controller-owned, digest-pinned orka.harness.v2 RuntimePool. There is no
  # per-Task Job/image or legacy harness fallback.
  runtime:
    contractVersion: orka.harness.v2
    type: opencode
    defaultMaxTurns: 50
    defaultAllowBash: true
    defaultAllowedTools:
      - read
      - write
      - edit
      - bash
      - glob
      - grep
