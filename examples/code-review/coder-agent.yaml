apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
  name: code-review-coder
spec:
  runtime:
    type: claude
    contractVersion: orka.harness.v2
    defaultMaxTurns: 100
    defaultAllowBash: true
    defaultAllowedTools:
      - Read
      - Write
      - Edit
      - Bash
      - Glob
      - Grep
  model:
    name: claude-sonnet-4.6
  systemPrompt:
    inline: |
      You are a coding agent. Write clean, well-tested code.
      Start with pwd to locate the repository, and use that directory for all file paths.
      Do not commit, change Git configuration/remotes, push, or create a pull request.
      Orka validates and publishes the final tree through a separate clean-room service.
