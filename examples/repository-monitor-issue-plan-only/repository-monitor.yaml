apiVersion: core.orka.ai/v1alpha1
kind: RepositoryMonitor
metadata:
  name: issue-plan-only
spec:
  provider: github
  repoURL: https://github.com/example-org/example-repo
  branch: main
  readCredentialRef:
    name: orka-monitor-source-read
  forgeCredentialRef:
    name: orka-monitor-forge
  targets:
    pullRequests:
      enabled: false
    issues:
      enabled: true
      maxPerRun: 5
      excludeLabels:
      - blocked
      - security-sensitive
  triggers:
    github:
      labels:
        enabled: false
        consumeCommandLabels: true
        issues:
          implement: orka:implement
  agents:
    triager:
      name: issue-researcher
    researcher:
      name: issue-researcher
    planner:
      name: issue-researcher
  issueWorkflow:
    implementation:
      enabled: false
    planning: {}
  policy:
    protectedLabels: []
    pauseLabels:
    - orka:pause
