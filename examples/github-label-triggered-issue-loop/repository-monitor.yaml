apiVersion: core.orka.ai/v1alpha1
kind: RepositoryMonitor
metadata:
  name: issue-to-pr-loop
spec:
  provider: github
  repoURL: https://github.com/example-org/example-repo
  branch: main
  readCredentialRef:
    name: orka-monitor-source-read
  publicationReadCredentialRef:
    name: orka-monitor-publication-read
  publicationCredentialRef:
    name: orka-monitor-publication
  forgeCredentialRef:
    name: orka-monitor-forge
  targets:
    issues:
      enabled: true
      maxPerRun: 10
      excludeLabels:
      - blocked
      - waiting-external
      - security-sensitive
    pullRequests:
      enabled: true
      includeDrafts: false
      maxPerRun: 20
  triggers:
    github:
      labels:
        enabled: true
        consumeCommandLabels: true
        requireActorPermission: write
        issues:
          implement: orka:implement
  agents:
    triager:
      name: issue-researcher
    researcher:
      name: issue-researcher
    planner:
      name: issue-researcher
    implementer:
      name: issue-implementer
    reviewer:
      name: pr-reviewer
    repairer:
      name: issue-implementer
  issueWorkflow:
    planning: {}
    implementation:
      branchPrefix: orka/issue
      requirePlan: true
  review:
    exactEventEnabled: true
    staleReviewTTL: 24h
    publish:
      enabled: true
      event: COMMENT
      mode: summary_with_inline_findings
  repair:
    enabled: true
    maxRepairsPerPR: 5
    maxRepairsPerHead: 2
  policy:
    protectedLabels:
    - security
    - security-sensitive
    - orka:needs-human
    pauseLabels:
    - blocked
    - waiting-external
    - orka:pause
    allowedRepositoryPermissions:
    - write
    - maintain
    - admin
  validation:
    image: ghcr.io/example-org/example-repo-validation@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
