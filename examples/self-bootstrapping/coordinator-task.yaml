apiVersion: core.orka.ai/v1alpha1
kind: Task
metadata:
  generateName: bootstrap-plan-
spec:
  type: ai
  agentRef:
    name: coordinator
  prompt: |
    BOOTSTRAP specialist Agents for a future reviewed implementation plan for a TODO REST API in Go:
    - CRUD endpoints (GET, POST, PUT, DELETE) for /api/todos
    - In-memory storage
    - Unit tests for all handlers
    - Clean code with proper error handling

    Create specialist Agents for API design, test planning, and review. Return their
    exact names, namespaces, roles, and suggested delegation prompts. Do not delegate:
    the operator must add them to allowedAgents and submit a NEW Task first.
    Use the supplied context; no repository access, code execution, or publication is needed.
  timeout: 10m
