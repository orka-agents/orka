# Copy into .github/workflows/ci-feedback.yml in the repository to repair.
# Required repository secrets: ORKA_API_URL and ORKA_TOKEN.
# Optional repository variable: ORKA_NAMESPACE, default orka-system.
# The Task namespace needs claude-coder, repository-read, and repository-publish.
name: CI Feedback to Orka
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  trigger-fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null &&
      github.event.workflow_run.head_branch != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Orka repair agent
        env:
          ORKA_API_URL: ${{ secrets.ORKA_API_URL }}
          ORKA_TOKEN: ${{ secrets.ORKA_TOKEN }}
          ORKA_NAMESPACE: ${{ vars.ORKA_NAMESPACE || 'orka-system' }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          jq -n \
            --arg name "ci-fix-${CI_RUN_ID}" \
            --arg namespace "$ORKA_NAMESPACE" \
            --arg repo "https://github.com/${REPOSITORY}.git" \
            --arg branch "$BRANCH" \
            --arg sha "$HEAD_SHA" \
            '{
              name: $name,
              namespace: $namespace,
              type: "agent",
              agentRef: {name: "claude-coder"},
              prompt: ("CI failed on branch " + $branch + " at " + $sha + ". Fix only the CI failure. Do not commit or push; Orka owns publication."),
              workspace: {
                intent: "write",
                gitRepo: $repo,
                branch: $branch,
                ref: $sha,
                readCredentialRef: {name: "repository-read"},
                publicationGitRepo: $repo,
                publicationReadCredentialRef: {name: "repository-read"},
                publicationCredentialRef: {name: "repository-publish"},
                pushBranch: $branch,
                expectedRemoteSHA: $sha
              },
              agentRuntime: {maxTurns: 40},
              timeout: "20m",
              priority: 900
            }' > "$RUNNER_TEMP/orka-repair.json"
          curl --fail-with-body --silent --show-error \
            -X POST "${ORKA_API_URL%/}/api/v1/tasks" \
            -H "Authorization: Bearer $ORKA_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/orka-repair.json"
