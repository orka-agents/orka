apiVersion: v1
kind: Secret
metadata:
  name: repository-read
type: Opaque
stringData:
  # Use a read-only, repository-scoped token.
  token: "<read-token>"
---
apiVersion: v1
kind: Secret
metadata:
  name: repository-publish
type: Opaque
stringData:
  # Use a separately scoped token permitted to update the publication branch.
  token: "<write-token>"
---
apiVersion: v1
kind: Secret
metadata:
  name: repository-forge
type: Opaque
stringData:
  # This credential authorizes GitHub API calls that create pull requests.
  token: "<forge-token>"
