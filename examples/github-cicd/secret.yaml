apiVersion: v1
kind: Secret
metadata:
  name: repository-read
type: Opaque
stringData:
  # Use a read-only, repository-scoped token.
  token: "github_pat_READ_ONLY_PLACEHOLDER"
---
apiVersion: v1
kind: Secret
metadata:
  name: repository-publish
type: Opaque
stringData:
  # Use a separately scoped token permitted to update the publication branch
  # and create/reconcile pull requests.
  token: "github_pat_PUBLICATION_PLACEHOLDER"
