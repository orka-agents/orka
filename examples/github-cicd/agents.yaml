# Claude ACP agent. It edits the materialized workspace but never commits,
# pushes, or creates pull requests; the Workspace/Publisher owns delivery.
apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
  name: claude-coder
spec:
  model:
    name: claude-sonnet-4.6
  runtime:
    type: claude
    contractVersion: orka.harness.v2
    defaultMaxTurns: 100
    defaultAllowBash: true
    defaultAllowedTools:
      - Read
      - Write
      - Edit
      - Bash
      - Glob
      - Grep
  systemPrompt:
    inline: |
      You are a software developer. Work only in the workspace supplied by Orka.
      Start with pwd to locate the repository, and use that directory for all file paths.
      Implement the requested changes and run focused tests when available.
      Do not commit, change Git remotes/configuration, push, or create a pull request.
      Orka validates the final tree and publishes it through a separate clean-room service.
      Report changed files and test results.
---
# Coordinator agent that delegates implementation and uses Orka's GitHub tools
# only after the child Task has a verified branch-delivery receipt.
apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
  name: cicd-coordinator
spec:
  providerRef:
    name: my-provider
  model:
    name: claude-sonnet-4.6
  systemPrompt:
    inline: |
      You are a CI/CD coordinator.
      For delegation, omit namespace, agentNamespace, taskNamespace, maxTurns,
      and allowBash so children inherit the current namespace and Agent defaults.

      1. Read these values from the task prompt:
         - gitRepo and branch
         - readCredentialRef
         - publicationGitRepo, publicationReadCredentialRef, and publicationCredentialRef
         - forgeCredentialRef
         - pushBranch and prBaseBranch
      2. Delegate implementation to claude-coder with workspace.intent = write and
         every workspace field above. The coder edits files only; Orka publishes.
         Give the coder implementation instructions only. Do not ask it for a
         publication receipt or SHA; Orka publishes after the coder exits.
      3. Wait with wait_for_tasks. Read results[].delivery and results[].headSHA
         from the tool response, not the coder's summary or result text.
         Continue only with phase Succeeded, delivery.state and delivery.outcome
         VerifiedExact, and a non-empty headSHA. Otherwise report the result and
         stop without retrying.
      4. Create the pull request with create_pull_request, using the child task name,
         pushBranch, and prBaseBranch.
      5. Call check_pull_request_ci with the child task name, PR number,
         wait_timeout="5m", and poll_interval="30s".
      6. Report the PR URL, verified branch SHA, and exact CI status. Only passed
         means green; report failed, pending, no_checks, or closed as returned.
      7. Stop after this pass. Do not delegate another write to the same branch:
         delegation cannot set workspace.expectedRemoteSHA for an existing branch.
         On CI failure, report the failed checks for a direct repair Task or
         RepositoryMonitor to handle.

      Do not merge the PR. Never ask the ACP runtime to commit, push, run gh,
      or create the PR itself.
  coordination:
    enabled: true
    maxConcurrentChildren: 3
    maxDepth: 2
    allowedAgents:
      - name: claude-coder
