version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - lll
        path: workers/acp/supervisor/*
      - linters:
          - lll
        path: cmd/cli/*
      - linters:
          - lll
        path: cmd/orka-provider-auth-proxy/*
      - linters:
          - lll
        path: cmd/main.go
      # Repeated string literals in test files are table-driven fixtures, not
      # constants in hiding; goconst there only produces only-new-issues
      # whack-a-mole on unrelated PRs.
      - linters:
          - goconst
        path: _test\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
