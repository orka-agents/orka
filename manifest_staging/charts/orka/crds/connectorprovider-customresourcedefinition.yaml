---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: connectorproviders.core.orka.ai
spec:
  group: core.orka.ai
  names:
    kind: ConnectorProvider
    listKind: ConnectorProviderList
    plural: connectorproviders
    singular: connectorprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .status.conditions[?(@.type=="ResolvedRefs")].status
      name: ResolvedRefs
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConnectorProvider is an operator-owned catalog entry describing how people
          link one third-party service and which tools it offers.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ConnectorProviderSpec is the operator-owned catalog entry for one third-party
              service that people may link through OAuth.
            properties:
              displayName:
                description: |-
                  DisplayName is shown to people in the dashboard and CLI. Defaults to the
                  object name.
                maxLength: 128
                type: string
              oauth:
                description: OAuth configures the authorization-code flow used to
                  link an account.
                properties:
                  additionalAuthorizeParameters:
                    additionalProperties:
                      type: string
                    description: |-
                      AdditionalAuthorizeParameters are static query parameters appended to the
                      authorize URL. Reserved OAuth fields are rejected.
                    maxProperties: 16
                    type: object
                  authorizeURL:
                    description: AuthorizeURL is the provider's absolute HTTPS authorization
                      endpoint.
                    minLength: 1
                    type: string
                  clientAuthentication:
                    default: ClientSecretBasic
                    description: |-
                      ClientAuthentication selects how the client secret is presented to the
                      token endpoint. Defaults to ClientSecretBasic.
                    enum:
                    - ClientSecretBasic
                    - ClientSecretPost
                    type: string
                  clientID:
                    description: ClientID is the public OAuth client identifier registered
                      with the provider.
                    maxLength: 256
                    minLength: 1
                    type: string
                  clientSecretRef:
                    description: ClientSecretRef selects the OAuth client secret from
                      a same-namespace Secret.
                    properties:
                      key:
                        description: Key is the key within the Secret
                        type: string
                      name:
                        description: Name is the name of the Secret
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  pkce:
                    default: true
                    description: |-
                      PKCE enables RFC 7636 code verification. Defaults to true and must stay
                      true unless the provider cannot accept a code_challenge.
                    type: boolean
                  revocationURL:
                    description: |-
                      RevocationURL is an optional RFC 7009 revocation endpoint called on
                      disconnect for the committed credential. Revocation is best-effort, and
                      Orka never revokes material it did not commit: a token from a consent
                      nobody completed is deleted and left to expire, because it may belong
                      to a different person's grant.
                    type: string
                  scopes:
                    description: |-
                      Scopes groups the OAuth scopes requested for each Connection mode. A
                      readOnly Connection requests only read scopes; readWrite requests both.
                    properties:
                      read:
                        description: Read scopes are requested for every Connection.
                        items:
                          maxLength: 256
                          type: string
                        maxItems: 32
                        type: array
                      write:
                        description: Write scopes are additionally requested for readWrite
                          Connections.
                        items:
                          maxLength: 256
                          type: string
                        maxItems: 32
                        type: array
                    type: object
                  tokenURL:
                    description: |-
                      TokenURL is the provider's absolute HTTPS token endpoint used for the
                      code exchange and for refresh.
                    minLength: 1
                    type: string
                required:
                - authorizeURL
                - clientID
                - clientSecretRef
                - tokenURL
                type: object
                x-kubernetes-validations:
                - message: authorizeURL must use https
                  rule: self.authorizeURL.startsWith('https://')
                - message: tokenURL must use https
                  rule: self.tokenURL.startsWith('https://')
                - message: revocationURL must use https
                  rule: '!has(self.revocationURL) || self.revocationURL.startsWith(''https://'')'
                - message: additionalAuthorizeParameters must not contain reserved
                    OAuth fields
                  rule: '!has(self.additionalAuthorizeParameters) || self.additionalAuthorizeParameters.all(k,
                    !(k.lowerAscii() in [''client_id'',''client_secret'',''redirect_uri'',''response_type'',''scope'',''state'',''code_challenge'',''code_challenge_method'',''code'',''code_verifier'',''grant_type'',''refresh_token'']))'
              tools:
                description: |-
                  Tools declares the tools this provider offers to agents acting for a
                  linked person. Built-in tools name an Orka built-in; HTTP tools carry a
                  curated definition executed by the controller with the person's token.
                items:
                  description: ConnectorTool declares one tool a provider offers.
                  properties:
                    class:
                      description: |-
                        Class is read or write. Write tools are hidden from readOnly Connections
                        and default into the Agent's approval-required set.
                      enum:
                      - read
                      - write
                      type: string
                    description:
                      description: Description is shown to the LLM for HTTP tools.
                      maxLength: 1024
                      type: string
                    http:
                      description: |-
                        HTTP is the request definition for HTTP tools. The controller adds the
                        person's bearer credential at call time; no other auth is configurable.
                      properties:
                        headers:
                          additionalProperties:
                            type: string
                          description: Headers are static non-credential headers.
                            Authorization is reserved.
                          maxProperties: 16
                          type: object
                        method:
                          default: POST
                          description: Method defaults to POST.
                          enum:
                          - GET
                          - POST
                          - PUT
                          - PATCH
                          - DELETE
                          type: string
                        timeout:
                          description: |-
                            Timeout bounds the request. Defaults to 30s and may not exceed 10m. It
                            is a single bounded component ("30s", "2.5m", "500µs") or the canonical
                            form a typed client serializes ("10m0s", "2m30s"). Every component is
                            bounded, so each stored value decodes as a Go duration without
                            overflow and one malformed provider cannot break the typed informer
                            for every provider.
                          maxLength: 16
                          pattern: ^([0-9]{1,4}(\.[0-9]{1,9})?(ns|us|µs|μs|ms|s|m|h)|([0-9]{1,4}h)?([0-9]{1,4}m)?[0-9]{1,4}(\.[0-9]{1,9})?s)$
                          type: string
                          x-kubernetes-validations:
                          - message: timeout must be positive and at most 10m
                            rule: duration(self) > duration('0s') && duration(self)
                              <= duration('10m')
                        url:
                          description: URL is the absolute HTTPS endpoint called when
                            the tool is invoked.
                          minLength: 1
                          type: string
                      required:
                      - url
                      type: object
                      x-kubernetes-validations:
                      - message: connector tool url must use https
                        rule: self.url.startsWith('https://')
                    name:
                      description: |-
                        Name is the tool name exposed to agents. For Builtin tools it must match
                        an Orka built-in tool name.
                      maxLength: 64
                      minLength: 1
                      pattern: ^[a-z][a-z0-9_]*$
                      type: string
                    parameters:
                      description: |-
                        Parameters is the JSON Schema for HTTP tool parameters. When set, its
                        root must declare type "object".
                      x-kubernetes-preserve-unknown-fields: true
                    source:
                      description: |-
                        Source is Builtin for an existing Orka tool or HTTP for a curated
                        definition carried in this provider.
                      enum:
                      - Builtin
                      - HTTP
                      type: string
                  required:
                  - class
                  - name
                  - source
                  type: object
                  x-kubernetes-validations:
                  - message: HTTP tools require http
                    rule: self.source != 'HTTP' || has(self.http)
                  - message: Builtin tools must not set http or description
                    rule: self.source != 'Builtin' || (!has(self.http) && !has(self.description))
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - oauth
            - tools
            type: object
          status:
            description: ConnectorProviderStatus contains only safe validation state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must be at most 63 characters: it labels every Connection'
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
