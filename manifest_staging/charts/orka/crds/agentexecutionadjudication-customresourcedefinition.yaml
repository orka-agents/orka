---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: agentexecutionadjudications.core.orka.ai
spec:
  group: core.orka.ai
  names:
    kind: AgentExecutionAdjudication
    listKind: AgentExecutionAdjudicationList
    plural: agentexecutionadjudications
    shortNames:
    - aexadj
    singular: agentexecutionadjudication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.taskRef.name
      name: Task
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentExecutionAdjudication is the namespaced, admin-authored, fail-closed
          resolution record for quarantined Tasks and blocked Sessions.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentExecutionAdjudicationSpec is the immutable, admin-authored resolution
              request. Original quarantine and blocked-state evidence is never edited;
              resolution is represented by this separate record plus an immutable
              subject-side resolution reference.
            properties:
              action:
                description: |-
                  AgentExecutionAdjudicationAction is a one-way operator resolution. Actions
                  never authorize prompt replay, publication replay, or protocol mutation.
                  The coexistence API currently admits only cleanup actions whose exact
                  Applied resolution can be consumed by route-aware finalization. The other
                  constants below are reserved until their required receipt, break-glass, or
                  destination-lineage evidence is represented by the API.
                enum:
                - CleanupV1
                - CleanupV2
                - CleanupBoth
                type: string
              blockedStateDigest:
                description: BlockedStateDigest matches the blocked Session state
                  being resolved.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              evidenceDigests:
                description: EvidenceDigests reference independently verified receipts
                  and evidence.
                items:
                  pattern: ^sha256:[a-f0-9]{64}$
                  type: string
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              expectedState:
                description: |-
                  AgentExecutionExpectedSubjectState fences adjudication application to the
                  exact observed subject and evidence closure.
                properties:
                  evidenceClosureWatermark:
                    description: |-
                      EvidenceClosureWatermark digests the complete evidence set observed for
                      the subject. Newly discovered evidence supersedes the adjudication.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  subjectDomainVersion:
                    description: |-
                      SubjectDomainVersion is the durable-store domain version of the subject,
                      when one exists.
                    format: int64
                    minimum: 0
                    type: integer
                  subjectResourceVersion:
                    description: |-
                      SubjectResourceVersion is the subject resourceVersion the requester
                      observed when creating the adjudication.
                    minLength: 1
                    type: string
                required:
                - evidenceClosureWatermark
                - subjectResourceVersion
                type: object
              expiresAt:
                description: ExpiresAt bounds how long an unapplied adjudication stays
                  actionable.
                format: date-time
                type: string
              justification:
                maxLength: 4096
                minLength: 1
                type: string
              quarantineDigest:
                description: QuarantineDigest matches the immutable quarantine record
                  being resolved.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              requestedBy:
                description: |-
                  RequestedBy is the verified requester identity. Admission rejects a value
                  that does not match the authenticated caller.
                maxLength: 512
                minLength: 1
                type: string
              sessionRef:
                description: AgentExecutionSubjectReference identifies an exact adjudication
                  subject.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - name
                - uid
                type: object
              taskRef:
                description: AgentExecutionSubjectReference identifies an exact adjudication
                  subject.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  uid:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                required:
                - name
                - uid
                type: object
            required:
            - action
            - evidenceDigests
            - expectedState
            - justification
            - requestedBy
            - taskRef
            type: object
            x-kubernetes-validations:
            - message: adjudication spec is immutable
              rule: self == oldSelf
            - message: adjudication requires quarantine or blocked-state evidence
                digests
              rule: has(self.quarantineDigest) || has(self.blockedStateDigest)
          status:
            description: |-
              AgentExecutionAdjudicationStatus is the controller-owned, idempotent
              application record.
            properties:
              message:
                description: Message explains Rejected or Superseded outcomes.
                maxLength: 1024
                type: string
              observedAt:
                format: date-time
                type: string
              operationDigest:
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              operationId:
                description: OperationID identifies the exactly-once controller application
                  operation.
                maxLength: 253
                type: string
              resolutionRefDigest:
                description: |-
                  ResolutionRefDigest matches the immutable subject-side resolution
                  reference appended by application.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              resultingSubjectResourceVersion:
                description: |-
                  ResultingSubjectResourceVersion is the subject resourceVersion produced
                  by applying the decision.
                type: string
              state:
                description: AgentExecutionAdjudicationState is the controller-owned
                  application state.
                enum:
                - Pending
                - Applying
                - Applied
                - Rejected
                - Superseded
                type: string
            type: object
            x-kubernetes-validations:
            - message: terminal adjudication state is immutable
              rule: '!has(oldSelf.state) || !(oldSelf.state in [''Applied'',''Rejected'',''Superseded''])
                || (has(self.state) && self.state == oldSelf.state)'
            - message: operationId is immutable once recorded
              rule: '!has(oldSelf.operationId) || (has(self.operationId) && self.operationId
                == oldSelf.operationId)'
            - message: operationDigest is immutable once recorded
              rule: '!has(oldSelf.operationDigest) || (has(self.operationDigest) &&
                self.operationDigest == oldSelf.operationDigest)'
            - message: resolutionRefDigest is immutable once recorded
              rule: '!has(oldSelf.resolutionRefDigest) || (has(self.resolutionRefDigest)
                && self.resolutionRefDigest == oldSelf.resolutionRefDigest)'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
