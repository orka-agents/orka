---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: promptattempts.core.orka.ai
spec:
  group: core.orka.ai
  names:
    kind: PromptAttempt
    listKind: PromptAttemptList
    plural: promptattempts
    shortNames:
    - pattempt
    singular: promptattempt
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.executionState
      name: Execution
      type: string
    - jsonPath: .status.deliveryState
      name: Delivery
      type: string
    - jsonPath: .spec.attempt
      name: Attempt
      type: integer
    - jsonPath: .status.version
      name: Version
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PromptAttempt is the Kubernetes-authoritative prompt execution and delivery
          control record.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PromptAttemptSpec is the immutable identity and request binding for one
              Task prompt attempt.
            properties:
              attempt:
                description: Attempt is the one-based Task attempt number.
                format: int64
                minimum: 1
                type: integer
              bindingDigest:
                description: |-
                  BindingDigest identifies the immutable Task-lifetime v2 execution
                  binding. It is optional only so pre-coexistence records remain readable;
                  all PromptAttempts newly created through DurableControlStore require it.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              credentialBindings:
                description: CredentialBindings is the immutable, role-separated Secret
                  identity set.
                items:
                  description: |-
                    PromptCredentialBinding freezes one role-specific Secret identity without
                    storing credential material.
                  properties:
                    namespace:
                      maxLength: 253
                      minLength: 1
                      type: string
                    resourceVersion:
                      maxLength: 253
                      minLength: 1
                      type: string
                    role:
                      enum:
                      - SourceRead
                      - TargetRead
                      - TargetWrite
                      - Forge
                      type: string
                    secretKey:
                      maxLength: 253
                      minLength: 1
                      type: string
                    secretName:
                      maxLength: 253
                      minLength: 1
                      type: string
                    secretUid:
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - namespace
                  - resourceVersion
                  - role
                  - secretKey
                  - secretName
                  - secretUid
                  type: object
                maxItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - role
                x-kubernetes-list-type: map
              id:
                description: ID is the canonical DurableControlStore prompt-attempt
                  ID.
                maxLength: 1024
                minLength: 1
                type: string
              promptId:
                description: PromptID is the immutable prompt identity within the
                  attempt.
                maxLength: 1024
                minLength: 1
                type: string
              requestDigest:
                description: RequestDigest binds the prompt identity to exact canonical
                  input.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              snapshotDigest:
                description: |-
                  SnapshotDigest identifies the immutable encrypted execution snapshot.
                  It is optional only so pre-coexistence records remain readable; all
                  PromptAttempts newly created through DurableControlStore require it.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              taskUid:
                description: TaskUID is the immutable Kubernetes UID of the Task.
                maxLength: 1024
                minLength: 1
                type: string
            required:
            - attempt
            - id
            - promptId
            - requestDigest
            - taskUid
            type: object
            x-kubernetes-validations:
            - message: prompt attempt spec is immutable
              rule: self == oldSelf
            - message: bindingDigest and snapshotDigest must be recorded together
              rule: has(self.bindingDigest) == has(self.snapshotDigest)
          status:
            description: PromptAttemptStatus holds the exact execution and delivery
              state machines.
            properties:
              controllerEpoch:
                description: ControllerEpoch is the exact epoch that performed the
                  last mutation.
                format: int64
                minimum: 1
                type: integer
              controllerEpochLeaseResourceVersion:
                description: |-
                  ControllerEpochLeaseResourceVersion is the resourceVersion of the
                  authoritative controller-epoch Lease observed by the mutation.
                maxLength: 64
                type: string
              controllerEpochName:
                description: |-
                  ControllerEpochName identifies the controller epoch domain checked before
                  the mutation.
                maxLength: 253
                type: string
              createdAt:
                description: CreatedAt is the normalized logical creation time.
                format: date-time
                type: string
              deliveryState:
                description: PromptAttemptDeliveryState is the durable delivery state
                  for one prompt.
                enum:
                - NotRequested
                - Validating
                - Preparing
                - Prepared
                - Publishing
                - Verifying
                - VerifiedExact
                - DeliveredSuperseded
                - ReadValidated
                - NoChange
                - CancelledBeforePublish
                - ReadOnlyWorkspaceModified
                - DeliveryConflict
                - CredentialBlocked
                - PublicationOutcomeUnknown
                type: string
              executionState:
                description: PromptAttemptExecutionState is the durable prompt execution
                  state.
                enum:
                - Queued
                - Reserved
                - SessionStarting
                - Planned
                - Submitting
                - SubmittedUnknown
                - Accepted
                - Running
                - Settling
                - Succeeded
                - Failed
                - Cancelled
                - OutcomeUnknown
                type: string
              lastOperationDigest:
                description: LastOperationDigest binds LastOperationID to exact canonical
                  input.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              lastOperationId:
                description: LastOperationID is the last idempotent mutation identity
                  applied.
                maxLength: 1024
                type: string
              outcomeMarker:
                maxLength: 16384
                type: string
              runtimeInstanceId:
                description: RuntimeInstanceID is immutable after first binding.
                maxLength: 1024
                type: string
              sessionLeaseGeneration:
                description: SessionLeaseGeneration is immutable after first binding.
                format: int64
                minimum: 1
                type: integer
              sessionUid:
                description: SessionUID is immutable after first binding.
                maxLength: 1024
                type: string
              terminalReason:
                maxLength: 16384
                type: string
              updatedAt:
                description: UpdatedAt is the normalized logical mutation time.
                format: date-time
                type: string
              version:
                description: |-
                  Version is the monotonic domain CAS version. It advances once for each
                  successfully persisted logical mutation.
                format: int64
                minimum: 1
                type: integer
            type: object
            x-kubernetes-validations:
            - message: OutcomeUnknown requires an explicit outcome marker
              rule: '!has(self.executionState) || self.executionState != ''OutcomeUnknown''
                || (has(self.outcomeMarker) && size(self.outcomeMarker) > 0)'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
