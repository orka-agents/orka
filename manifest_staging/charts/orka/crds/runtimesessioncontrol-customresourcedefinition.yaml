---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: runtimesessioncontrols.core.orka.ai
spec:
  group: core.orka.ai
  names:
    kind: RuntimeSessionControl
    listKind: RuntimeSessionControlList
    plural: runtimesessioncontrols
    shortNames:
    - rsctrl
    singular: runtimesessioncontrol
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.lifecycle
      name: Lifecycle
      type: string
    - jsonPath: .status.availability
      name: Availability
      type: string
    - jsonPath: .status.generation
      name: Generation
      type: integer
    - jsonPath: .status.mutationLeaseGeneration
      name: Lease
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RuntimeSessionControl is the Kubernetes-authoritative RuntimeSession control
          record. SessionTurn/transcript/deferred-outbox data remains in one durable
          SQLite transaction; the Kubernetes store completes the authoritative
          SessionControl/BranchClaim CAS before activating the terminal projection.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RuntimeSessionControlSpec contains immutable session identity, ownership, and
              profile bindings. Profile changes create a new session generation in status;
              they do not mutate this immutable record identity.
            properties:
              owner:
                description: Owner identifies the immutable Task or durable Session
                  owner.
                properties:
                  kind:
                    enum:
                    - Task
                    - Session
                    - RuntimePool
                    - PromptAttempt
                    type: string
                  uid:
                    maxLength: 1024
                    minLength: 1
                    type: string
                required:
                - kind
                - uid
                type: object
              profileDigestSchemaVersion:
                description: ProfileDigestSchemaVersion identifies how RuntimeProfileDigest
                  was built.
                maxLength: 64
                type: string
              requestDigest:
                description: RequestDigest binds creation to exact canonical input.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              runtimePoolRef:
                description: RuntimePoolRef is the controller-owned logical pool name
                  when known.
                maxLength: 253
                type: string
              runtimePoolUid:
                description: RuntimePoolUID fences the pool object across delete/recreate.
                maxLength: 1024
                type: string
              runtimeProfileDigest:
                description: RuntimeProfileDigest binds the session to immutable runtime
                  behavior.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              sessionName:
                description: |-
                  SessionName is the immutable user-visible Session key within the object
                  namespace. The Kubernetes object name is a digest-derived storage key and
                  must not be treated as the Session name.
                maxLength: 1024
                minLength: 1
                type: string
              sessionUid:
                description: SessionUID is the immutable Orka Session identity.
                maxLength: 1024
                minLength: 1
                type: string
            required:
            - owner
            - requestDigest
            - sessionName
            - sessionUid
            type: object
            x-kubernetes-validations:
            - message: runtime session control spec is immutable
              rule: self == oldSelf
          status:
            description: |-
              RuntimeSessionControlStatus contains the lifecycle, generation, mutation
              Lease, and independently verified recovery baseline.
            properties:
              agentExecutionResolutionRef:
                description: |-
                  AgentExecutionResolutionRef is the immutable reference to an Applied
                  adjudication that authorizes a one-way resolution of blocked Session
                  state. It never changes the recorded lineage.
                properties:
                  action:
                    description: |-
                      AgentExecutionAdjudicationAction is a one-way operator resolution. Actions
                      never authorize prompt replay, publication replay, or protocol mutation.
                      The coexistence API currently admits only cleanup actions whose exact
                      Applied resolution can be consumed by route-aware finalization. The other
                      constants below are reserved until their required receipt, break-glass, or
                      destination-lineage evidence is represented by the API.
                    enum:
                    - CleanupV1
                    - CleanupV2
                    - CleanupBoth
                    type: string
                  adjudicationName:
                    maxLength: 253
                    minLength: 1
                    type: string
                  adjudicationUID:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                  appliedAt:
                    format: date-time
                    type: string
                  operationDigest:
                    description: OperationDigest matches the applying adjudication's
                      status.operationDigest.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  resolutionDigest:
                    description: |-
                      ResolutionDigest is the canonical digest of this resolution reference and
                      matches the adjudication's status.resolutionRefDigest.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                required:
                - action
                - adjudicationName
                - adjudicationUID
                - appliedAt
                - operationDigest
                - resolutionDigest
                type: object
              availability:
                description: RuntimeSessionControlAvailability gates the Session mutation
                  lease.
                enum:
                - Available
                - ReconciliationBlocked
                type: string
              blockedReason:
                maxLength: 16384
                type: string
              controllerEpoch:
                description: ControllerEpoch is the exact epoch that performed the
                  last mutation.
                format: int64
                minimum: 1
                type: integer
              controllerEpochLeaseResourceVersion:
                description: |-
                  ControllerEpochLeaseResourceVersion is the resourceVersion of the
                  authoritative controller-epoch Lease observed by the mutation.
                maxLength: 64
                type: string
              controllerEpochName:
                description: |-
                  ControllerEpochName identifies the controller epoch domain checked before
                  the mutation.
                maxLength: 253
                type: string
              createdAt:
                description: CreatedAt is the normalized logical creation time.
                format: date-time
                type: string
              generation:
                description: Generation is the monotonic ACP RuntimeSession generation.
                format: int64
                minimum: 1
                type: integer
              lastOperationDigest:
                description: LastOperationDigest binds LastOperationID to exact canonical
                  input.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              lastOperationId:
                description: LastOperationID is the last idempotent mutation identity
                  applied.
                maxLength: 1024
                type: string
              lifecycle:
                description: RuntimeSessionControlLifecycle is the durable RuntimeSession
                  lifecycle.
                enum:
                - Creating
                - Idle
                - PromptRunning
                - Validating
                - PreparingPublication
                - PublicationPrepared
                - Publishing
                - Verifying
                - Finalizing
                - Cancelling
                - Poisoned
                - Deleting
                - Deleted
                type: string
              lineage:
                description: |-
                  Lineage is established or verified in the same RuntimeSessionControl
                  status CAS that mirrors the authoritative mutation Lease.
                properties:
                  configDigest:
                    description: |-
                      ConfigDigest freezes the configuration/execution-snapshot identity used
                      when the lineage was established.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  contractVersion:
                    description: |-
                      AgentRuntimeContractVersion identifies the Orka-facing runtime contract.
                      During harness coexistence both protocol values are schema-valid; omission is
                      never protocol evidence and is tolerated only for stored objects awaiting the
                      one-time bridge classification.
                    enum:
                    - orka.harness.v1
                    - orka.harness.v2
                    type: string
                  establishedAt:
                    format: date-time
                    type: string
                  generation:
                    format: int64
                    minimum: 1
                    type: integer
                  namespaceUID:
                    description: |-
                      NamespaceUID prevents a same-name recreated namespace from attaching to
                      durable state owned by the previous namespace identity.
                    type: string
                  provenance:
                    description: |-
                      RuntimeSessionLineageProvenance records how the immutable Session runtime
                      lineage was established.
                    enum:
                    - first-use
                    - legacy-adopted
                    - transcript-bootstrap
                    type: string
                  runtimeIdentity:
                    description: RuntimeIdentity is the built-in runtime type or AgentRuntime
                      UID.
                    maxLength: 1024
                    minLength: 1
                    type: string
                  sessionUid:
                    description: SessionUID repeats the immutable control identity
                      at the lineage fence.
                    maxLength: 1024
                    minLength: 1
                    type: string
                required:
                - configDigest
                - contractVersion
                - establishedAt
                - generation
                - namespaceUID
                - provenance
                - runtimeIdentity
                - sessionUid
                type: object
              mutationLease:
                description: |-
                  RuntimeSessionMutationLeaseStatus mirrors the namespaced Kubernetes Lease
                  that serializes mutation for one immutable SessionUID.
                properties:
                  acquiredAt:
                    format: date-time
                    type: string
                  attempt:
                    format: int64
                    minimum: 1
                    type: integer
                  expiresAt:
                    format: date-time
                    type: string
                  generation:
                    format: int64
                    minimum: 1
                    type: integer
                  leaseName:
                    maxLength: 253
                    minLength: 1
                    type: string
                  leaseResourceVersion:
                    maxLength: 64
                    minLength: 1
                    type: string
                  promptId:
                    maxLength: 1024
                    minLength: 1
                    type: string
                  requestDigest:
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  taskUid:
                    maxLength: 1024
                    minLength: 1
                    type: string
                required:
                - acquiredAt
                - attempt
                - generation
                - leaseName
                - leaseResourceVersion
                - promptId
                - requestDigest
                - taskUid
                type: object
              mutationLeaseGeneration:
                description: MutationLeaseGeneration is monotonic and never reused
                  for SessionUID.
                format: int64
                minimum: 0
                type: integer
              relatedPromptAttemptId:
                maxLength: 1024
                type: string
              relatedPublicationId:
                maxLength: 1024
                type: string
              updatedAt:
                description: UpdatedAt is the normalized logical mutation time.
                format: date-time
                type: string
              verifiedBaseline:
                description: ControlVerifiedBranchBaseline is an independently verified
                  branch baseline.
                properties:
                  ref:
                    maxLength: 1024
                    pattern: ^refs/heads/.+$
                    type: string
                  repositoryId:
                    maxLength: 1024
                    minLength: 1
                    type: string
                  sha:
                    pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                    type: string
                required:
                - ref
                - repositoryId
                - sha
                type: object
              version:
                description: |-
                  Version is the monotonic domain CAS version. It advances once for each
                  successfully persisted logical mutation.
                format: int64
                minimum: 1
                type: integer
            type: object
            x-kubernetes-validations:
            - message: available sessions must clear reconciliation block metadata
              rule: '!has(self.availability) || self.availability != ''Available''
                || ((!has(self.blockedReason) || size(self.blockedReason) == 0) &&
                (!has(self.relatedPromptAttemptId) || size(self.relatedPromptAttemptId)
                == 0) && (!has(self.relatedPublicationId) || size(self.relatedPublicationId)
                == 0))'
            - message: reconciliation-blocked sessions require a reason
              rule: '!has(self.availability) || self.availability != ''ReconciliationBlocked''
                || (has(self.blockedReason) && size(self.blockedReason) > 0)'
            - message: runtime Session lineage is append-once and immutable
              rule: '!has(oldSelf.lineage) || (has(self.lineage) && self.lineage ==
                oldSelf.lineage)'
            - message: agentExecutionResolutionRef is append-once and immutable
              rule: '!has(oldSelf.agentExecutionResolutionRef) || (has(self.agentExecutionResolutionRef)
                && self.agentExecutionResolutionRef == oldSelf.agentExecutionResolutionRef)'
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: runtime Session lineage UID must match the immutable control Session
            UID
          rule: '!has(self.status) || !has(self.status.lineage) || self.status.lineage.sessionUid
            == self.spec.sessionUid'
    served: true
    storage: true
    subresources:
      status: {}
