---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: agentexecutioncontrols.core.orka.ai
spec:
  group: core.orka.ai
  names:
    kind: AgentExecutionControl
    listKind: AgentExecutionControlList
    plural: agentexecutioncontrols
    shortNames:
    - aexctl
    singular: agentexecutioncontrol
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.backends.v1.effectiveMode
      name: V1
      type: string
    - jsonPath: .status.backends.v2.effectiveMode
      name: V2
      type: string
    - jsonPath: .status.ownership.controllerEpoch
      name: Epoch
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentExecutionControl is the durable, revisioned backend admission control
          object. Recreating it is not a normal mode transition: a UID change forces
          cleanup-only behavior until operator reconciliation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentExecutionControlSpec is the admin-owned desired backend
              admission state.
            properties:
              backends:
                description: AgentExecutionBackendsSpec holds the desired mode for
                  both harness backends.
                properties:
                  v1:
                    description: AgentExecutionBackendSpec is the desired admission
                      mode for one backend.
                    properties:
                      desiredMode:
                        description: |-
                          DesiredMode requests an admission mode. The controller reaches drain-only
                          from enabled only through the internal closing barrier with closure proof.
                        enum:
                        - enabled
                        - drain-only
                        - disabled
                        type: string
                    required:
                    - desiredMode
                    type: object
                  v2:
                    description: AgentExecutionBackendSpec is the desired admission
                      mode for one backend.
                    properties:
                      desiredMode:
                        description: |-
                          DesiredMode requests an admission mode. The controller reaches drain-only
                          from enabled only through the internal closing barrier with closure proof.
                        enum:
                        - enabled
                        - drain-only
                        - disabled
                        type: string
                    required:
                    - desiredMode
                    type: object
                required:
                - v1
                - v2
                type: object
            required:
            - backends
            type: object
          status:
            description: |-
              AgentExecutionControlStatus is the controller-owned observed admission and
              ownership state.
            properties:
              backends:
                description: AgentExecutionBackendsStatus holds observed state for
                  both backends.
                properties:
                  v1:
                    description: |-
                      AgentExecutionBackendStatus is the controller-observed mode for one backend.
                      The control UID, generation, and modeRevision form the admission revision.
                    properties:
                      admissionClosedAt:
                        description: AdmissionClosedAt records the proven admission
                          cutoff.
                        format: date-time
                        type: string
                      cutoffInventoryDigest:
                        description: |-
                          CutoffInventoryDigest is the digest of the sealed cutoff inventory
                          recorded when the closing barrier completed.
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      effectiveMode:
                        description: |-
                          AgentExecutionEffectiveMode is the controller-observed admission mode,
                          including the serialized closing barrier between enabled and drain-only.
                        enum:
                        - enabled
                        - closing
                        - drain-only
                        - disabled
                        type: string
                      modeRevision:
                        description: ModeRevision increases on every effective mode
                          transition.
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - effectiveMode
                    - modeRevision
                    type: object
                    x-kubernetes-validations:
                    - message: modeRevision must not decrease
                      rule: self.modeRevision >= oldSelf.modeRevision
                    - message: admissionClosedAt requires a drain-only or disabled
                        effective mode
                      rule: '!has(self.admissionClosedAt) || self.effectiveMode ==
                        ''drain-only'' || self.effectiveMode == ''disabled'''
                  v2:
                    description: |-
                      AgentExecutionBackendStatus is the controller-observed mode for one backend.
                      The control UID, generation, and modeRevision form the admission revision.
                    properties:
                      admissionClosedAt:
                        description: AdmissionClosedAt records the proven admission
                          cutoff.
                        format: date-time
                        type: string
                      cutoffInventoryDigest:
                        description: |-
                          CutoffInventoryDigest is the digest of the sealed cutoff inventory
                          recorded when the closing barrier completed.
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      effectiveMode:
                        description: |-
                          AgentExecutionEffectiveMode is the controller-observed admission mode,
                          including the serialized closing barrier between enabled and drain-only.
                        enum:
                        - enabled
                        - closing
                        - drain-only
                        - disabled
                        type: string
                      modeRevision:
                        description: ModeRevision increases on every effective mode
                          transition.
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - effectiveMode
                    - modeRevision
                    type: object
                    x-kubernetes-validations:
                    - message: modeRevision must not decrease
                      rule: self.modeRevision >= oldSelf.modeRevision
                    - message: admissionClosedAt requires a drain-only or disabled
                        effective mode
                      rule: '!has(self.admissionClosedAt) || self.effectiveMode ==
                        ''drain-only'' || self.effectiveMode == ''disabled'''
                required:
                - v1
                - v2
                type: object
              classification:
                description: |-
                  Classification is the controller-owned, source-aware sealed inventory
                  marker. Binding and every execution/mutating runnable must verify an exact
                  Sealed marker through an uncached read; readiness alone is not authority.
                properties:
                  controlGeneration:
                    format: int64
                    minimum: 1
                    type: integer
                  controlUID:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                  inventoryDigest:
                    description: |-
                      InventoryDigest commits to the exact source identities, resource
                      versions, evidence, and resulting dispositions observed by the sweep.
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  inventoryID:
                    description: |-
                      InventoryID identifies the bounded sealed migration sweep that wrote
                      legacy Task dispositions and Session lineage.
                    maxLength: 253
                    minLength: 1
                    type: string
                  observedAt:
                    description: |-
                      ObservedAt is the first observation time for an Open digest and the seal
                      time for a Sealed digest.
                    format: date-time
                    type: string
                  state:
                    description: |-
                      AgentExecutionClassificationState is the controller-owned migration
                      inventory state. Execution remains closed while the inventory is Open.
                    enum:
                    - Open
                    - Sealed
                    type: string
                required:
                - controlGeneration
                - controlUID
                - inventoryDigest
                - inventoryID
                - observedAt
                - state
                type: object
              observedGeneration:
                format: int64
                type: integer
              ownership:
                description: |-
                  AgentExecutionOwnershipStatus records the complete controller ownership
                  fence set. Loss of any member closes readiness and stops mutating runnables.
                properties:
                  controllerEpoch:
                    description: ControllerEpoch is the monotonic fenced ownership
                      epoch.
                    format: int64
                    minimum: 0
                    type: integer
                  leaseName:
                    minLength: 1
                    type: string
                  leaseNamespace:
                    minLength: 1
                    type: string
                  leaseUID:
                    description: |-
                      UID is a type that holds unique ID values, including UUIDs.  Because we
                      don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                      intent and helps make sure that UIDs and names do not get conflated.
                    type: string
                  legacyLeaseFences:
                    description: LegacyLeaseFences lists every fenced legacy controller
                      Lease.
                    items:
                      description: |-
                        AgentExecutionLegacyLeaseFence records one continuously renewed legacy
                        leader-election Lease held as a migration fence.
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          maxLength: 253
                          minLength: 1
                          type: string
                        resourceVersion:
                          minLength: 1
                          type: string
                        uid:
                          description: |-
                            UID is a type that holds unique ID values, including UUIDs.  Because we
                            don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                            intent and helps make sure that UIDs and names do not get conflated.
                          type: string
                      required:
                      - name
                      - namespace
                      - resourceVersion
                      - uid
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - controllerEpoch
                - leaseName
                - leaseNamespace
                - leaseUID
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: AgentExecutionControl is a singleton named cluster
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}
