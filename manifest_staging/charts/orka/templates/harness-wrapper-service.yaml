{{- include "orka.validateHarnessV1" . }}
{{- if eq .Values.controller.mode "harness-v1" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orka.harnessV1Name" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper
spec:
  selector:
    {{- include "orka.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper
  ports:
    - name: https
      port: 8080
      targetPort: https
      protocol: TCP
{{- end }}
