{{- include "orka.validateProviderProxyConfig" . }}
{{- if and (eq .Values.controller.mode "harness-v2") .Values.providerProxy.enabled }}
{{- $secretName := .Values.providerProxy.auth.existingSecret | default (include "orka.providerProxyName" .) }}
{{- $currentKey := .Values.providerProxy.auth.tokenKey | default "token" }}
{{- $previousKey := .Values.providerProxy.auth.previousTokenKey | default "previous-token" }}
{{- $previousValidUntilKey := .Values.providerProxy.auth.previousTokenValidUntilKey | default "previous-token-valid-until" }}
{{- if or (eq $currentKey $previousKey) (eq $currentKey $previousValidUntilKey) (eq $previousKey $previousValidUntilKey) }}
{{- fail "providerProxy auth token keys must differ" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orka.providerProxyName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-auth-proxy
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: provider-auth-proxy
  template:
    metadata:
      {{- with .Values.providerProxy.rolloutNonce }}
      annotations:
        orka.ai/provider-auth-rollout-nonce: {{ . | quote }}
      {{- end }}
      labels:
        {{- include "orka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: provider-auth-proxy
        orka.ai/network-role: provider-auth-proxy
    spec:
      serviceAccountName: {{ include "orka.providerProxyName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: {{ include "orka.imageRef" .Values.controller.image | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command: [/provider-auth-proxy]
          args:
            - --listen-address=:8080
            - {{ printf "--upstream-base-url=%s" (include "orka.providerProxyUpstreamBaseURL" .) | quote }}
            - --token-file=/var/run/secrets/orka/provider-auth/token
            - --previous-token-file=/var/run/secrets/orka/provider-auth/previous-token
            - --previous-token-valid-until-file=/var/run/secrets/orka/provider-auth/previous-token-valid-until
            - {{ printf "--token-reload-interval=%s" (.Values.providerProxy.tokenReloadInterval | default "5s") | quote }}
            - {{ printf "--previous-token-overlap=%s" (.Values.providerProxy.previousTokenOverlap | default "10m") | quote }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.providerProxy.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          volumeMounts:
            - {name: provider-auth, mountPath: /var/run/secrets/orka/provider-auth, readOnly: true}
      volumes:
        - name: provider-auth
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ $secretName }}
                  optional: true
                  items:
                    - key: {{ $currentKey }}
                      path: token
                    - key: {{ $previousKey }}
                      path: previous-token
                    - key: {{ $previousValidUntilKey }}
                      path: previous-token-valid-until
{{- end }}
