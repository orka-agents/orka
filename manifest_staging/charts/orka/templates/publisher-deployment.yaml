{{- if and (eq .Values.controller.mode "harness-v2") .Values.publisher.enabled (not .Values.scmEgressProxy.enabled) }}
{{- fail "publisher.enabled requires scmEgressProxy.enabled so public HTTPS egress remains proxy-only" }}
{{- end }}
{{- if and (eq .Values.controller.mode "harness-v2") .Values.publisher.enabled }}
{{- $scmProxySecretName := .Values.scmEgressProxy.auth.existingSecret | default (include "orka.scmEgressProxyAuthSecretName" .) }}
{{- $scmProxyTokenKey := .Values.scmEgressProxy.auth.tokenKey | default "token" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orka.publisherName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: workspace-publisher
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: workspace-publisher
  template:
    metadata:
      {{- if or .Values.publisher.auth.rolloutNonce .Values.scmEgressProxy.auth.rolloutNonce }}
      annotations:
        {{- with .Values.publisher.auth.rolloutNonce }}
        orka.ai/publisher-auth-rollout-nonce: {{ . | quote }}
        {{- end }}
        {{- with .Values.scmEgressProxy.auth.rolloutNonce }}
        orka.ai/scm-egress-proxy-auth-rollout-nonce: {{ . | quote }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "orka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: workspace-publisher
        orka.ai/network-role: workspace-publisher
    spec:
      serviceAccountName: {{ include "orka.publisherServiceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: publisher
          image: {{ include "orka.imageRef" .Values.publisher.image | quote }}
          imagePullPolicy: {{ .Values.publisher.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: ORKA_SCM_EGRESS_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $scmProxySecretName }}
                  key: {{ $scmProxyTokenKey }}
            - name: HTTPS_PROXY
              value: {{ printf "http://orka-publisher:$(ORKA_SCM_EGRESS_PROXY_TOKEN)@%s.%s.svc:%v" (include "orka.scmEgressProxyName" .) .Release.Namespace 8080 | quote }}
            - name: https_proxy
              value: {{ printf "http://orka-publisher:$(ORKA_SCM_EGRESS_PROXY_TOKEN)@%s.%s.svc:%v" (include "orka.scmEgressProxyName" .) .Release.Namespace 8080 | quote }}
            - {name: NO_PROXY, value: {{ .Values.scmEgressProxy.noProxy | quote }}}
            - {name: no_proxy, value: {{ .Values.scmEgressProxy.noProxy | quote }}}
            - {name: ORKA_PUBLISHER_SCM_EGRESS_PROXY_REQUIRED, value: "true"}
            - {name: ORKA_PUBLISHER_LISTEN_ADDRESS, value: ":8080"}
            - {name: ORKA_PUBLISHER_TEMP_ROOT, value: /tmp/orka-workspace-publisher/runtime}
            - {name: ORKA_PUBLISHER_CONTROLLER_TOKEN_FILE, value: /var/run/orka/publisher-auth/controller-token}
            - {name: ORKA_PUBLISHER_OPERATION_CAPABILITY_SECRET_FILE, value: /var/run/orka/publisher-auth/operation-capability-secret}
            - name: ORKA_PUBLISHER_ARTIFACT_AUTHORIZATION_BROKER_URL
              value: http://{{ include "orka.fullname" . }}:{{ .Values.service.port }}
            - name: ORKA_PUBLISHER_ARTIFACT_API_URL
              value: http://{{ include "orka.fullname" . }}:{{ .Values.service.port }}
            - name: ORKA_PUBLISHER_CREDENTIAL_BROKER_URL
              value: http://{{ include "orka.fullname" . }}:{{ .Values.service.port }}
            - {name: ORKA_PUBLISHER_ALLOWED_SCM_HOSTS, value: {{ .Values.publisher.allowedSCMHosts | quote }}}
            - {name: ORKA_PUBLISHER_GITHUB_PR_ENABLED, value: {{ .Values.publisher.githubPR.enabled | quote }}}
            {{- if .Values.publisher.githubPR.enabled }}
            - {name: ORKA_PUBLISHER_GITHUB_API_BASE_URL, value: {{ .Values.publisher.githubPR.apiBaseURL | quote }}}
            - {name: ORKA_PUBLISHER_GITHUB_REQUEST_TIMEOUT, value: {{ .Values.publisher.githubPR.requestTimeout | quote }}}
            - {name: ORKA_PUBLISHER_GITHUB_MAX_RESPONSE_BYTES, value: {{ .Values.publisher.githubPR.maxResponseBytes | quote }}}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.publisher.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp/orka-workspace-publisher}
            - {name: publisher-auth, mountPath: /var/run/orka/publisher-auth/controller-token, subPath: controller-token, readOnly: true}
            - {name: publisher-auth, mountPath: /var/run/orka/publisher-auth/operation-capability-secret, subPath: operation-capability-secret, readOnly: true}
          readinessProbe:
            httpGet: {path: /v1/health, port: http}
          livenessProbe:
            httpGet: {path: /v1/health, port: http}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "orka.publisherName" . }}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: publisher-auth
          secret:
            secretName: {{ .Values.publisher.auth.existingSecret | default (include "orka.publisherAuthSecretName" .) }}
            # subPath bind mounts expose regular files to the fail-closed
            # publisher loader; fsGroup grants only the Pod group read access.
            defaultMode: 0440
            items:
              - key: {{ .Values.publisher.auth.controllerTokenKey | default "controller-token" }}
                path: controller-token
              - key: {{ .Values.publisher.auth.capabilitySecretKey | default "operation-capability-secret" }}
                path: operation-capability-secret
{{- end }}
