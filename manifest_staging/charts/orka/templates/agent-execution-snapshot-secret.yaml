{{- if include "orka.agentExecutionSnapshotGenerated" . }}
{{- /*
Release-owned snapshot encryption key. The chart creates the Secret empty and
never renders key material, so Helm release history and dry-run output hold
no secrets. The controller mints 32 random bytes into it only for a new SQLite
dataset that never completed key bootstrap and holds no records, and reuses
them afterwards. A completed or adopted dataset needs its existing key even
after its records are deleted, so if the key is missing the controller fails
closed rather than orphaning retained snapshots. Helm leaves
data it never rendered untouched on upgrade, and the keep policy preserves the
key across helm uninstall so a restored data volume can still be decrypted.
Never use helm upgrade --force on this release: it replaces objects wholesale.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orka.agentExecutionSnapshotSecretName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- end }}
