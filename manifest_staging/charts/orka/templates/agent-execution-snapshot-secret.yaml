{{- if not (trim (default "" .Values.controller.agentExecutionSnapshot.existingSecret)) }}
{{- /*
Release-owned snapshot encryption key. The controller reads the mounted item as
32 raw bytes or their base64 text, so a fresh key is 32 random bytes rendered
as base64 text and then stored as Secret data. An existing Secret's bytes are
reused verbatim; regenerating them would make every retained snapshot
unreadable, so an upgrade that cannot find the Secret fails instead. The keep
policy preserves the key across helm uninstall so a restored data volume can
still be decrypted.
*/ -}}
{{- $name := include "orka.agentExecutionSnapshotSecretName" . }}
{{- $key := include "orka.agentExecutionSnapshotSecretKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if and $existing (hasKey (default dict $existing.data) $key) }}{{- $value = index $existing.data $key }}{{- end }}
{{- if and (not $value) .Release.IsUpgrade }}
{{- fail (printf "generated snapshot Secret %s/%s has no %q item; restore it before upgrading so retained encrypted execution snapshots remain decryptable (offline renders such as --dry-run=client cannot read it; use --dry-run=server)" .Release.Namespace $name $key) }}
{{- end }}
{{- if not $value }}{{- $value = randBytes 32 | b64enc }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value }}
{{- end }}
