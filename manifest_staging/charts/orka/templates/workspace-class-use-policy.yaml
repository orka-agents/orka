apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "orka.fullname" . }}-agenthost-template-use
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["core.orka.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agenthosts"]
  validations:
    # templateRef is immutable, so only creation selects a template.
    - expression: >-
        request.operation != 'CREATE' ||
        authorizer.group('core.orka.ai')
          .resource('agenthosttemplates')
          .namespace(request.namespace)
          .name(object.spec.templateRef.name)
          .check('use').allowed()
      message: caller is not authorized to use the selected AgentHostTemplate
      reason: Forbidden
    # The controller copies the token Secret into the host, so only someone who
    # may read it may name it.
    - expression: >-
        !has(object.spec.githubTokenSecretRef) ||
        (request.operation == 'UPDATE' &&
          has(oldObject.spec.githubTokenSecretRef) &&
          oldObject.spec.githubTokenSecretRef.name == object.spec.githubTokenSecretRef.name &&
          oldObject.spec.githubTokenSecretRef.?key.orValue('token') ==
          object.spec.githubTokenSecretRef.?key.orValue('token')) ||
        authorizer.group('')
          .resource('secrets')
          .namespace(request.namespace)
          .name(object.spec.githubTokenSecretRef.name)
          .check('get').allowed()
      message: caller is not authorized to read the selected GitHub token Secret
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "orka.fullname" . }}-agenthost-template-use
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  policyName: {{ include "orka.fullname" . }}-agenthost-template-use
  validationActions: [Deny]
