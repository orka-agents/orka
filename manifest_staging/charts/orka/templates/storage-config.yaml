{{- if include "orka.storageConfigEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orka.storageConfigName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
data:
  storage.yaml: |
    {{- include "orka.storageConfig" . | nindent 4 }}
{{- end }}
