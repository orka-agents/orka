{{- include "orka.validateAHP" . }}
{{- if include "orka.ahpWorkspacesEnabled" . }}
{{- $namespace := include "orka.ahpWorkspaceNamespace" . }}
# Each AHP user gets one workspace Pod here: git checkouts of their projects
# and sessions, and their terminals. With a workspace connector provider, a
# Pod also holds its person's own GitHub token in /tmp/orka-git/github-token,
# readable by them and by anyone who can exec into the Pod. Its files are
# rebuilt when a Pod starts again, so the namespace is not kept when
# workspaces are turned off or the release is removed.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    app.kubernetes.io/name: {{ include "orka.name" . }}
    app.kubernetes.io/component: ahp-workspace
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    # Workspace Pods run non-root with no capabilities and the RuntimeDefault
    # seccomp profile, so the restricted Pod Security profile applies.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orka.controllerName" . }}-ahp-workspace
  namespace: {{ $namespace }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orka.controllerName" . }}-ahp-workspace
  namespace: {{ $namespace }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orka.controllerName" . }}-ahp-workspace
subjects:
  - kind: ServiceAccount
    name: {{ include "orka.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Workspaces accept no inbound traffic and reach only DNS and HTTPS, which git
# uses to fetch the users' repositories. Enforcement needs a CNI that
# implements NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orka.fullname" . }}-ahp-workspaces
  namespace: {{ $namespace }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ahp-workspace
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - ports: [{protocol: TCP, port: 443}]
{{- end }}
