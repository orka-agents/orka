{{- if dig "agentIdentity" "entra" "tenantID" "" .Values.controller }}
{{- /*
The Entra agent identity blueprint trusts tokens issued to the controller
ServiceAccount (ADR 0039), so nothing else in this namespace may obtain one:
Pods running as it only from the ReplicaSet controller for the controller
Deployment's ReplicaSets and with no later spec change or ephemeral
container, ReplicaSets only from the Deployment controller under the
controller Deployment's name, Deployments only under that name, no other
workload kind, no TokenRequest except the kubelet's, no ServiceAccount token
Secret for it, and no command run in or attach to the controller
Deployment's Pods. The rules match
config/admission/controller_serviceaccount_protection.yaml.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "orka.fullname" . }}-controller-serviceaccount-protection
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["UPDATE"]
      resources: ["pods/ephemeralcontainers"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["replicationcontrollers", "secrets"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["serviceaccounts/token"]
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CONNECT"]
      resources: ["pods/exec", "pods/attach"]
    - apiGroups: ["apps"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  matchConditions:
  - name: controller-namespace
    expression: "request.namespace == '{{ .Release.Namespace }}'"
  - name: service-account-token-secret
    expression: "request.kind.kind != 'Secret' || (has(object.type) && object.type == 'kubernetes.io/service-account-token')"
  variables:
  - name: controllerServiceAccount
    expression: "'{{ include "orka.serviceAccountName" . }}'"
  - name: podSpec
    expression: >-
      request.kind.kind == 'Pod' ? object.spec :
      (request.kind.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)
  # A Pod spec without a ServiceAccount runs as "default".
  - name: runsAsController
    expression: >-
      (has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName != '' ? variables.podSpec.serviceAccountName :
      (has(variables.podSpec.serviceAccount) && variables.podSpec.serviceAccount != '' ? variables.podSpec.serviceAccount : 'default'))
      == variables.controllerServiceAccount
  - name: oldReplicaSetRunsAsController
    expression: >-
      request.operation == 'UPDATE' &&
      (has(oldObject.spec.template.spec.serviceAccountName) && oldObject.spec.template.spec.serviceAccountName != '' ? oldObject.spec.template.spec.serviceAccountName :
      (has(oldObject.spec.template.spec.serviceAccount) && oldObject.spec.template.spec.serviceAccount != '' ? oldObject.spec.template.spec.serviceAccount : 'default'))
      == variables.controllerServiceAccount
  - name: secretNamesController
    expression: >-
      has(object.metadata.annotations) && 'kubernetes.io/service-account.name' in object.metadata.annotations &&
      object.metadata.annotations['kubernetes.io/service-account.name'] == variables.controllerServiceAccount
  - name: oldSecretNamesController
    expression: >-
      request.operation == 'UPDATE' && has(oldObject.type) && oldObject.type == 'kubernetes.io/service-account-token' &&
      has(oldObject.metadata.annotations) && 'kubernetes.io/service-account.name' in oldObject.metadata.annotations &&
      oldObject.metadata.annotations['kubernetes.io/service-account.name'] == variables.controllerServiceAccount
  # A generated Pod name keeps at most 58 characters of its ReplicaSet's
  # name, so a long Deployment name is cut short in its Pods' names.
  - name: controllerPodPrefix
    expression: >-
      '{{ include "orka.controllerName" . }}-'.size() > 58 ? '{{ include "orka.controllerName" . }}-'.substring(0, 58) : '{{ include "orka.controllerName" . }}-'
  # The controller Deployment's ReplicaSets are named after it.
  - name: controllerReplicaSetName
    expression: "object.metadata.name.startsWith('{{ include "orka.controllerName" . }}-')"
  - name: ownedByControllerReplicaSet
    expression: >-
      has(object.metadata.ownerReferences) && object.metadata.ownerReferences.exists(r,
      has(r.controller) && r.controller && r.apiVersion == 'apps/v1' && r.kind == 'ReplicaSet' &&
      r.name.startsWith('{{ include "orka.controllerName" . }}-'))
  validations:
  # The controller Deployment's Pods are created by the ReplicaSet
  # controller, for one of that Deployment's ReplicaSets and under its name,
  # so neither another creator nor another ReplicaSet that runs as the
  # account, such as one left from before this policy, qualifies.
  - expression: >-
      request.kind.kind != 'Pod' || request.operation != 'CREATE' || !variables.runsAsController ||
      (request.userInfo.username in ['system:serviceaccount:kube-system:replicaset-controller', 'system:kube-controller-manager'] &&
      variables.ownedByControllerReplicaSet && object.metadata.name.startsWith(variables.controllerPodPrefix))
    message: only the ReplicaSet controller may create Pods that run as the controller ServiceAccount, and only for the controller Deployment's ReplicaSets
    reason: Forbidden
  # A running controller Pod keeps its spec: no container image swap and no
  # ephemeral container, either of which would run other code with its token.
  # Metadata updates, such as labels or garbage collection, are allowed.
  - expression: >-
      request.kind.kind != 'Pod' || request.operation != 'UPDATE' || !variables.runsAsController ||
      object.spec == oldObject.spec
    message: the spec of a Pod that runs as the controller ServiceAccount cannot change, including its images and ephemeral containers
    reason: Forbidden
  # Its ReplicaSets are the controller Deployment's, created and changed by
  # the Deployment controller. Others may scale one without touching its Pod
  # template. Any other ReplicaSet that already runs as the account takes
  # metadata updates only, such as garbage collection. Its scale subresource
  # is not matched here, but the Pods it would add are refused above.
  - expression: >-
      request.kind.kind != 'ReplicaSet' || !variables.runsAsController ||
      (variables.oldReplicaSetRunsAsController && object.spec == oldObject.spec) ||
      (variables.controllerReplicaSetName &&
      ((variables.oldReplicaSetRunsAsController && object.spec.template == oldObject.spec.template) ||
      request.userInfo.username in ['system:serviceaccount:kube-system:deployment-controller', 'system:kube-controller-manager']))
    message: only the Deployment controller may create ReplicaSets or change Pod templates that run as the controller ServiceAccount, and only for the controller Deployment
    reason: Forbidden
  - expression: >-
      request.kind.kind != 'Deployment' || !variables.runsAsController || object.metadata.name == '{{ include "orka.controllerName" . }}'
    message: only the controller Deployment may run as the controller ServiceAccount
    reason: Forbidden
  - expression: >-
      !(request.kind.kind in ['Job', 'CronJob', 'StatefulSet', 'DaemonSet', 'ReplicationController']) || !variables.runsAsController
    message: no Job, CronJob, StatefulSet, DaemonSet, or ReplicationController may run as the controller ServiceAccount
    reason: Forbidden
  # A token Secret for the account would be populated with a long-lived
  # token anyone who can read the Secret could use, so none may be created.
  # One left from before this policy can only be deleted: the answer to an
  # update carries the token, so only the token controller may write it.
  - expression: >-
      request.kind.kind != 'Secret' ||
      (!variables.secretNamesController && !variables.oldSecretNamesController) ||
      (variables.oldSecretNamesController && request.userInfo.username == 'system:kube-controller-manager')
    message: a ServiceAccount token Secret for the controller ServiceAccount cannot be created or changed; delete it
    reason: Forbidden
  # A command run in a controller Pod could read the token mounted there,
  # and attaching reaches its running process. A Pod cannot be read from an
  # exec or attach request, so the Pod's name decides: every Pod that runs as
  # the account comes from the controller Deployment and carries its name as
  # a prefix.
  - expression: >-
      request.operation != 'CONNECT' || !(request.subResource in ['exec', 'attach']) ||
      !request.name.startsWith(variables.controllerPodPrefix)
    message: commands cannot be run in, or attached to, a Pod of the controller Deployment
    reason: Forbidden
  # The kubelet requests the controller Pod's projected tokens; nothing else
  # may request a token for the account.
  - expression: >-
      request.resource.resource != 'serviceaccounts' || request.subResource != 'token' ||
      request.name != variables.controllerServiceAccount ||
      (has(request.userInfo.groups) && 'system:nodes' in request.userInfo.groups)
    message: only the kubelet may request tokens for the controller ServiceAccount
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "orka.fullname" . }}-controller-serviceaccount-protection
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  policyName: {{ include "orka.fullname" . }}-controller-serviceaccount-protection
  validationActions: [Deny]
{{- end }}
