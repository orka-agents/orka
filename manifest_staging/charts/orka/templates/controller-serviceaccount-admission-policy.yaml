{{- if dig "agentIdentity" "entra" "tenantID" "" .Values.controller }}
{{- /*
The Entra agent identity blueprint trusts tokens issued to the controller
ServiceAccount (ADR 0039). The AI worker can create Jobs in this namespace, so
no Job, CronJob, or Pod here may run as that ServiceAccount except the Pods of
the controller's own Deployment. The rules match
config/admission/controller_serviceaccount_protection.yaml.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "orka.fullname" . }}-controller-serviceaccount-protection
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE"]
      resources: ["pods"]
    - apiGroups: ["batch"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["jobs", "cronjobs"]
  matchConditions:
  - name: controller-namespace
    expression: "request.namespace == '{{ .Release.Namespace }}'"
  variables:
  - name: podSpec
    expression: >-
      request.kind.kind == 'Pod' ? object.spec :
      (request.kind.kind == 'Job' ? object.spec.template.spec : object.spec.jobTemplate.spec.template.spec)
  - name: serviceAccount
    expression: >-
      has(variables.podSpec.serviceAccountName) && variables.podSpec.serviceAccountName != '' ? variables.podSpec.serviceAccountName :
      (has(variables.podSpec.serviceAccount) && variables.podSpec.serviceAccount != '' ? variables.podSpec.serviceAccount : 'default')
  validations:
  - expression: >-
      variables.serviceAccount != '{{ include "orka.serviceAccountName" . }}' ||
      (request.kind.kind == 'Pod' && has(object.metadata.ownerReferences) &&
      object.metadata.ownerReferences.exists(r, r.apiVersion == 'apps/v1' && r.kind == 'ReplicaSet' &&
      has(r.controller) && r.controller))
    message: only the controller Deployment may run as the controller ServiceAccount, whose tokens the agent identity blueprint trusts
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "orka.fullname" . }}-controller-serviceaccount-protection
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  policyName: {{ include "orka.fullname" . }}-controller-serviceaccount-protection
  validationActions: [Deny]
{{- end }}
