{{- if .Values.publisher.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orka.publisherName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: workspace-publisher
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "orka.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels:
              {{- include "orka.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: controller
      ports: [{protocol: TCP, port: {{ .Values.controller.apiPort }}}]
    - to:
        - podSelector:
            matchLabels:
              {{- include "orka.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: scm-egress-proxy
      ports: [{protocol: TCP, port: 8080}]
{{- end }}
