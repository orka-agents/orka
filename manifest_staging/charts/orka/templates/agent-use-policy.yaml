kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "orka.fullname" . }}-repositoryscan-agent-use
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["core.orka.ai"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["repositoryscans"]
  variables:
  - name: previousAgents
    expression: >-
      oldObject == null ? [] :
      [?oldObject.spec.?analysisAgentRef, ?oldObject.spec.?patchAgentRef].map(r, (r.?namespace.orValue('') == '' ? request.namespace : r.namespace) + '/' + r.name)
  validations:
  - expression: >-
      !has(object.spec.analysisAgentRef) ||
      ((object.spec.analysisAgentRef.?namespace.orValue('') == '' ? request.namespace : object.spec.analysisAgentRef.namespace) + '/' + object.spec.analysisAgentRef.name) in variables.previousAgents ||
      authorizer.group('core.orka.ai').resource('agents').namespace((object.spec.analysisAgentRef.?namespace.orValue('') == '' ? request.namespace : object.spec.analysisAgentRef.namespace)).name(object.spec.analysisAgentRef.name).check('use').allowed()
    message: caller is not authorized to use the analysis Agent
    reason: Forbidden
  - expression: >-
      !has(object.spec.patchAgentRef) ||
      ((object.spec.patchAgentRef.?namespace.orValue('') == '' ? request.namespace : object.spec.patchAgentRef.namespace) + '/' + object.spec.patchAgentRef.name) in variables.previousAgents ||
      authorizer.group('core.orka.ai').resource('agents').namespace((object.spec.patchAgentRef.?namespace.orValue('') == '' ? request.namespace : object.spec.patchAgentRef.namespace)).name(object.spec.patchAgentRef.name).check('use').allowed()
