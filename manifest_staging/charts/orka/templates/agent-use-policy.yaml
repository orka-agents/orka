apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "orka.fullname" . }}-repositorymonitor-agent-use
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["core.orka.ai"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["repositorymonitors"]
  variables:
  - name: previousAgents
    expression: >-
      oldObject == null ? [] :
      [?oldObject.spec.?agents.?reviewer, ?oldObject.spec.?agents.?triager, ?oldObject.spec.?agents.?researcher, ?oldObject.spec.?agents.?planner, ?oldObject.spec.?agents.?repairer, ?oldObject.spec.?agents.?implementer].map(r, (r.?namespace.orValue('') == '' ? request.namespace : r.namespace) + '/' + r.name)
  validations:
  - expression: >-
      !has(object.spec.agents) || !has(object.spec.agents.reviewer) ||
      ((object.spec.agents.reviewer.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.reviewer.namespace) + '/' + object.spec.agents.reviewer.name) in variables.previousAgents ||
      authorizer.group('core.orka.ai').resource('agents').namespace((object.spec.agents.reviewer.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.reviewer.namespace)).name(object.spec.agents.reviewer.name).check('use').allowed()
