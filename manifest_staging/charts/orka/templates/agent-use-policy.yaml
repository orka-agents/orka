  - expression: >-
      !has(object.spec.agents) || !has(object.spec.agents.researcher) ||
      ((object.spec.agents.researcher.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.researcher.namespace) + '/' + object.spec.agents.researcher.name) in variables.previousAgents ||
      authorizer.group('core.orka.ai').resource('agents').namespace((object.spec.agents.researcher.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.researcher.namespace)).name(object.spec.agents.researcher.name).check('use').allowed()
    message: caller is not authorized to use the researcher Agent
    reason: Forbidden
  - expression: >-
      !has(object.spec.agents) || !has(object.spec.agents.planner) ||
      ((object.spec.agents.planner.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.planner.namespace) + '/' + object.spec.agents.planner.name) in variables.previousAgents ||
      authorizer.group('core.orka.ai').resource('agents').namespace((object.spec.agents.planner.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.planner.namespace)).name(object.spec.agents.planner.name).check('use').allowed()
    message: caller is not authorized to use the planner Agent
    reason: Forbidden
  - expression: >-
      !has(object.spec.agents) || !has(object.spec.agents.repairer) ||
      ((object.spec.agents.repairer.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.repairer.namespace) + '/' + object.spec.agents.repairer.name) in variables.previousAgents ||
      authorizer.group('core.orka.ai').resource('agents').namespace((object.spec.agents.repairer.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.repairer.namespace)).name(object.spec.agents.repairer.name).check('use').allowed()
    message: caller is not authorized to use the repairer Agent
    reason: Forbidden
  - expression: >-
      !has(object.spec.agents) || !has(object.spec.agents.implementer) ||
      ((object.spec.agents.implementer.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.implementer.namespace) + '/' + object.spec.agents.implementer.name) in variables.previousAgents ||
      authorizer.group('core.orka.ai').resource('agents').namespace((object.spec.agents.implementer.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.implementer.namespace)).name(object.spec.agents.implementer.name).check('use').allowed()
    message: caller is not authorized to use the implementer Agent
    reason: Forbidden
