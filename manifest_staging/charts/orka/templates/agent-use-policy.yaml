{{- if dig "agentUseAuthorization" "enabled" false .Values.controller }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "orka.fullname" . }}-task-agent-use
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["core.orka.ai"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["tasks"]
  variables:
  - name: previousAgents
    expression: >-
      oldObject == null ? [] :
      [?oldObject.spec.?agentRef].map(r, (r.?namespace.orValue('') == '' ? request.namespace : r.namespace) + '/' + r.name)
  validations:
  - expression: >-
      !has(object.spec.agentRef) ||
      ((object.spec.agentRef.?namespace.orValue('') == '' ? request.namespace : object.spec.agentRef.namespace) + '/' + object.spec.agentRef.name) in variables.previousAgents ||
      authorizer.group('core.orka.ai').resource('agents').namespace((object.spec.agentRef.?namespace.orValue('') == '' ? request.namespace : object.spec.agentRef.namespace)).name(object.spec.agentRef.name).check('use').allowed()
    message: caller is not authorized to use the Task's Agent
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "orka.fullname" . }}-task-agent-use
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  policyName: {{ include "orka.fullname" . }}-task-agent-use
  validationActions: [Deny]
  # Enforce only in this release's watched namespace, so another
  # installation on the cluster keeps its own setting.
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
---
