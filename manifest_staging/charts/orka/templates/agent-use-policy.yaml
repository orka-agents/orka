    reason: Forbidden
  - expression: >-
      !has(object.spec.agents) || !has(object.spec.agents.triager) ||
      ((object.spec.agents.triager.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.triager.namespace) + '/' + object.spec.agents.triager.name) in variables.previousAgents ||
      authorizer.group('core.orka.ai').resource('agents').namespace((object.spec.agents.triager.?namespace.orValue('') == '' ? request.namespace : object.spec.agents.triager.namespace)).name(object.spec.agents.triager.name).check('use').allowed()
