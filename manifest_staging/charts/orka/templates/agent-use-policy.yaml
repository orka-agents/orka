apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "orka.fullname" . }}-gatewaybinding-agent-use
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["gateway.orka.ai"]
      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["gatewaybindings"]
  validations:
  - expression: >-
      !has(object.spec.agentRef) ||
      (oldObject != null && has(oldObject.spec.agentRef) && oldObject.spec.agentRef == object.spec.agentRef) ||
      authorizer.group('core.orka.ai').resource('agents').namespace(request.namespace).name(object.spec.agentRef.name).check('use').allowed()
    message: caller is not authorized to use the bound Agent
    reason: Forbidden
---
