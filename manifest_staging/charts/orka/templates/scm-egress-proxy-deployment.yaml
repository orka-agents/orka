{{- if and (eq .Values.controller.mode "harness-v2") .Values.publisher.enabled .Values.scmEgressProxy.enabled }}
{{- $secretName := .Values.scmEgressProxy.auth.existingSecret | default (include "orka.scmEgressProxyAuthSecretName" .) }}
{{- $tokenKey := .Values.scmEgressProxy.auth.tokenKey | default "token" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orka.scmEgressProxyName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: scm-egress-proxy
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scm-egress-proxy
  template:
    metadata:
      {{- with .Values.scmEgressProxy.auth.rolloutNonce }}
      annotations:
        orka.ai/scm-egress-proxy-auth-rollout-nonce: {{ . | quote }}
      {{- end }}
      labels:
        {{- include "orka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scm-egress-proxy
        orka.ai/network-role: scm-egress-proxy
    spec:
      serviceAccountName: {{ include "orka.scmEgressProxyName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: proxy
          image: {{ include "orka.imageRef" .Values.controller.image | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command: [/scm-egress-proxy]
          args:
            - --listen-address=:8080
            - {{ printf "--allowed-hosts=%s" .Values.publisher.allowedSCMHosts | quote }}
            {{- if .Values.publisher.githubPR.enabled }}
            - {{ printf "--forge-api-base-url=%s" .Values.publisher.githubPR.apiBaseURL | quote }}
            {{- else }}
            - --forge-api-base-url=
            {{- end }}
            - --token-file=/var/run/secrets/orka/scm-egress/token
            - {{ printf "--max-request-header-bytes=%v" .Values.scmEgressProxy.maxRequestHeaderBytes | quote }}
            - {{ printf "--max-response-header-bytes=%v" .Values.scmEgressProxy.maxResponseHeaderBytes | quote }}
            - {{ printf "--max-request-bytes=%v" .Values.scmEgressProxy.maxRequestBytes | quote }}
            - {{ printf "--max-response-bytes=%v" .Values.scmEgressProxy.maxResponseBytes | quote }}
            - {{ printf "--max-tunnel-bytes=%v" .Values.scmEgressProxy.maxTunnelBytes | quote }}
            - {{ printf "--max-concurrent=%v" .Values.scmEgressProxy.maxConcurrent | quote }}
            - {{ printf "--resolution-timeout=%s" .Values.scmEgressProxy.resolutionTimeout | quote }}
            - {{ printf "--connect-timeout=%s" .Values.scmEgressProxy.connectTimeout | quote }}
            - {{ printf "--response-header-timeout=%s" .Values.scmEgressProxy.responseHeaderTimeout | quote }}
            - {{ printf "--forward-timeout=%s" .Values.scmEgressProxy.forwardTimeout | quote }}
            - {{ printf "--idle-timeout=%s" .Values.scmEgressProxy.idleTimeout | quote }}
            - {{ printf "--tunnel-timeout=%s" .Values.scmEgressProxy.tunnelTimeout | quote }}
          ports:
            - {name: http-proxy, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.scmEgressProxy.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http-proxy}
          livenessProbe:
            httpGet: {path: /healthz, port: http-proxy}
          volumeMounts:
            - {name: auth, mountPath: /var/run/secrets/orka/scm-egress/token, subPath: token, readOnly: true}
      volumes:
        - name: auth
          secret:
            secretName: {{ $secretName }}
            defaultMode: 0440
            items:
              - key: {{ $tokenKey }}
                path: token
{{- end }}
