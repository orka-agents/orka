{{- include "orka.validateAdmission" . }}
{{- if .Values.admission.webhooks.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "orka.agentExecutionBindingAdmissionPolicyName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: core.orka.ai/v1alpha1
    kind: AgentExecutionControl
  matchConstraints:
    resourceRules:
      - apiGroups: [core.orka.ai]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [tasks, tasks/status]
  matchConditions:
    - name: binding-introduced
      expression: >-
        object.?status.?agentExecutionBinding.hasValue() &&
        !oldObject.?status.?agentExecutionBinding.hasValue()
  validations:
    - expression: >-
        params != null &&
        params.metadata.name == 'cluster' &&
        params.metadata.namespace == 'orka-system' &&
        string(params.metadata.uid) != '' &&
        params.metadata.generation > 0 &&
        params.?status.?backends.hasValue() &&
        params.status.observedGeneration == params.metadata.generation &&
        (
          (
            object.status.agentExecutionBinding.provenance == 'legacy-cleanup-only' &&
            object.status.agentExecutionBinding.mode == 'cleanup-only' &&
            !object.status.agentExecutionBinding.?backendControl.hasValue() &&
            object.status.agentExecutionBinding.?migrationInventoryID.hasValue() &&
            params.?status.?classification.hasValue() &&
            params.status.classification.state == 'Open' &&
            string(params.status.classification.controlUID) == string(params.metadata.uid) &&
            params.status.classification.controlGeneration == params.metadata.generation &&
            params.status.classification.inventoryID == object.status.agentExecutionBinding.migrationInventoryID &&
            params.status.classification.inventoryDigest.matches('^sha256:[a-f0-9]{64}$')
          )
          ||
          (
            object.status.agentExecutionBinding.?backendControl.hasValue() &&
            object.status.agentExecutionBinding.backendControl.name == params.metadata.name &&
            string(object.status.agentExecutionBinding.backendControl.uid) == string(params.metadata.uid) &&
            object.status.agentExecutionBinding.backendControl.generation == params.metadata.generation &&
            object.status.agentExecutionBinding.backendControl.admittedMode == 'enabled' &&
            (
              (
                object.status.agentExecutionBinding.contractVersion == 'orka.harness.v2' &&
                params.status.backends.v2.effectiveMode == 'enabled' &&
                !params.status.backends.v2.?admissionClosedAt.hasValue() &&
                object.status.agentExecutionBinding.backendControl.modeRevision == params.status.backends.v2.modeRevision
              )
              ||
              (
                object.status.agentExecutionBinding.contractVersion == 'orka.harness.v1' &&
                params.status.backends.v1.effectiveMode == 'enabled' &&
                !params.status.backends.v1.?admissionClosedAt.hasValue() &&
                object.status.agentExecutionBinding.backendControl.modeRevision == params.status.backends.v1.modeRevision
              )
            )
          )
        )
      message: >-
        new execution bindings require the exact observed AgentExecutionControl
        identity, generation, enabled backend, and mode revision; only the exact
        live Open inventory may create legacy cleanup-only bindings without
        backend control
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "orka.agentExecutionBindingAdmissionPolicyName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
spec:
  policyName: {{ include "orka.agentExecutionBindingAdmissionPolicyName" . }}
  validationActions: [Deny]
  paramRef:
    name: cluster
    namespace: orka-system
    parameterNotFoundAction: Deny
{{- end }}
