{{- $harnessV1 := eq .Values.controller.mode "harness-v1" -}}
{{- $harnessV2 := eq .Values.controller.mode "harness-v2" -}}
{{- include "orka.validateControllerMode" . }}
{{- include "orka.validateProviderProxyConfig" . }}
{{- include "orka.validateSQLiteController" . }}
{{- include "orka.validateAgentExecutionSnapshot" . }}
{{- include "orka.validateWebhooks" . }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" (.Values.controller.image.digest | default "")) }}
{{- fail "controller.image.digest must be a sha256 digest" }}
{{- end }}
{{- if $harnessV2 }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" (.Values.controller.image.digest | default "")) }}
{{- fail "controller.image.digest must be a sha256 digest when controller.mode=harness-v2" }}
{{- end }}
{{- if or (not .Values.publisher.enabled) (not (regexMatch "^sha256:[0-9a-f]{64}$" (.Values.publisher.image.digest | default ""))) }}
{{- fail "publisher must be enabled with publisher.image.digest set when controller.mode=harness-v2" }}
{{- end }}
{{- if not .Values.store.persistence.enabled }}
{{- fail "store.persistence.enabled must be true when controller.mode=harness-v2" }}
{{- end }}
{{- include "orka.validateACPRuntimeImage" (dict "name" "controller.acpRuntime.codexImage" "ref" .Values.controller.acpRuntime.codexImage) }}
{{- include "orka.validateACPRuntimeImage" (dict "name" "controller.acpRuntime.claudeImage" "ref" .Values.controller.acpRuntime.claudeImage) }}
{{- include "orka.validateACPRuntimeImage" (dict "name" "controller.acpRuntime.copilotImage" "ref" .Values.controller.acpRuntime.copilotImage) }}
{{- include "orka.validateACPRuntimeImage" (dict "name" "controller.acpRuntime.opencodeImage" "ref" .Values.controller.acpRuntime.opencodeImage) }}
{{- if not .Values.providerProxy.enabled }}
{{- fail "providerProxy.enabled must be true when controller.mode=harness-v2" }}
{{- end }}
{{- end }}
{{- $gatewayCRDsReady := false -}}
{{- if and $harnessV2 .Values.controller.gateway.enabled (not .Values.controller.gateway.crdsReadyOverride) -}}
{{- $gatewayClassCRD := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "gatewayclasses.gateway.orka.ai" -}}
{{- $gatewayCRD := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "gateways.gateway.orka.ai" -}}
{{- $gatewayBindingCRD := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "gatewaybindings.gateway.orka.ai" -}}
{{- $taskCRD := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "tasks.core.orka.ai" -}}
{{- $taskSchemaReady := false -}}
{{- if $taskCRD -}}
{{- $taskSchemaReady = eq (get (default (dict) $taskCRD.metadata.annotations) "gateway.orka.ai/session-cutoff-schema") "v1" -}}
{{- end -}}
{{- $gatewayCRDsReady = and (not (empty $gatewayClassCRD)) (not (empty $gatewayCRD)) (not (empty $gatewayBindingCRD)) $taskSchemaReady -}}
{{- end -}}
{{- $gatewayRuntimeEnabled := and $harnessV2 .Values.controller.gateway.enabled (or .Values.controller.gateway.crdsReadyOverride $gatewayCRDsReady) -}}
{{- if and $gatewayRuntimeEnabled (not .Values.store.persistence.enabled) (not .Values.controller.gateway.allowEphemeralStore) -}}
{{- fail "controller.gateway.enabled requires store.persistence.enabled=true; set controller.gateway.allowEphemeralStore=true only for disposable development" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orka.controllerName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "orka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        orka.ai/network-role: controller
      {{- if or .Values.annotations (and $harnessV2 .Values.publisher.auth.rolloutNonce) }}
      annotations:
        {{- with .Values.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.publisher.auth.rolloutNonce }}
        orka.ai/publisher-auth-rollout-nonce: {{ . | quote }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "orka.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and $harnessV2 .Values.controller.acpRuntime.upgradeDrain.enabled }}
      terminationGracePeriodSeconds: {{ .Values.controller.acpRuntime.upgradeDrain.terminationGracePeriodSeconds }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "orka.imageRef" .Values.controller.image | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - --api-port={{ .Values.controller.apiPort }}
            - --controller-url=http://{{ include "orka.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
            - --metrics-bind-address=:{{ .Values.controller.metricsPort }}
            - --health-probe-bind-address=:{{ .Values.controller.healthPort }}
            - --metrics-secure=false
            - --watch-namespace={{ .Values.controller.watchNamespace }}
            - --leader-elect={{ .Values.controller.leaderElect }}
            - --controller-mode={{ .Values.controller.mode }}
            - {{ printf "--execution-mode-controller-usernames=%s" (include "orka.controllerUsername" .) | quote }}
            - --webhook-cert-path=/var/run/orka/webhook/tls
            - {{ printf "--webhook-cert-name=%s" .Values.webhooks.tls.certKey | quote }}
            - {{ printf "--webhook-cert-key=%s" .Values.webhooks.tls.privateKeyKey | quote }}
            - --task-provenance-admission-enabled=true
            - {{ printf "--task-provenance-admission-trusted-users=%s" (include "orka.controllerUsername" .) | quote }}
            - --workspace-class-use-admission-enabled={{ $harnessV2 }}
            {{- if $harnessV1 }}
            - --harness-v1-endpoint=https://{{ include "orka.harnessV1Name" . }}.{{ .Release.Namespace }}.svc:8080
            - --harness-v1-ca-file=/var/run/orka/harness-v1-tls/ca.crt
            - --harness-v1-auth-secret-namespace={{ .Release.Namespace }}
            - --harness-v1-auth-secret-name={{ .Values.harnessV1.auth.existingSecret }}
            - --harness-v1-auth-secret-key={{ .Values.harnessV1.auth.tokenKey }}
            - --harness-v1-dispatch-interval={{ .Values.harnessV1.dispatch.interval }}
            - --harness-v1-dispatch-workers={{ .Values.harnessV1.dispatch.workers }}
            {{- end }}
            - --agent-execution-snapshot-key-file=/var/run/orka/agent-execution-snapshot/key
            - --agent-execution-snapshot-retention={{ .Values.controller.agentExecutionSnapshot.retention }}
            - --agent-execution-snapshot-retention-interval={{ .Values.controller.agentExecutionSnapshot.retentionInterval }}
            {{- if $harnessV2 }}
            - --acp-runtime-namespace={{ .Values.controller.acpRuntime.namespace }}
            {{- end }}
            {{- if and $harnessV2 .Values.controller.acpRuntime.upgradeDrain.enabled }}
            - --acp-upgrade-drain-bind-address=127.0.0.1:{{ .Values.controller.acpRuntime.upgradeDrain.port }}
            - --acp-upgrade-drain-timeout={{ .Values.controller.acpRuntime.upgradeDrain.timeout }}
            - --acp-upgrade-drain-poll-interval={{ .Values.controller.acpRuntime.upgradeDrain.pollInterval }}
            - --acp-upgrade-drain-trigger-timeout={{ .Values.controller.acpRuntime.upgradeDrain.triggerTimeout }}
            - --acp-upgrade-drain-marker-namespace={{ .Release.Namespace }}
            {{- end }}
            {{- if and $harnessV2 .Values.providerProxy.enabled }}
            - --acp-provider-proxy-base-url=http://{{ include "orka.providerProxyName" . }}.{{ .Release.Namespace }}.svc:8080
            - --acp-provider-proxy-namespace={{ .Release.Namespace }}
            - --acp-provider-proxy-pod-labels=orka.ai/network-role=provider-auth-proxy
            - --acp-provider-proxy-token-file=/var/run/orka/provider-auth/token
            {{- end }}
            {{- if .Values.controller.acpRuntime.codexImage }}
            - {{ printf "--acp-codex-runtime-image=%s" .Values.controller.acpRuntime.codexImage | quote }}
            {{- end }}
            {{- if .Values.controller.acpRuntime.claudeImage }}
            - {{ printf "--acp-claude-runtime-image=%s" .Values.controller.acpRuntime.claudeImage | quote }}
            {{- end }}
            {{- if .Values.controller.acpRuntime.copilotImage }}
            - {{ printf "--acp-copilot-runtime-image=%s" .Values.controller.acpRuntime.copilotImage | quote }}
            {{- end }}
            {{- if .Values.controller.acpRuntime.opencodeImage }}
            - {{ printf "--acp-opencode-runtime-image=%s" .Values.controller.acpRuntime.opencodeImage | quote }}
            {{- end }}
            - --zap-log-level={{ .Values.controller.logLevel }}
            - --gateway-enabled={{ $gatewayRuntimeEnabled }}
            - --gateway-pending-per-session={{ .Values.controller.gateway.pendingPerSession }}
            - --gateway-max-records-per-gateway={{ .Values.controller.gateway.maxRecordsPerGateway }}
            - --gateway-max-rejected-records-per-gateway={{ .Values.controller.gateway.maxRejectedRecordsPerGateway }}
            - --gateway-event-expiry={{ .Values.controller.gateway.eventExpiry }}
            - --gateway-terminal-retention={{ .Values.controller.gateway.terminalRetention }}
            - --gateway-delivery-timeout={{ .Values.controller.gateway.deliveryTimeout }}
            - --gateway-delivery-max-attempts={{ .Values.controller.gateway.deliveryMaxAttempts }}
            - --gateway-claim-lease={{ .Values.controller.gateway.claimLease }}
            - --gateway-poll-interval={{ .Values.controller.gateway.pollInterval }}
            - --gateway-batch-size={{ .Values.controller.gateway.batchSize }}
            {{- with .Values.controller.oidc }}
            {{- if .issuer }}
            - {{ printf "--oidc-issuer=%s" .issuer | quote }}
            {{- end }}
            {{- if .audience }}
            - {{ printf "--oidc-audience=%s" .audience | quote }}
            {{- end }}
            {{- if .jwksUrl }}
            - {{ printf "--oidc-jwks-url=%s" .jwksUrl | quote }}
            {{- end }}
            {{- if .allowedSubjects }}
            - {{ printf "--oidc-allowed-subjects=%s" .allowedSubjects | quote }}
            {{- end }}
            {{- if .namespace }}
            - {{ printf "--oidc-namespace=%s" .namespace | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.controller.contextToken }}
            {{- if .profile }}
            - {{ printf "--context-token-profile=%s" .profile | quote }}
            {{- end }}
            {{- if .issuer }}
            - {{ printf "--context-token-issuer=%s" .issuer | quote }}
            {{- end }}
            {{- if .audience }}
            - {{ printf "--context-token-audience=%s" .audience | quote }}
            {{- end }}
            {{- if .jwksUrl }}
            - {{ printf "--context-token-jwks-url=%s" .jwksUrl | quote }}
            {{- end }}
            {{- if .headers }}
            - {{ printf "--context-token-headers=%s" .headers | quote }}
            {{- end }}
            {{- if .authzMode }}
            - {{ printf "--context-token-authz-mode=%s" .authzMode | quote }}
            {{- end }}
            {{- with .scopes }}
            {{- if .taskCreate }}
            - {{ printf "--context-token-task-create-scopes=%s" .taskCreate | quote }}
            {{- end }}
            {{- if .taskRead }}
            - {{ printf "--context-token-task-read-scopes=%s" .taskRead | quote }}
            {{- end }}
            {{- if .taskList }}
            - {{ printf "--context-token-task-list-scopes=%s" .taskList | quote }}
            {{- end }}
            {{- if .taskDelete }}
            - {{ printf "--context-token-task-delete-scopes=%s" .taskDelete | quote }}
            {{- end }}
            {{- if .taskUpdate }}
            - {{ printf "--context-token-task-update-scopes=%s" .taskUpdate | quote }}
            {{- end }}
            {{- if .toolRead }}
            - {{ printf "--context-token-tool-read-scopes=%s" .toolRead | quote }}
            {{- end }}
            {{- if .toolUse }}
            - {{ printf "--context-token-tool-use-scopes=%s" .toolUse | quote }}
            {{- end }}
            {{- if .providerUse }}
            - {{ printf "--context-token-provider-use-scopes=%s" .providerUse | quote }}
            {{- end }}
            {{- if .secretRead }}
            - {{ printf "--context-token-secret-read-scopes=%s" .secretRead | quote }}
            {{- end }}
            {{- if .agentRead }}
            - {{ printf "--context-token-agent-read-scopes=%s" .agentRead | quote }}
            {{- end }}
            {{- if .agentWrite }}
            - {{ printf "--context-token-agent-write-scopes=%s" .agentWrite | quote }}
            {{- end }}
            {{- if .memoryRead }}
            - {{ printf "--context-token-memory-read-scopes=%s" .memoryRead | quote }}
            {{- end }}
            {{- if .memoryWrite }}
            - {{ printf "--context-token-memory-write-scopes=%s" .memoryWrite | quote }}
            {{- end }}
            {{- if .sessionRead }}
            - {{ printf "--context-token-session-read-scopes=%s" .sessionRead | quote }}
            {{- end }}
            {{- if .sessionWrite }}
            - {{ printf "--context-token-session-write-scopes=%s" .sessionWrite | quote }}
            {{- end }}
            {{- if .securityRead }}
            - {{ printf "--context-token-security-read-scopes=%s" .securityRead | quote }}
            {{- end }}
            {{- if .securityWrite }}
            - {{ printf "--context-token-security-write-scopes=%s" .securityWrite | quote }}
            {{- end }}
            {{- if .monitorRead }}
            - {{ printf "--context-token-monitor-read-scopes=%s" .monitorRead | quote }}
            {{- end }}
            {{- if .monitorWrite }}
            - {{ printf "--context-token-monitor-write-scopes=%s" .monitorWrite | quote }}
            {{- end }}
            {{- if .monitorOperate }}
            - {{ printf "--context-token-monitor-operate-scopes=%s" .monitorOperate | quote }}
            {{- end }}
            {{- if .skillRead }}
            - {{ printf "--context-token-skill-read-scopes=%s" .skillRead | quote }}
            {{- end }}
            {{- if .skillWrite }}
            - {{ printf "--context-token-skill-write-scopes=%s" .skillWrite | quote }}
            {{- end }}
            {{- if .gatewayRead }}
            - {{ printf "--context-token-gateway-read-scopes=%s" .gatewayRead | quote }}
            {{- end }}
            {{- if .gatewayOperate }}
            - {{ printf "--context-token-gateway-operate-scopes=%s" .gatewayOperate | quote }}
            {{- end }}
            {{- end }}
            {{- with .tts }}
            {{- if .url }}
            - {{ printf "--context-token-tts-endpoint=%s" .url | quote }}
            {{- end }}
            {{- if .audience }}
            - {{ printf "--context-token-tts-audience=%s" .audience | quote }}
            {{- end }}
            {{- if .timeout }}
            - {{ printf "--context-token-tts-timeout=%s" .timeout | quote }}
            {{- end }}
            {{- if .tokenSource }}
            - {{ printf "--context-token-tts-token-source=%s" .tokenSource | quote }}
            {{- end }}
            {{- if .subjectTokenType }}
            - {{ printf "--context-token-subject-token-type=%s" .subjectTokenType | quote }}
            {{- end }}
            {{- if .childScope }}
            - {{ printf "--context-token-child-scope=%s" .childScope | quote }}
            {{- end }}
            {{- if .outboundScope }}
            - {{ printf "--context-token-outbound-scope=%s" .outboundScope | quote }}
            {{- end }}
            {{- if .childTokenTTL }}
            - {{ printf "--context-token-child-token-ttl=%s" .childTokenTTL | quote }}
            {{- end }}
            {{- if .toolTokenTTL }}
            - {{ printf "--context-token-tool-token-ttl=%s" .toolTokenTTL | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - --store-backend=sqlite
            - --store-path={{ .Values.store.path }}
            - --ai-worker-image={{ .Values.workers.ai.image.repository }}:{{ .Values.workers.ai.image.tag }}
            - --general-worker-image={{ .Values.workers.general.image.repository }}:{{ .Values.workers.general.image.tag }}
            - --ai-worker-service-account-name={{ include "orka.aiWorkerServiceAccountName" . }}
            - --vendor-worker-service-account-name={{ include "orka.vendorWorkerServiceAccountName" . }}
            - --container-worker-service-account-name={{ include "orka.containerWorkerServiceAccountName" . }}
            - --ai-worker-cluster-role-name={{ include "orka.aiWorkerClusterRoleName" . }}
            - --vendor-worker-cluster-role-name={{ include "orka.vendorWorkerClusterRoleName" . }}
            - --container-worker-cluster-role-name={{ include "orka.containerWorkerClusterRoleName" . }}
            - --worker-role-binding-prefix={{ include "orka.fullname" . }}
            - --enforce-namespace-isolation=true
            {{- if gt (int .Values.controller.maxTasksPerNamespace) 0 }}
            - --max-tasks-per-namespace={{ .Values.controller.maxTasksPerNamespace }}
            {{- end }}
            {{- with .Values.controller.executionWorkspace }}
            - --execution-workspace-default-provider={{ .defaultProvider | default "agent-sandbox" }}
            {{- end }}
            {{- with .Values.controller.agentSandbox }}
            {{- if .enabled }}
            - --agent-sandbox-enabled=true
            {{- if .routerUrl }}
            - {{ printf "--agent-sandbox-router-url=%s" .routerUrl | quote }}
            {{- end }}
            {{- if .defaultTemplate }}
            - {{ printf "--agent-sandbox-default-template=%s" .defaultTemplate | quote }}
            {{- end }}
            - --agent-sandbox-warm-pool-policy={{ .warmPoolPolicy | default "disabled" }}
            - --agent-sandbox-namespace-strategy={{ .namespaceStrategy | default "task" }}
            - --agent-sandbox-claim-timeout={{ .claimTimeout | default "2m" }}
            - --agent-sandbox-command-timeout={{ .commandTimeout | default "30m" }}
            - --agent-sandbox-cleanup-policy={{ .cleanupPolicy | default "delete" }}
            {{- end }}
            {{- end }}
            {{- with .Values.controller.substrate }}
            {{- if .enabled }}
            - --substrate-enabled=true
            - {{ printf "--substrate-api-endpoint=%s" (.apiEndpoint | default "api.ate-system.svc:443") | quote }}
            {{- if .apiCAFile }}
            - {{ printf "--substrate-api-ca-file=%s" .apiCAFile | quote }}
            {{- end }}
            {{- if .apiInsecureSkipVerify }}
            - --substrate-api-insecure-skip-verify=true
            {{- end }}
            - {{ printf "--substrate-router-url=%s" (.routerUrl | default "http://atenet-router.ate-system.svc") | quote }}
            - {{ printf "--substrate-actor-dns-suffix=%s" (.actorDnsSuffix | default "actors.resources.substrate.ate.dev") | quote }}
            {{- if .defaultTemplate }}
            - {{ printf "--substrate-default-template=%s" .defaultTemplate | quote }}
            {{- end }}
            {{- if .defaultTemplateNamespace }}
            - {{ printf "--substrate-default-template-namespace=%s" .defaultTemplateNamespace | quote }}
            {{- end }}
            {{- if .bootstrapTokenSecretName }}
            - {{ printf "--substrate-bootstrap-token-secret-name=%s" .bootstrapTokenSecretName | quote }}
            - {{ printf "--substrate-bootstrap-token-secret-key=%s" (.bootstrapTokenSecretKey | default "token") | quote }}
            {{- end }}
            - --substrate-claim-timeout={{ .claimTimeout | default "2m" }}
            - --substrate-command-timeout={{ .commandTimeout | default "30m" }}
            - --substrate-cleanup-policy={{ .cleanupPolicy | default "delete" }}
            {{- end }}
            {{- end }}
          env:
            - name: ORKA_AI_WORKER_CLUSTER_ROLE_NAME
              value: {{ include "orka.aiWorkerClusterRoleName" . | quote }}
            - name: ORKA_VENDOR_WORKER_CLUSTER_ROLE_NAME
              value: {{ include "orka.vendorWorkerClusterRoleName" . | quote }}
            - name: ORKA_CONTAINER_WORKER_CLUSTER_ROLE_NAME
              value: {{ include "orka.containerWorkerClusterRoleName" . | quote }}
            {{- if $harnessV2 }}
            - name: ORKA_ACP_ARTIFACT_CAPABILITY_SECRET_FILE
              value: /var/run/orka/acp-artifacts/capability-secret
            - name: ORKA_ACP_ARTIFACT_ROOT
              value: /data/acp-artifacts
            - name: ORKA_ACP_ARTIFACT_MAX_BYTES
              value: {{ .Values.controller.acpArtifact.maxBytes | quote }}
            {{- end }}
            {{- if and $harnessV2 .Values.publisher.enabled }}
            - name: ORKA_WORKSPACE_PUBLISHER_URL
              value: http://{{ include "orka.publisherName" . }}:8080
            - name: ORKA_WORKSPACE_PUBLISHER_CONTROLLER_TOKEN_FILE
              value: /var/run/orka/publisher-auth/controller-token
            - name: ORKA_WORKSPACE_PUBLISHER_CAPABILITY_SECRET_FILE
              value: /var/run/orka/publisher-auth/operation-capability-secret
            {{- end }}
            {{- if .Values.github.webhook.secretName }}
            - name: ORKA_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.webhook.secretName | quote }}
                  key: {{ .Values.github.webhook.secretKey | quote }}
            {{- end }}
            {{- if .Values.github.labelTrigger.agent }}
            - name: ORKA_GITHUB_LABEL_TRIGGER_AGENT
              value: {{ .Values.github.labelTrigger.agent | quote }}
            {{- end }}
            {{- if .Values.github.labelTrigger.namespace }}
            - name: ORKA_GITHUB_LABEL_TRIGGER_NAMESPACE
              value: {{ .Values.github.labelTrigger.namespace | quote }}
            {{- end }}
            {{- if .Values.github.labelTrigger.gitSecret }}
            - name: ORKA_GITHUB_LABEL_TRIGGER_GIT_SECRET
              value: {{ .Values.github.labelTrigger.gitSecret | quote }}
            {{- end }}
            {{- if or .Values.github.webhook.secretName .Values.github.labelTrigger.agent .Values.github.labelTrigger.namespace .Values.github.labelTrigger.gitSecret .Values.github.labelTrigger.agents }}
            {{- if .Values.github.labelTrigger.prefix }}
            - name: ORKA_GITHUB_LABEL_TRIGGER_PREFIX
              value: {{ .Values.github.labelTrigger.prefix | quote }}
            {{- end }}
            {{- if .Values.github.labelTrigger.timeout }}
            - name: ORKA_GITHUB_LABEL_TRIGGER_TIMEOUT
              value: {{ .Values.github.labelTrigger.timeout | quote }}
            {{- end }}
            {{- if .Values.github.labelTrigger.maxTurns }}
            - name: ORKA_GITHUB_LABEL_TRIGGER_MAX_TURNS
              value: {{ .Values.github.labelTrigger.maxTurns | quote }}
            {{- end }}
            {{- end }}
            {{- range $action, $agent := .Values.github.labelTrigger.agents }}
            - name: ORKA_GITHUB_LABEL_AGENT_{{ regexReplaceAll "[^A-Z0-9]+" (upper $action) "_" | trimAll "_" }}
              value: {{ $agent | quote }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.controller.apiPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.controller.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.controller.healthPort }}
              protocol: TCP
            - name: webhook
              containerPort: 9443
              protocol: TCP
          {{- if and $harnessV2 .Values.controller.acpRuntime.upgradeDrain.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /manager
                  - {{ printf "--acp-upgrade-drain-trigger-url=http://127.0.0.1:%v%s" .Values.controller.acpRuntime.upgradeDrain.port "/acp/upgrade-drain" | quote }}
                  - {{ printf "--acp-upgrade-drain-trigger-timeout=%s" .Values.controller.acpRuntime.upgradeDrain.triggerTimeout | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: store
              mountPath: /data
            {{- if $harnessV2 }}
            - name: acp-artifact-capability
              mountPath: /var/run/orka/acp-artifacts
              readOnly: true
            {{- end }}
            {{- if and $harnessV2 .Values.publisher.enabled }}
            - name: workspace-publisher-auth
              mountPath: /var/run/orka/publisher-auth
              readOnly: true
            {{- end }}
            {{- if and $harnessV2 .Values.providerProxy.enabled }}
            - name: provider-auth-proxy
              mountPath: /var/run/orka/provider-auth
              readOnly: true
            {{- end }}
            - name: agent-execution-snapshot-key
              mountPath: /var/run/orka/agent-execution-snapshot
              readOnly: true
            - name: webhook-tls
              mountPath: /var/run/orka/webhook/tls
              readOnly: true
            {{- if $harnessV1 }}
            - name: harness-v1-tls
              mountPath: /var/run/orka/harness-v1-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $harnessV2 }}
        - name: acp-artifact-capability
          secret:
            secretName: {{ .Values.controller.acpArtifact.existingSecret | default (include "orka.acpArtifactSecretName" .) }}
            defaultMode: 0400
            items:
              - key: {{ .Values.controller.acpArtifact.secretKey | default "capability-secret" }}
                path: capability-secret
        {{- end }}
        - name: store
          {{- if .Values.store.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "orka.storeName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if and $harnessV2 .Values.publisher.enabled }}
        - name: workspace-publisher-auth
          secret:
            secretName: {{ .Values.publisher.auth.existingSecret | default (include "orka.publisherAuthSecretName" .) }}
            defaultMode: 0400
            items:
              - key: {{ .Values.publisher.auth.controllerTokenKey | default "controller-token" }}
                path: controller-token
              - key: {{ .Values.publisher.auth.capabilitySecretKey | default "operation-capability-secret" }}
                path: operation-capability-secret
        {{- end }}
        {{- if and $harnessV2 .Values.providerProxy.enabled }}
        - name: provider-auth-proxy
          secret:
            secretName: {{ .Values.providerProxy.auth.existingSecret | default (include "orka.providerProxyName" .) }}
            defaultMode: 0400
            items:
              - key: {{ .Values.providerProxy.auth.tokenKey | default "token" }}
                path: token
        {{- end }}
        - name: agent-execution-snapshot-key
          secret:
            secretName: {{ .Values.controller.agentExecutionSnapshot.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.controller.agentExecutionSnapshot.key | quote }}
                path: key
        - name: webhook-tls
          secret:
            secretName: {{ .Values.webhooks.tls.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.webhooks.tls.certKey | quote }}
                path: {{ .Values.webhooks.tls.certKey | quote }}
              - key: {{ .Values.webhooks.tls.privateKeyKey | quote }}
                path: {{ .Values.webhooks.tls.privateKeyKey | quote }}
        {{- if $harnessV1 }}
        - name: harness-v1-tls
          secret:
            secretName: {{ .Values.harnessV1.auth.existingSecret | quote }}
            defaultMode: 0400
            items:
              - key: ca.crt
                path: ca.crt
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
