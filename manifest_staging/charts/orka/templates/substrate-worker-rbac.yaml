{{- if and .Values.rbac.create (eq .Values.controller.mode "harness-v2") -}}
{{- range .Values.controller.substrate.workerNamespaces | uniq }}
---
# Dedicated native Substrate worker namespace. Retained when admission is disabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orka.controllerClusterRoleName" $ }}-substrate
  namespace: {{ . | quote }}
  labels:
    {{- include "orka.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orka.controllerClusterRoleName" $ }}-substrate
  namespace: {{ . | quote }}
  labels:
    {{- include "orka.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orka.controllerClusterRoleName" $ }}-substrate
subjects:
  - kind: ServiceAccount
    name: {{ include "orka.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
