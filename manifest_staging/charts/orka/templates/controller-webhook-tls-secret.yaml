{{- if include "orka.webhookTLSGenerated" . }}
{{- /*
Release-owned webhook TLS Secret. The chart creates it empty and never renders
certificate or key material; the controller's certificate rotator populates
tls.crt, tls.key, ca.crt, and ca.key, the kubelet projects them into the
controller's cert directory, and the rotator renews the serving certificate
before expiry and keeps the ValidatingWebhookConfiguration caBundle in sync.
Helm leaves data it never rendered untouched on upgrade, and the keep policy
preserves the CA across helm uninstall so a reinstall does not need to
re-establish trust. Never use helm upgrade --force on this release.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orka.webhookTLSSecretName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- end }}
