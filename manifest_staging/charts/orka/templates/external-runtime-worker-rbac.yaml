{{- if and .Values.rbac.create (eq .Values.controller.mode "harness-v2") -}}
{{- range .Values.controller.executionWorkspace.workerNamespaces | uniq }}
---
# Provider worker namespace. Runtime identity reads never authorize compute mutation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orka.controllerClusterRoleName" $ }}-external-runtime-reader
  namespace: {{ . | quote }}
  labels:
    {{- include "orka.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orka.controllerClusterRoleName" $ }}-external-runtime-reader
  namespace: {{ . | quote }}
  labels:
    {{- include "orka.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orka.controllerClusterRoleName" $ }}-external-runtime-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "orka.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
