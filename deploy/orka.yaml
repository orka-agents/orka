                              process. Defaults to fresh.
                            enum:
                            - fresh
                            - resident
                            type: string
                          residentKey:
                            description: |-
                              ResidentKey selects the process slot for resident mode. When omitted, the
                              worker derives a stable key from namespace, template, and reuse key.
                            type: string
                        type: object
