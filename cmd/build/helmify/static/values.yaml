# Orka Helm Chart Values

# Controller configuration
controller:
  # Required immutable execution contract for this installation. Install v1
  # and v2 as separate releases; one release never serves both contracts.
  mode: ""

  # Number of controller replicas
  replicas: 1

  # Controller image
  image:
    repository: ghcr.io/orka-agents/orka
    tag: "0.1.1"
    digest: ""
    pullPolicy: IfNotPresent

  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Required exclusive tenant namespace. Label it with
  # orka.ai/controller-mode matching controller.mode before startup.
  watchNamespace: ""

  # API server port
  apiPort: 8080

  # Metrics port
  metricsPort: 8081

  # Health probe port
  healthPort: 8082

  # Leader election is mandatory for the singleton SQLite controller.
  leaderElect: true

  # Log level (debug, info, warn, error)
  logLevel: info

  # Max active tasks per namespace (0 = unlimited)
  maxTasksPerNamespace: 0

  # Operation-scoped ACP artifact transport stored on the controller PVC.
  acpArtifact:
    existingSecret: ""
    secretKey: capability-secret
    secret: ""
    maxBytes: 536870912

  # Encryption key for immutable agent execution snapshots. When either agent
  # execution protocol is enabled, both fields must reference an existing
  # Secret. The selected value must contain exactly 32 raw bytes or its base64
  # encoding. The Secret name, item key, and selected key material must remain
  # unchanged for the lifetime of the release so retained snapshots stay
  # decryptable.
  agentExecutionSnapshot:
    existingSecret: ""
    key: ""
    # A snapshot must remain unreferenced for this full period before GC.
    retention: 720h
    # Reference-aware GC scan cadence.
    retentionInterval: 1h

  # Managed ACP core RuntimePools for built-in agent Tasks.
  acpRuntime:
    # Used only when controller.mode is harness-v2; there is no v1 fallback.
    namespace: orka-runtimes
    # The chart-managed provider proxy always runs in the Helm release namespace.
    # Leave empty or set exactly to .Release.Namespace; other values are rejected.
    providerProxyNamespace: ""
    # Configure each provider that should be available with an immutable
    # repository@sha256:<digest> reference. Empty providers remain unavailable
    # and Tasks selecting them fail closed.
    codexImage: ""
    claudeImage: ""
    copilotImage: ""
    opencodeImage: ""
    # Planned controller upgrades use a same-binary preStop child to call a
    # loopback-only coordinator. Keep terminationGracePeriodSeconds greater
    # than timeout and triggerTimeout so SIGTERM shutdown still has headroom.
    upgradeDrain:
      enabled: true
      port: 8083
      timeout: 5m
      pollInterval: 1s
      triggerTimeout: 5m15s
      terminationGracePeriodSeconds: 360
  # Provider-neutral external gateway plane.
  gateway:
    enabled: true
    # Disposable development only: allow gateways to acknowledge work on an emptyDir-backed store.
    allowEphemeralStore: false
    # Set true only when an offline renderer cannot use lookup and CRDs are applied separately.
    crdsReadyOverride: false
    pendingPerSession: 100
    maxRecordsPerGateway: 1000
    maxRejectedRecordsPerGateway: 250
    eventExpiry: 24h
    terminalRetention: 720h
    deliveryTimeout: 15s
    deliveryMaxAttempts: 10
    claimLease: 1m
    pollInterval: 500ms
    batchSize: 25

  # Experimental agent sandbox workspace support (disabled by default)
  executionWorkspace:
    # Default provider used when Task execution.workspace.provider is omitted.
    defaultProvider: agent-sandbox

  agentSandbox:
    # Enables workspace-backed execution for agent Tasks that set Task execution.workspace.
    enabled: false
    # Optional upstream agent-sandbox router base URL used for workspace claims.
    routerUrl: ""
    # Optional default execution workspace template name used when a Task omits execution.workspace.templateRef.name.
    defaultTemplate: ""
    # Warm pool policy: disabled, template.
    warmPoolPolicy: disabled
    # Namespace strategy: task, controller.
    namespaceStrategy: task
    # Timeout for workspace claim and readiness operations.
    claimTimeout: 2m
    # Timeout for agent runtime execution inside the sandbox.
    commandTimeout: 30m
    # Default cleanup policy: delete, retain.
    cleanupPolicy: delete

  # Experimental Substrate execution workspace support (disabled by default)
  substrate:
    enabled: false
    apiEndpoint: api.ate-system.svc:443
    apiCAFile: ""
    apiInsecureSkipVerify: false
    routerUrl: http://atenet-router.ate-system.svc
    actorDnsSuffix: actors.resources.substrate.ate.dev
    defaultTemplate: ""
    defaultTemplateNamespace: ""
    bootstrapTokenSecretName: ""
    bootstrapTokenSecretKey: token
    claimTimeout: 2m
    commandTimeout: 30m
    cleanupPolicy: delete

  # OIDC/JWT authentication for external API requests
  oidc:
    # Issuer URL expected in bearer tokens. Requires audience when set.
    issuer: ""
    # Audience expected in bearer tokens. Requires issuer when set.
    audience: ""
    # Optional JWKS URL. When empty, Orka discovers it from issuer.
    jwksUrl: ""
    # Required comma-separated subject allowlist patterns when OIDC is enabled.
    allowedSubjects: ""
    # Namespace assigned to authorized OIDC callers for namespace isolation. Empty uses controller default.
    namespace: ""

  # Transaction-token authentication, scoped authorization, and optional vendor-neutral TTS exchange.
  # Empty values keep the controller defaults / corresponding environment variables.
  contextToken:
    # Profile for external context tokens (supported: transaction-token).
    profile: ""
    # Issuer URL expected in context tokens. Requires profile and audience when set.
    issuer: ""
    # Audience expected in context tokens. Requires profile and issuer when set.
    audience: ""
    # Optional JWKS URL. For transaction-token, defaults to <issuer>/.well-known/jwks.json.
    jwksUrl: ""
    # Comma-separated token headers, e.g. Txn-Token or Txn-Token,Authorization:Bearer.
    headers: ""
    # Authorization mode: off, audit, or enforce. Empty defaults to off.
    authzMode: ""
    scopes:
      taskCreate: ""
      taskRead: ""
      taskList: ""
      taskDelete: ""
      taskUpdate: ""
      toolRead: ""
      toolUse: ""
      providerUse: ""
      secretRead: ""
      secretCredentialRead: ""
      agentRead: ""
      agentWrite: ""
      memoryRead: ""
      memoryWrite: ""
      sessionRead: ""
      sessionWrite: ""
      securityRead: ""
      securityWrite: ""
      monitorRead: ""
      monitorWrite: ""
      monitorOperate: ""
      skillRead: ""
      skillWrite: ""
      gatewayRead: ""
      gatewayOperate: ""
    tts:
      # Exact TTS OAuth endpoint for child/outbound transaction-token exchange.
      endpoint: ""
      # Optional exchange audience.
      audience: ""
      # Exchange timeout, e.g. 5s.
      timeout: ""
      # Subject token source: serviceAccount, incoming, or none.
      tokenSource: ""
      # Worker-side subject token type.
      subjectTokenType: ""
      # Requested scope for child delegated TxTokens.
      childScope: ""
      # Requested scope for outbound HTTP Tool TxTokens.
      outboundScope: ""
      # Requested TTLs, e.g. 5m and 2m.
      childTokenTTL: ""
      toolTokenTTL: ""

  outboundAccess:
    # Exact namespace/name:port tuples trusted for cross-namespace gateway refs.
    trustedGatewayServices: []
    # Exact namespace/name:port tuples trusted for cross-namespace token endpoint refs.
    trustedTokenEndpointServices: []

# Fail-closed admission served by this release's internal webhook Service. The
# certificate must authenticate <release>-orka-webhook.<namespace>.svc.
webhooks:
  tls:
    # Required. The chart never generates webhook certificates.
    existingSecret: ""
    certKey: tls.crt
    privateKeyKey: tls.key
  # Base64-encoded PEM CA bundle. Leave empty when an injector annotation is
  # configured below.
  caBundle: ""
  # For example: cert-manager.io/inject-ca-from-secret: orka-v2/orka-webhook-tls
  caInjectionAnnotations: {}
  timeoutSeconds: 10

# Clean-room Workspace/Publisher service.
publisher:
  enabled: true
  image:
    repository: ghcr.io/orka-agents/orka/workspace-publisher
    tag: "0.1.1"
    digest: ""
    pullPolicy: IfNotPresent
  allowedSCMHosts: github.com
  githubPR:
    enabled: true
    apiBaseURL: https://api.github.com
    requestTimeout: 15s
    maxResponseBytes: 4194304
  auth:
    existingSecret: ""
    controllerTokenKey: controller-token
    capabilitySecretKey: operation-capability-secret
    controllerToken: ""
    capabilitySecret: ""
    # Non-secret revision marker. When rotating the publisher auth Secret, bump
    # this value in the same Helm upgrade to restart controller and publisher.
    rolloutNonce: ""
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  persistence:
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 2Gi

# Authenticated, exact-host HTTPS egress boundary for the Workspace/Publisher.
# The Publisher has no direct public 443 egress; Git and forge API traffic must
# use this proxy, which re-resolves and validates every outbound connection.
scmEgressProxy:
  enabled: true
  noProxy: localhost,127.0.0.1,::1,.svc,.cluster.local
  maxRequestHeaderBytes: 32768
  maxResponseHeaderBytes: 65536
  maxRequestBytes: 4194304
  maxResponseBytes: 8388608
  maxTunnelBytes: 1073741824
  maxConcurrent: 8
  resolutionTimeout: 5s
  connectTimeout: 10s
  responseHeaderTimeout: 30s
  forwardTimeout: 2m
  idleTimeout: 30s
  tunnelTimeout: 10m
  auth:
    existingSecret: ""
    tokenKey: token
    # Existing Secret tokens must use only RFC 3986 unreserved characters and
    # be 32-256 bytes so they can be carried in authenticated proxy userinfo.
    token: ""
    # Non-secret revision marker. When rotating the SCM proxy auth Secret, bump
    # this value in the same Helm upgrade to restart publisher and SCM proxy.
    rolloutNonce: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 128Mi

# Authenticated boundary in front of the otherwise unauthenticated Vekil
# service. ACP RuntimePods can reach only this Service, never Vekil directly.
providerProxy:
  enabled: false
  # Only this chart-supported Vekil Service endpoint is accepted. One trailing
  # slash is normalized; alternate hosts, namespaces, and ports are rejected.
  upstreamBaseURL: http://vekil.vekil-system.svc:1337
  # Mounted Secret files are reloaded atomically; no proxy Pod restart is
  # required for token changes. Reload failures make readiness fail and disable
  # all authenticated forwarding until both files are valid again.
  tokenReloadInterval: 5s
  # Maximum remaining lifetime accepted from the overlap token's absolute
  # deadline. Periodic reloads and Pod restarts cannot extend it. Maximum: 24h.
  previousTokenOverlap: 10m
  # Optional operator-controlled restart input for binary/flag changes or
  # recovery. Change it to force only the provider-auth-proxy Pod to roll.
  rolloutNonce: ""
  auth:
    existingSecret: ""
    tokenKey: token
    token: ""
    # Optional overlap key/value. Existing single-token Secrets remain valid
    # when this key is absent. For proxy-first rotation, publish new as current
    # and old here, wait for proxy reload, then roll controller/runtime pools.
    # For controller-first use, first pre-stage new here while current remains
    # old and verify it through the proxy; only then publish new as current and
    # old here and roll controller/runtime pools. The pre-staged token covers a
    # controller request that arrives before the proxy observes the role swap.
    # Remove the old token after all workloads advertise the new generation.
    # previousTokenValidUntil must be an absolute RFC3339/RFC3339Nano time no
    # later than previousTokenOverlap from when the proxy loads it.
    previousTokenKey: previous-token
    previousToken: ""
    previousTokenValidUntilKey: previous-token-valid-until
    previousTokenValidUntil: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
      ephemeral-storage: 128Mi

# orka.harness.v1 data plane configuration. It is rendered only when
# controller.mode is harness-v1 and is never an ACP fallback.
harnessV1:
  dispatch:
    interval: 1s
    workers: 1
  upgradeDrain:
    # Before an upgrade, rollback, or deletion mutates an existing wrapper, a
    # Helm hook durably closes admission and proves that no unsettled turns
    # remain. Keep this below Helm's default five-minute operation timeout.
    timeout: 4m
    pollInterval: 2s
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
        ephemeral-storage: 64Mi
  image:
    repository: ghcr.io/orka-agents/orka/agent-harness-wrapper
    tag: "0.1.1"
    # Required when controller.mode is harness-v1. Tags are never accepted for
    # a running wrapper.
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    # Use a dedicated operator-created Secret. Bearer credentials are never
    # accepted through Helm values or emitted into rendered release manifests.
    # The Secret source and key are immutable while a harness-v1 wrapper
    # Deployment exists because controller attempts pin its resourceVersion.
    existingSecret: ""
    tokenKey: token
  tls:
    # Use a different operator-created Secret containing tls.crt, tls.key, and
    # ca.crt. Its serving certificate must authenticate the release-scoped
    # Service DNS name: <release>-orka-agent-harness-wrapper.<namespace>.svc.
    existingSecret: ""
    # Bump this non-secret revision whenever certificate data changes without
    # changing existingSecret. The chart drains the live wrapper before it
    # restarts both the wrapper and controller onto the new TLS generation.
    rolloutNonce: ""
  ledger:
    # The admission ledger is always PVC-backed when harness v1 is enabled.
    size: 1Gi
    storageClass: ""
    # Controller-acknowledged terminal records remain replay-safe for this
    # audit/backup window before bounded wrapper GC may reclaim them.
    retention: 720h
  # Codex defaults to workspace-write. Broader modes require explicit policy.
  codexSandboxMode: workspace-write
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 2Gi

# Worker configuration
workers:
  ai:
    image:
      repository: ghcr.io/orka-agents/orka/ai-worker
      tag: "0.1.1"
      pullPolicy: IfNotPresent

  general:
    image:
      repository: ghcr.io/orka-agents/orka/general-worker
      tag: "0.1.1"

# GitHub webhook and label-trigger configuration.
# Configure a repository webhook to POST to /webhooks/github with the secret below.
github:
  webhook:
    # Kubernetes Secret containing the GitHub webhook shared secret.
    secretName: ""
    secretKey: secret
  labelTrigger:
    # Default runtime Agent CR used for labels such as agent:implement.
    agent: ""
    # Optional namespace for created Tasks; defaults to controller.watchNamespace or default.
    namespace: ""
    # Optional Secret name mounted into agent workspaces for git/GitHub auth.
    gitSecret: ""
    # Label prefix that marks an Orka trigger.
    prefix: "agent:"
    timeout: "30m"
    maxTurns: 100
    # Optional action-specific Agent overrides, e.g. implement: codex-agent.
    agents: {}

# Service configuration
service:
  type: ClusterIP
  port: 8080

# ServiceAccount configuration
serviceAccount:
  # Create the service account
  create: true
  # Name of the service account (auto-generated if not set)
  name: ""
  # Annotations to add to the service account
  annotations: {}

# RBAC configuration
rbac:
  # Create RBAC resources
  create: true

# CRDs use Helm's static crds/ lifecycle and are not controlled by values.
# Run `helm show readme <chart reference or archive>` before upgrading or
# using --skip-crds.

# Security context for pods
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 65532

# Security context for containers
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Additional labels
labels: {}

# Additional annotations
annotations: {}

# SQLite store configuration
store:
  path: /data/orka.db
  persistence:
    enabled: true        # ACP control records, gateway history, and Session state require durable RWO storage
    size: 1Gi
    storageClass: ""     # use cluster default
    accessMode: ReadWriteOnce

# Client ServiceAccount for API access
client:
  # Create a client service account
  create: true
  # Name of the client service account
  name: orka-client
  # Namespace for the client service account. Empty defaults to
  # controller.watchNamespace. A different namespace is not supported by an
  # isolated installation.
  namespace: ""
