{{- if include "orka.webhookTLSGenerated" . }}
{{- /*
Release-owned webhook TLS Secret. The chart creates it empty; the controller's
certificate rotator populates tls.crt, tls.key, ca.crt, and ca.key, the kubelet
projects them into the controller's cert directory, and the rotator renews the
serving certificate before expiry and keeps the ValidatingWebhookConfiguration
caBundle in sync. Live data is carried forward verbatim so a Helm upgrade can
never blank the certificate, and the keep policy preserves the CA across helm
uninstall so a reinstall does not need to re-establish trust.
*/ -}}
{{- $name := include "orka.webhookTLSSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if and $existing $existing.data }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- end }}
{{- end }}
