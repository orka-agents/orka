{{- include "orka.validateHarnessV1" . }}
{{- if .Values.harnessV1.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orka.harnessV1Name" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-harness-wrapper
  template:
    metadata:
      labels:
        {{- include "orka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-harness-wrapper
        orka.ai/network-role: harness-v1
    spec:
      serviceAccountName: {{ include "orka.harnessV1Name" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wrapper
          image: {{ include "orka.imageRef" .Values.harnessV1.image | quote }}
          imagePullPolicy: {{ .Values.harnessV1.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ORKA_HARNESS_WRAPPER_RUNTIME
              value: multi
            - name: ORKA_HARNESS_WRAPPER_LISTEN_ADDR
              value: :8080
            - name: ORKA_HARNESS_WRAPPER_BEARER_TOKEN_FILE
              value: /var/run/orka/harness-wrapper/token
            - name: ORKA_HARNESS_WRAPPER_ADMISSION_LEDGER_PATH
              value: /var/lib/orka/harness-v1/admission-ledger.db
            - name: ORKA_ALLOW_BASH
              value: "true"
            - name: ORKA_HARNESS_WRAPPER_CHILD_UID
              value: "1000"
            - name: ORKA_HARNESS_WRAPPER_CHILD_GID
              value: "1000"
            - name: ORKA_CODEX_SANDBOX_MODE
              value: {{ .Values.harnessV1.codexSandboxMode | quote }}
          volumeMounts:
            - name: auth
              mountPath: /var/run/orka/harness-wrapper
              readOnly: true
            - name: ledger
              mountPath: /var/lib/orka/harness-v1
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - SETUID
                - SETGID
                - CHOWN
                - KILL
                - FOWNER
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.harnessV1.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: auth
          secret:
            secretName: {{ .Values.harnessV1.auth.existingSecret | default (include "orka.harnessV1AuthSecretName" .) | quote }}
            defaultMode: 0400
            items:
              - key: {{ .Values.harnessV1.auth.tokenKey | quote }}
                path: token
        - name: ledger
          persistentVolumeClaim:
            claimName: {{ include "orka.harnessV1LedgerName" . }}
        - name: tmp
          emptyDir: {}
{{- end }}
