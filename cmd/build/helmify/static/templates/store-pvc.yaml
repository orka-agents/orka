{{- if and .Values.store.persistence.enabled (not .Values.store.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "orka.storePVCName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: store
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.store.persistence.accessMode }}
  {{- if .Values.store.persistence.storageClass }}
  storageClassName: {{ .Values.store.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.store.persistence.size }}
{{- end }}
