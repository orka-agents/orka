apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "orka.fullname" . }}-executionworkspace-core-admission
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["workspace.orka.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["executionworkspaces", "executionworkspaces/status"]
  variables:
    - name: newControllerLabel
      expression: >-
        has(object.metadata.labels) && 'workspace.orka.ai/controller-name' in object.metadata.labels
        ? object.metadata.labels['workspace.orka.ai/controller-name'] : ''
    - name: oldControllerLabel
      expression: >-
        oldObject != null && has(oldObject.metadata.labels) && 'workspace.orka.ai/controller-name' in oldObject.metadata.labels
        ? oldObject.metadata.labels['workspace.orka.ai/controller-name'] : ''
    - name: acpControllerLabelValues
      expression: "['acp.workspace.orka.ai/runtime-pool', 'runtime-pool.acp.workspace.orka.ai']"
    - name: newACPAnnotationKeys
      expression: >-
        has(object.metadata.annotations)
        ? object.metadata.annotations.filter(k, k.startsWith('acp.workspace.orka.ai/')) : []
    - name: oldACPAnnotationKeys
      expression: >-
        oldObject != null && has(oldObject.metadata.annotations)
        ? oldObject.metadata.annotations.filter(k, k.startsWith('acp.workspace.orka.ai/')) : []
    - name: acpMarkersUnchanged
      expression: >-
        (variables.newControllerLabel == variables.oldControllerLabel ||
         (!(variables.newControllerLabel in variables.acpControllerLabelValues) &&
          !(variables.oldControllerLabel in variables.acpControllerLabelValues))) &&
        size(variables.newACPAnnotationKeys) == size(variables.oldACPAnnotationKeys) &&
        variables.newACPAnnotationKeys.all(k, k in variables.oldACPAnnotationKeys) &&
        variables.newACPAnnotationKeys.all(k,
          object.metadata.annotations[k] == oldObject.metadata.annotations[k])
  validations:
    - expression: >-
        !has(object.spec.coreAdmission) ||
        (oldObject != null && has(oldObject.spec.coreAdmission) &&
             object.spec.coreAdmission.admittedGeneration == oldObject.spec.coreAdmission.admittedGeneration &&
             has(object.spec.coreAdmission.poolBinding) == has(oldObject.spec.coreAdmission.poolBinding) &&
             (!has(object.spec.coreAdmission.poolBinding) ||
              (object.spec.coreAdmission.poolBinding.name == oldObject.spec.coreAdmission.poolBinding.name &&
               object.spec.coreAdmission.poolBinding.uid == oldObject.spec.coreAdmission.poolBinding.uid &&
               object.spec.coreAdmission.poolBinding.generation == oldObject.spec.coreAdmission.poolBinding.generation &&
               has(object.spec.coreAdmission.poolBinding.profileHash) == has(oldObject.spec.coreAdmission.poolBinding.profileHash) &&
               (!has(object.spec.coreAdmission.poolBinding.profileHash) ||
                object.spec.coreAdmission.poolBinding.profileHash == oldObject.spec.coreAdmission.poolBinding.profileHash)))) ||
        authorizer.group('workspace.orka.ai')
          .resource('executionworkspaces')
          .namespace(request.namespace)
          .name(object.metadata.name)
          .check('admit').allowed()
      message: only the Orka core controller may establish or advance ExecutionWorkspace core admission
      reason: Forbidden
    - expression: >-
        variables.acpMarkersUnchanged ||
        authorizer.group('workspace.orka.ai')
          .resource('executionworkspaces')
          .namespace(request.namespace)
          .name(object.metadata.name)
          .check('admit').allowed()
      message: >-
        only the Orka core controller may set or change the ACP materialization
        markers (the ACP controller-name label and acp.workspace.orka.ai/
        annotations); forged markers would advertise a physical environment that
        does not exist
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "orka.fullname" . }}-executionworkspace-core-admission
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  policyName: {{ include "orka.fullname" . }}-executionworkspace-core-admission
  validationActions: [Deny]
