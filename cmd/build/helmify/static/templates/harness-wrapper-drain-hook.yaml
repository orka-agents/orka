{{- include "orka.validateHarnessV1" . }}
{{- $wrapperName := include "orka.harnessV1Name" . }}
{{- $desiredGeneration := include "orka.harnessV1PodTemplateGeneration" . }}
{{- $existingWrapper := lookup "apps/v1" "Deployment" .Release.Namespace $wrapperName }}
{{- $needsRollover := false }}
{{- if $existingWrapper }}
{{- $existingGeneration := include "orka.harnessV1ExistingGeneration" $existingWrapper | trim }}
{{- $needsRollover = or (not .Values.harnessV1.enabled) (ne $existingGeneration $desiredGeneration) }}
{{- end }}
{{- if $needsRollover }}
{{- $existingImage := include "orka.harnessV1ExistingImage" $existingWrapper }}
{{- $existingPullPolicy := include "orka.harnessV1ExistingImagePullPolicy" $existingWrapper }}
{{- $existingAuthSecret := include "orka.harnessV1ExistingAuthSecretName" $existingWrapper }}
{{- $existingAuthKey := include "orka.harnessV1ExistingAuthSecretKey" $existingWrapper }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orka.harnessV1DrainName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper-rollover-drain
  annotations:
    helm.sh/hook: pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-harness-wrapper
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "orka.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent-harness-wrapper-rollover-drain
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orka.harnessV1DrainEgressName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper-rollover-drain
  annotations:
    helm.sh/hook: pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-harness-wrapper-rollover-drain
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              {{- include "orka.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent-harness-wrapper
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orka.harnessV1DrainName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper-rollover-drain
  annotations:
    helm.sh/hook: pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "orka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-harness-wrapper-rollover-drain
    spec:
      serviceAccountName: {{ include "orka.harnessV1Name" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: drain
          image: {{ $existingImage | quote }}
          imagePullPolicy: {{ $existingPullPolicy }}
          command: ["/orka-agent-harness-wrapper"]
          args:
            - drain
            - {{ printf "--endpoint=http://%s:8080" $wrapperName | quote }}
            - --bearer-token-file=/var/run/orka/harness-wrapper/token
            - {{ printf "--timeout=%s" .Values.harnessV1.upgradeDrain.timeout | quote }}
            - {{ printf "--poll-interval=%s" .Values.harnessV1.upgradeDrain.pollInterval | quote }}
            - {{ printf "--next-generation=%s" $desiredGeneration | quote }}
          volumeMounts:
            - name: auth
              mountPath: /var/run/orka/harness-wrapper
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: [ALL]
          {{- with .Values.harnessV1.upgradeDrain.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: auth
          secret:
            secretName: {{ $existingAuthSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ $existingAuthKey | quote }}
                path: token
        - name: tmp
          emptyDir: {}
{{- end }}
{{- if .Values.harnessV1.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orka.harnessV1DeleteDrainName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper-delete-drain
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-harness-wrapper
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "orka.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent-harness-wrapper-delete-drain
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orka.harnessV1DeleteDrainEgressName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper-delete-drain
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  podSelector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent-harness-wrapper-delete-drain
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              {{- include "orka.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: agent-harness-wrapper
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orka.harnessV1DeleteDrainName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper-delete-drain
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "orka.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent-harness-wrapper-delete-drain
    spec:
      serviceAccountName: {{ include "orka.harnessV1Name" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: drain
          image: {{ include "orka.imageRef" .Values.harnessV1.image | quote }}
          imagePullPolicy: {{ .Values.harnessV1.image.pullPolicy }}
          command: ["/orka-agent-harness-wrapper"]
          args:
            - drain
            - {{ printf "--endpoint=http://%s:8080" $wrapperName | quote }}
            - --bearer-token-file=/var/run/orka/harness-wrapper/token
            - {{ printf "--timeout=%s" .Values.harnessV1.upgradeDrain.timeout | quote }}
            - {{ printf "--poll-interval=%s" .Values.harnessV1.upgradeDrain.pollInterval | quote }}
          volumeMounts:
            - name: auth
              mountPath: /var/run/orka/harness-wrapper
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: [ALL]
          {{- with .Values.harnessV1.upgradeDrain.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: auth
          secret:
            secretName: {{ .Values.harnessV1.auth.existingSecret | default (include "orka.harnessV1AuthSecretName" .) | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.harnessV1.auth.tokenKey | quote }}
                path: token
        - name: tmp
          emptyDir: {}
{{- end }}
