{{- include "orka.validateAgentExecutionControl" . }}
{{- if .Values.controller.agentExecutionControl.create }}
apiVersion: core.orka.ai/v1alpha1
kind: AgentExecutionControl
metadata:
  name: cluster
  namespace: orka-system
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-execution-control
spec:
  backends:
    v1:
      desiredMode: {{ .Values.controller.agentExecutionControl.v1Mode | quote }}
    v2:
      desiredMode: {{ .Values.controller.agentExecutionControl.v2Mode | quote }}
{{- end }}
