{{- if and .Values.publisher.enabled .Values.scmEgressProxy.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "orka.scmEgressProxyName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    orka.ai/platform-identity: "true"
    app.kubernetes.io/component: scm-egress-proxy
automountServiceAccountToken: false
{{- end }}
