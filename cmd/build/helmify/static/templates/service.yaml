apiVersion: v1
kind: Service
metadata:
  name: {{ include "orka.fullname" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: api
      protocol: TCP
      name: api
    {{- if .Values.harnessV1.enabled }}
    - port: {{ .Values.harnessV1.retirement.port }}
      targetPort: v1-retirement
      protocol: TCP
      name: v1-retirement
    {{- end }}
    - port: {{ .Values.controller.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "orka.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
