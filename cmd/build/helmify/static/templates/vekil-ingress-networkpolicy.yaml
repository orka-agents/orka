{{- if and (eq .Values.controller.mode "harness-v2") .Values.providerProxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orka.vekilIngressPolicyName" . }}
  namespace: vekil-system
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-auth-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vekil
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              orka.ai/network-role: provider-auth-proxy
      ports: [{protocol: TCP, port: 1337}]
{{- end }}
