{{- include "orka.validateHarnessV1" . }}
{{- if and .Values.harnessV1.enabled .Values.harnessV1.policy.create }}
apiVersion: core.orka.ai/v1alpha1
kind: AgentExecutionPolicy
metadata:
  name: {{ .Values.harnessV1.policy.name }}
  namespace: {{ include "orka.harnessV1PolicyNamespace" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: harness-v1-policy
spec:
  allowNewV1Bindings: {{ .Values.harnessV1.policy.allowNewV1Bindings }}
  allowedBuiltInRuntimeTypes:
    {{- toYaml .Values.harnessV1.policy.allowedBuiltInRuntimeTypes | nindent 4 }}
  allowPublicReadOnlyWorkspaces: false
  allowTrustedObservedModeRuntimes: {{ .Values.harnessV1.policy.allowTrustedObservedModeRuntimes }}
  allowedBrokeredToolClasses: []
  retryEligibility: {{ .Values.harnessV1.policy.retryEligibility | quote }}
  prohibitedFields:
    - workspace-credentials
    - forge-credentials
    - direct-publication
    - transaction-tokens
    - observed-write-tools
  networkIsolationProfile: {{ .Values.harnessV1.policy.networkIsolationProfile | quote }}
{{- end }}
