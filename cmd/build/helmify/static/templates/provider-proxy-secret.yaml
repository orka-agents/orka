{{- if and (eq .Values.controller.mode "harness-v2") .Values.providerProxy.enabled (not .Values.providerProxy.auth.existingSecret) }}
{{- $name := include "orka.providerProxyName" . }}
{{- $key := .Values.providerProxy.auth.tokenKey | default "token" }}
{{- $previousKey := .Values.providerProxy.auth.previousTokenKey | default "previous-token" }}
{{- $previousValidUntilKey := .Values.providerProxy.auth.previousTokenValidUntilKey | default "previous-token-valid-until" }}
{{- $previousToken := .Values.providerProxy.auth.previousToken | default "" }}
{{- $previousValidUntil := .Values.providerProxy.auth.previousTokenValidUntil | default "" }}
{{- if or (eq $key $previousKey) (eq $key $previousValidUntilKey) (eq $previousKey $previousValidUntilKey) }}
{{- fail "providerProxy auth token keys must differ" }}
{{- end }}
{{- if ne (empty $previousToken) (empty $previousValidUntil) }}
{{- fail "providerProxy.auth.previousToken and previousTokenValidUntil must be set together" }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingValue := "" }}
{{- if and $existing (hasKey $existing.data $key) }}{{- $existingValue = (index $existing.data $key | b64dec) }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-auth-proxy
type: Opaque
data:
  {{ $key }}: {{ default (default (randAlphaNum 64) $existingValue) .Values.providerProxy.auth.token | toString | b64enc | quote }}
  {{- if $previousToken }}
  {{ $previousKey }}: {{ $previousToken | toString | b64enc | quote }}
  {{ $previousValidUntilKey }}: {{ $previousValidUntil | toString | b64enc | quote }}
  {{- end }}
{{- end }}
