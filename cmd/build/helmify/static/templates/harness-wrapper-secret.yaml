{{- include "orka.validateHarnessV1" . }}
{{- if and .Values.harnessV1.enabled (not .Values.harnessV1.auth.existingSecret) }}
{{- $secretName := include "orka.harnessV1AuthSecretName" . }}
{{- $tokenKey := .Values.harnessV1.auth.tokenKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingToken := "" }}
{{- if and $existing (hasKey $existing.data $tokenKey) }}
{{- $existingToken = (index $existing.data $tokenKey | b64dec) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-harness-wrapper
type: Opaque
stringData:
  {{ $tokenKey }}: {{ default (default (randAlphaNum 48) $existingToken) .Values.harnessV1.auth.token | quote }}
{{- end }}
