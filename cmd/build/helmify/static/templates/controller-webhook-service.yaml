apiVersion: v1
kind: Service
metadata:
  name: {{ include "orka.controllerWebhookServiceName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  # Task status admission must remain available while controller readiness is
  # false during the preStop drain.
  publishNotReadyAddresses: true
  ports:
    - port: 443
      targetPort: webhook
      protocol: TCP
      name: webhook
  selector:
    {{- include "orka.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
