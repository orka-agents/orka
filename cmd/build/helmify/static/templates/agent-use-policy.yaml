      (oldObject != null && has(oldObject.spec.agents) && has(oldObject.spec.agents.researcher) && oldObject.spec.agents.researcher == object.spec.agents.researcher) ||
      authorizer.group('core.orka.ai').resource('agents').namespace(object.spec.agents.researcher.?namespace.orValue(request.namespace)).name(object.spec.agents.researcher.name).check('use').allowed()
