    message: caller is not authorized to use the planner Agent
    reason: Forbidden
  - expression: >-
      !has(object.spec.agents) || !has(object.spec.agents.repairer) ||
      (oldObject != null && has(oldObject.spec.agents) && has(oldObject.spec.agents.repairer) && oldObject.spec.agents.repairer == object.spec.agents.repairer) ||
      authorizer.group('core.orka.ai').resource('agents').namespace(object.spec.agents.repairer.?namespace.orValue(request.namespace)).name(object.spec.agents.repairer.name).check('use').allowed()
    message: caller is not authorized to use the repairer Agent
    reason: Forbidden
  - expression: >-
      !has(object.spec.agents) || !has(object.spec.agents.implementer) ||
      (oldObject != null && has(oldObject.spec.agents) && has(oldObject.spec.agents.implementer) && oldObject.spec.agents.implementer == object.spec.agents.implementer) ||
      authorizer.group('core.orka.ai').resource('agents').namespace(object.spec.agents.implementer.?namespace.orValue(request.namespace)).name(object.spec.agents.implementer.name).check('use').allowed()
    message: caller is not authorized to use the implementer Agent
    reason: Forbidden
