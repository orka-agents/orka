      apiVersions: ["v1alpha1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["repositorymonitors"]
  validations:
  - expression: >-
      !has(object.spec.agents) || !has(object.spec.agents.reviewer) ||
      (oldObject != null && has(oldObject.spec.agents) && has(oldObject.spec.agents.reviewer) && oldObject.spec.agents.reviewer == object.spec.agents.reviewer) ||
