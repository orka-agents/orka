{{- include "orka.validateAdmission" . }}
{{- if .Values.admission.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "orka.admissionName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission
spec:
  podSelector:
    matchLabels:
      {{- include "orka.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admission
  policyTypes: [Ingress, Egress]
  # The ClusterIP is not externally exposed. Permit kube-apiserver webhook
  # traffic and kubelet health probes; their source CIDRs vary across providers.
  ingress:
    - ports:
        - {protocol: TCP, port: 9443}
        - {protocol: TCP, port: 8081}
  # Coexistence validators use a dedicated read-only Kubernetes client. Network
  # policy cannot portably select an externally hosted kube-apiserver endpoint,
  # and implementations may enforce before or after Service DNAT. Permit the
  # Kubernetes Service port and common backend port; the ServiceAccount RBAC
  # contains no Lease or writes.
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
{{- end }}
