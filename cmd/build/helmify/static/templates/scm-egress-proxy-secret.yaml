{{- if and (eq .Values.controller.mode "harness-v2") .Values.publisher.enabled .Values.scmEgressProxy.enabled (not .Values.scmEgressProxy.auth.existingSecret) }}
{{- $name := include "orka.scmEgressProxyAuthSecretName" . }}
{{- $key := .Values.scmEgressProxy.auth.tokenKey | default "token" }}
{{- $explicit := .Values.scmEgressProxy.auth.token | default "" | toString }}
{{- if and $explicit (not (regexMatch "^[A-Za-z0-9._~-]{32,256}$" $explicit)) }}
{{- fail "scmEgressProxy.auth.token must contain 32-256 RFC 3986 unreserved characters" }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingValue := "" }}
{{- if and $existing (hasKey $existing.data $key) }}{{- $existingValue = (index $existing.data $key | b64dec) }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
    app.kubernetes.io/component: scm-egress-proxy
type: Opaque
stringData:
  {{ $key }}: {{ default (default (randAlphaNum 64) $existingValue) $explicit | quote }}
{{- end }}
