# Archived SandboxTemplate from the pre-ACP execution-workspace prototype.
#
# The current ACP v2 path does not consume this template and rejects
# Task.spec.execution.workspace. A future sandbox-backed v2 supervisor must
# receive only sanitized workspace artifacts; Git read/publication credentials
# and direct SCM publication must remain in the separate Workspace/Publisher.
#
# For prototype archaeology only, override the image before applying:
#
#   sed "s|REPLACE_RUNTIME_IMAGE|${ORKA_SANDBOX_RUNTIME_IMAGE}|" \
#     hack/demos/cluster/templates/orka-live-template.yaml | kubectl apply -f -
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: orka-live-template
  namespace: demo-magic
  labels:
    orka.ai/demo: sandbox-template
spec:
  networkPolicyManagement: Unmanaged
  service: true
  podTemplate:
    spec:
      dnsPolicy: ClusterFirst
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: agent
          image: REPLACE_RUNTIME_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/sandbox-runtime"]
          ports:
            - containerPort: 8888
              protocol: TCP
          # Burstable QoS so the kubelet doesn't pick the sandbox pod first
          # under memory pressure. Codex running inside the sandbox can spike
          # well past a BestEffort budget during long-running turns; without
          # explicit limits the kubelet OOMKilled the pod mid-turn, which the
          # router then surfaced as 502 "Connection refused" to the worker.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: app
              mountPath: /app
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: app
          emptyDir: {}
        - name: tmp
          emptyDir: {}
