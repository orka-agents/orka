---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: branchclaims.core.orka.ai
spec:
  group: core.orka.ai
  names:
    kind: BranchClaim
    listKind: BranchClaimList
    plural: branchclaims
    shortNames:
    - bclaim
    singular: branchclaim
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repositoryId
      name: Repository
      type: string
    - jsonPath: .spec.ref
      name: Ref
      type: string
    - jsonPath: .spec.ownerKind
      name: Owner
      type: string
    - jsonPath: .status.generation
      name: Generation
      type: integer
    - jsonPath: .status.availability
      name: Availability
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BranchClaim is the cluster-wide Kubernetes-authoritative ownership and exact
          baseline record for one canonical repository branch.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BranchClaimSpec is the immutable repository/ref ownership
              identity.
            properties:
              id:
                maxLength: 1024
                minLength: 1
                type: string
              ownerKind:
                description: BranchClaimOwnerKind identifies the durable owner of
                  an Orka-managed branch.
                enum:
                - Task
                - Session
                type: string
              ownerUid:
                maxLength: 1024
                minLength: 1
                type: string
              ref:
                maxLength: 1024
                pattern: ^refs/heads/.+$
                type: string
              repositoryId:
                maxLength: 1024
                minLength: 1
                type: string
              requestDigest:
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
            required:
            - id
            - ownerKind
            - ownerUid
            - ref
            - repositoryId
            - requestDigest
            type: object
            x-kubernetes-validations:
            - message: branch claim spec is immutable
              rule: self == oldSelf
          status:
            description: BranchClaimStatus is the exact generation, baseline, and
              availability CAS.
            properties:
              availability:
                description: BranchClaimAvailability gates further branch mutation.
                enum:
                - Available
                - ReconciliationBlocked
                type: string
              blockedReason:
                maxLength: 16384
                type: string
              controllerEpoch:
                description: ControllerEpoch is the exact epoch that performed the
                  last mutation.
                format: int64
                minimum: 1
                type: integer
              controllerEpochLeaseResourceVersion:
                description: |-
                  ControllerEpochLeaseResourceVersion is the resourceVersion of the
                  authoritative controller-epoch Lease observed by the mutation.
                maxLength: 64
                type: string
              controllerEpochName:
                description: |-
                  ControllerEpochName identifies the controller epoch domain checked before
                  the mutation.
                maxLength: 253
                type: string
              createdAt:
                description: CreatedAt is the normalized logical creation time.
                format: date-time
                type: string
              generation:
                format: int64
                minimum: 1
                type: integer
              lastOperationDigest:
                description: LastOperationDigest binds LastOperationID to exact canonical
                  input.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              lastOperationId:
                description: LastOperationID is the last idempotent mutation identity
                  applied.
                maxLength: 1024
                type: string
              lastVerified:
                description: LastVerified is the independently observed exact target
                  ref.
                properties:
                  absent:
                    type: boolean
                  sha:
                    pattern: ^([a-f0-9]{40}|[a-f0-9]{64})$
                    type: string
                required:
                - absent
                type: object
                x-kubernetes-validations:
                - message: absent and sha are mutually exclusive
                  rule: '!(self.absent && has(self.sha) && size(self.sha) > 0)'
              relatedPublicationId:
                maxLength: 1024
                type: string
              updatedAt:
                description: UpdatedAt is the normalized logical mutation time.
                format: date-time
                type: string
              version:
                description: |-
                  Version is the monotonic domain CAS version. It advances once for each
                  successfully persisted logical mutation.
                format: int64
                minimum: 1
                type: integer
            type: object
            x-kubernetes-validations:
            - message: available branch claims must clear block metadata
              rule: '!has(self.availability) || self.availability != ''Available''
                || ((!has(self.blockedReason) || size(self.blockedReason) == 0) &&
                (!has(self.relatedPublicationId) || size(self.relatedPublicationId)
                == 0))'
            - message: reconciliation-blocked branch claims require a reason
              rule: '!has(self.availability) || self.availability != ''ReconciliationBlocked''
                || (has(self.blockedReason) && size(self.blockedReason) > 0)'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
