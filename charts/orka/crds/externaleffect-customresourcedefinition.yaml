---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: externaleffects.core.orka.ai
spec:
  group: core.orka.ai
  names:
    kind: ExternalEffect
    listKind: ExternalEffectList
    plural: externaleffects
    shortNames:
    - eeffect
    singular: externaleffect
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .status.attempts
      name: Attempts
      type: integer
    - jsonPath: .status.version
      name: Version
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ExternalEffect is the Kubernetes-authoritative canonical idempotency record
          for an operation outside SQLite.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ExternalEffectSpec is the immutable canonical identity and request binding.
              The identity namespace intentionally duplicates metadata.namespace so a
              serialized record remains self-describing and can be checked fail-closed.
            properties:
              aggregateId:
                maxLength: 1024
                minLength: 1
                type: string
              id:
                maxLength: 1024
                minLength: 1
                type: string
              identityNamespace:
                maxLength: 1024
                minLength: 1
                type: string
              kind:
                maxLength: 1024
                minLength: 1
                type: string
              operationId:
                maxLength: 1024
                minLength: 1
                type: string
              requestDigest:
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
            required:
            - aggregateId
            - id
            - identityNamespace
            - kind
            - operationId
            - requestDigest
            type: object
            x-kubernetes-validations:
            - message: external effect spec is immutable
              rule: self == oldSelf
          status:
            description: |-
              ExternalEffectStatus contains the mutable state, response, lease, and epoch
              fence for one canonical external effect.
            properties:
              attempts:
                format: int64
                minimum: 0
                type: integer
              controllerEpoch:
                description: ControllerEpoch is the exact epoch that performed the
                  last mutation.
                format: int64
                minimum: 1
                type: integer
              controllerEpochLeaseResourceVersion:
                description: |-
                  ControllerEpochLeaseResourceVersion is the resourceVersion of the
                  authoritative controller-epoch Lease observed by the mutation.
                maxLength: 64
                type: string
              controllerEpochName:
                description: |-
                  ControllerEpochName identifies the controller epoch domain checked before
                  the mutation.
                maxLength: 253
                type: string
              createdAt:
                description: CreatedAt is the normalized logical creation time.
                format: date-time
                type: string
              lastOperationDigest:
                description: LastOperationDigest binds LastOperationID to exact canonical
                  input.
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              lastOperationId:
                description: LastOperationID is the last idempotent mutation identity
                  applied.
                maxLength: 1024
                type: string
              leaseExpiresAt:
                format: date-time
                type: string
              leaseOwner:
                maxLength: 1024
                type: string
              response:
                description: |-
                  Response stores a bounded JSON response for idempotent replay. Large
                  response bodies should remain in the artifact store and be referenced by
                  a compact receipt instead.
                x-kubernetes-preserve-unknown-fields: true
              responseDigest:
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              state:
                description: |-
                  ExternalEffectControlState is the durable state of one idempotent operation
                  performed outside the controller's SQLite transaction boundary.
                enum:
                - Pending
                - InFlight
                - Succeeded
                - Failed
                - OutcomeUnknown
                type: string
              updatedAt:
                description: UpdatedAt is the normalized logical mutation time.
                format: date-time
                type: string
              version:
                description: |-
                  Version is the monotonic domain CAS version. It advances once for each
                  successfully persisted logical mutation.
                format: int64
                minimum: 1
                type: integer
            type: object
            x-kubernetes-validations:
            - message: in-flight external effects require a lease owner and expiry
              rule: '!has(self.state) || self.state != ''InFlight'' || (has(self.leaseOwner)
                && size(self.leaseOwner) > 0 && has(self.leaseExpiresAt))'
            - message: non-in-flight external effects must clear lease fields
              rule: '!has(self.state) || self.state == ''InFlight'' || ((!has(self.leaseOwner)
                || size(self.leaseOwner) == 0) && !has(self.leaseExpiresAt))'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
